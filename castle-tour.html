<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06131a">
<meta name="description" content="جولة القلعة التلقائية بين القاعات الملكية والحدائق والشلالات وإطلالات القمر">
<title>جولة القلعة | Castle Tour</title>
<style>
:root{color-scheme:dark;--gold:#ffe3a1;--mint:#88efd9;--panel:#031820d9;font-family:Tahoma,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden;background:#06151c;color:#fff}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fff5c5;outline-offset:3px}button:disabled{opacity:.4;cursor:default}
#stage{position:fixed;inset:0;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 60% 40%,#266161,#081820 72%)}
#poster,#sceneVideo{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:center;transform:scale(1.06);animation:drift 18s ease-in-out infinite alternate;transition:opacity .6s}
#sceneVideo{opacity:0;z-index:1}#sceneVideo.ready{opacity:1}#poster{z-index:0}
@keyframes drift{from{transform:scale(1.04) translateX(-.35%)}to{transform:scale(1.1) translateX(.35%)}}
#dim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,#000b16d9 0%,#00000005 31%,#00000025 53%,#000d15ec 100%)}
#glints{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}.glint{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3b6;box-shadow:0 0 12px #ffe5ac;animation:glint 8s ease-in-out infinite;opacity:0}
@keyframes glint{0%,100%{opacity:0;transform:translateY(12px)}40%{opacity:.76}75%{transform:translateY(-45px)}}
#header{position:absolute;z-index:12;inset-block-start:0;inset-inline:0;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:calc(13px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left))}
.brand{display:flex;gap:10px;align-items:center;min-width:0}.logo{font-size:29px;display:grid;place-items:center;width:46px;height:46px;border:1px solid #ffe49c99;border-radius:15px;background:#12343abf;box-shadow:0 0 24px #f1d19244}.brand strong{font-size:clamp(13px,2.4vw,22px);color:var(--gold)}.brand small{display:block;font:600 10px/1.8 Arial,sans-serif;letter-spacing:.16em;color:var(--mint)}
.top{display:flex;gap:7px}.pill{min-height:41px;border:1px solid #ffe0a77a;background:#00141bbf;color:#fff9e8;border-radius:15px;padding:8px 13px;backdrop-filter:blur(12px)}.pill[aria-pressed="true"]{background:#20675d;border-color:#a4ffe6}
#plaque{position:absolute;z-index:7;left:50%;top:clamp(100px,17vh,172px);transform:translateX(-50%);max-width:min(94vw,650px);width:max-content;min-width:min(78vw,310px);text-align:center;border:3px double #fff2b3;border-radius:19px;background:linear-gradient(120deg,#654a28e8,#e3bd6be8 22%,#66491ae9 53%,#ddae56e8 90%,#4b3216e9);box-shadow:0 5px 28px #000b,0 0 33px #f3d08444;padding:13px 22px 16px;text-shadow:0 2px 4px #1e1204;transition:opacity .6s,transform .6s;pointer-events:none}
#plaque.hidden{opacity:0;transform:translateX(-50%) translateY(-12px)}#plaque .crown{font-size:28px}#welcome{display:block;font-weight:800;font-size:clamp(14px,3vw,21px)}#guestName{display:block;color:#fff;font-weight:900;font-size:clamp(19px,4vw,29px);max-width:600px;overflow-wrap:anywhere}
#gateIntro{position:absolute;z-index:9;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:20px 15px max(78px,calc(70px + env(safe-area-inset-bottom)));pointer-events:none;overflow:hidden}
#gateIntro::before,#gateIntro::after{content:"";position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(105deg,#120f0bdd,#5b482cdd 22%,#151d1cdd 64%,#73592faa);border:5px ridge #c7a56c;box-shadow:inset 0 0 65px #050b0af5;transition:transform 1.9s cubic-bezier(.15,.7,.1,1)}#gateIntro::before{left:0;border-radius:0 140px 0 0;transform-origin:left}#gateIntro::after{right:0;border-radius:140px 0 0 0;transform-origin:right}
#gateIntro.open::before{transform:perspective(900px) rotateY(-100deg) translateX(-8%)}#gateIntro.open::after{transform:perspective(900px) rotateY(100deg) translateX(8%)}#gateIntro.open{visibility:hidden;transition:visibility 0s 2s}
.introPanel{position:relative;z-index:10;pointer-events:auto;text-align:center;max-width:490px;padding:16px 25px 21px;border-radius:24px;background:var(--panel);border:1px solid #ffe1a67a;box-shadow:0 16px 48px #000b;backdrop-filter:blur(15px)}.introPanel h1{font-size:clamp(21px,4vw,32px);color:var(--gold);margin:0 0 8px}.introPanel p{font-size:14px;line-height:1.75;margin:0 0 14px;color:#d6ede7}.goldBtn{background:linear-gradient(125deg,#eacb86,#fff0c2 45%,#ba833c);border:1px solid #fff8da;border-radius:99px;padding:12px 27px;color:#2d210c;font-weight:900;box-shadow:0 0 22px #f5ce7944;min-height:44px}
#mainControls{position:absolute;z-index:6;inset-inline:0;bottom:max(12px,env(safe-area-inset-bottom));padding:0 clamp(10px,3vw,32px);display:flex;flex-direction:column;align-items:center;gap:11px;opacity:0;pointer-events:none;transform:translateY(15px);transition:opacity .8s,transform .8s}#mainControls.on{opacity:1;pointer-events:auto;transform:none}
.scenePanel{width:min(850px,100%);border:1px solid #ffe1a67a;background:#011721d3;box-shadow:0 12px 40px #000b;border-radius:24px;padding:12px 19px 14px;backdrop-filter:blur(18px);text-align:center}
#sceneTitle{color:#ffe7aa;font-weight:900;font-size:clamp(17px,3vw,26px);margin:0 0 4px}#sceneDescription{font-size:clamp(12px,2vw,14px);line-height:1.7;color:#dcf7ec;margin:0;min-height:24px}
.controlRow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}.ctrl{min-height:42px;background:#15433dcc;border:1px solid #7ed7b78a;border-radius:14px;padding:9px 16px;color:white}.ctrl:hover,.pill:hover{filter:brightness(1.2)}#dots{display:flex;gap:9px;align-items:center;justify-content:center}.dot{width:13px;height:13px;border-radius:50%;padding:0;border:1px solid #ffe4aa;background:#8b9b92b0}.dot.active{background:#ffd58b;box-shadow:0 0 10px #ffe198}
#note{font-size:11px;color:#cbd8d4;line-height:1.6;margin:6px 0 0}#sceneIndex{color:#ffe9b5;font-size:12px}
#toast{position:absolute;z-index:20;top:85px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:13px;background:#042528e8;color:white;opacity:0;transition:opacity .3s;pointer-events:none;max-width:85vw;text-align:center}#toast.show{opacity:1}
@media(max-width:500px){#header{padding-top:calc(8px + env(safe-area-inset-top))}.logo{width:39px;height:39px;font-size:23px}.brand strong{font-size:13px}.brand small{font-size:9px;letter-spacing:.08em}.pill{min-height:36px;padding:7px 10px;font-size:12px}.top{gap:4px}#plaque{top:clamp(90px,17vh,145px);padding:12px 15px}.scenePanel{padding:10px 12px 13px}.controlRow{gap:5px}.ctrl{padding:8px 10px;font-size:13px}.introPanel{padding:13px 17px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#gateIntro.open::before{transform:translateX(-100%)}#gateIntro.open::after{transform:translateX(100%)}}

/* Self-running guided castle tour: no start gate or manual scene-selection buttons. */
#gateIntro{padding:0;pointer-events:none}#gateIntro::before,#gateIntro::after{pointer-events:none}
#mainControls{bottom:max(13px,env(safe-area-inset-bottom));gap:6px}
#mainControls .scenePanel{width:min(690px,100%);padding:10px 14px 10px;background:linear-gradient(140deg,rgba(3,21,30,.9),rgba(5,51,57,.78));border:1px solid #f7d68e77;border-radius:17px}
.sceneHeading{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:5px}
#sceneTitle{margin:0;font-size:clamp(15px,2.9vw,23px)}
#sceneDescription{margin:0;font-size:clamp(11px,2vw,13px);min-height:0}
#sceneIndex{white-space:nowrap;border:1px solid #eac17b69;border-radius:20px;padding:3px 8px;color:#fff3d2;font-size:11px}
#note{font-size:10px;margin:6px 0 0;color:#cde6dd}
.progressTrack{height:5px;width:100%;border-radius:99px;background:#b6c5bf66;overflow:hidden;margin-top:9px}
#progressFill{width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#70ffe8,#ffe299);box-shadow:0 0 9px #ffe4a3}
#progressFill.playing{animation:castleAutoProgress 8200ms linear forwards}
@keyframes castleAutoProgress{from{width:0}to{width:100%}}
@media(max-width:500px){#mainControls .scenePanel{padding:9px 11px}#sceneDescription{line-height:1.4}#plaque{top:clamp(84px,17vh,145px)}}
</style>
</head>
<body>
<div id="stage">
<img id="poster" alt="" src="/assets/castle-tour/gate.jpg">
<video id="sceneVideo" muted loop playsinline webkit-playsinline preload="none" aria-label="مشهد من جولة القلعة"></video>
<div id="dim"></div><div id="glints" aria-hidden="true"></div>
<header id="header"><div class="brand"><span class="logo" aria-hidden="true">🏰</span><div><strong id="brandTitle">جولة القلعة</strong></div></div><div class="top"><button id="langBtn" class="pill" type="button" aria-label="English">EN</button><button id="soundBtn" class="pill" type="button" aria-pressed="false">🔇 <span data-i18n="soundOff">تشغيل الطبيعة</span></button><button id="closeBtn" class="pill" type="button" aria-label="إغلاق">✕</button></div></header>
<div id="plaque" role="status" aria-live="polite"><div class="crown">♛</div><span id="welcome">مرحبًا بك في القلعة</span><span id="guestName">ضيفنا العزيز</span></div>
<div id="gateIntro" aria-hidden="true"></div>
<div id="mainControls"><div class="scenePanel"><div class="sceneHeading"><h2 id="sceneTitle">بوابة القلعة</h2><span id="sceneIndex" aria-live="polite">1 / 9</span></div><p id="sceneDescription">الرحلة تبدأ تلقائيًا</p><div class="progressTrack" aria-hidden="true"><div id="progressFill"></div></div><p id="note" data-i18n="note">جولة تلقائية تشمل القلعة من الداخل والخارج وتعيد التشغيل باستمرار. لتشغيل الصوت اضغط أيقونة الطبيعة.</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),base='/assets/castle-tour/';
// Exterior and interior: each lightweight scene is a silent video with a still-image fallback.
const scenes=[
 {id:'gate',ar:'بوابة القلعة',en:'The Castle Gates',arDesc:'تفتح البوابة طريقًا إلى القلعة المضيئة وسط القمر والنجوم.',enDesc:'The gates open towards the castle beneath the stars and moon.'},
 {id:'courtyard',ar:'الساحة الملكية الخارجية',en:'The Royal Courtyard',arDesc:'ممرات مضيئة وأعمدة رخامية وحدائق متلألئة عند المدخل.',enDesc:'Lantern-lit pathways, marble arches and gardens by the entrance.'},
 {id:'gardens',ar:'حدائق القلعة',en:'Castle Gardens',arDesc:'الزهور والأشجار والبحيرات في ليلة قمرية هادئة.',enDesc:'Flowers, lakes and greenery on a peaceful moonlit night.'},
 {id:'waterfalls',ar:'الشلالات والجسور',en:'Waterfalls and Bridges',arDesc:'شلالات متدفقة وجسور كلاسيكية تحيط بالقلعة.',enDesc:'Flowing waterfalls and classical bridges around the castle.'},
 {id:'great-hall',ar:'القاعة الملكية الكبرى',en:'The Grand Hall',arDesc:'ثريات ذهبية وأقواس كلاسيكية وأرضيات لامعة داخل القلعة.',enDesc:'Golden chandeliers, classical arches and shining marble floors inside.'},
 {id:'throne-room',ar:'قاعة العرش',en:'The Throne Room',arDesc:'مجلس ملكي زمردي وأضواء الشموع وزخارف القلعة القديمة.',enDesc:'An emerald royal throne, candlelight and ornate castle details.'},
 {id:'moon-gallery',ar:'رواق القمر الداخلي',en:'Moonlight Gallery',arDesc:'أروقة ومجالس تطل على البحر من داخل القلعة.',enDesc:'An elegant indoor gallery overlooking the moonlit sea.'},
 {id:'balcony',ar:'شرفة القمر',en:'The Moon Balcony',arDesc:'إطلالة واسعة من القلعة على الجبال والضوء الفضي.',enDesc:'A wide silver-moon panorama of the castle and mountains.'},
 {id:'harbor',ar:'ميناء القلعة',en:'Castle Harbor',arDesc:'الأشرعة والأمواج وأنوار الساحل تنهي الجولة لتبدأ من جديد.',enDesc:'Sailing ships, waves and shoreline lights close the loop.'}
];
const copy={ar:{brand:'جولة القلعة',soundOn:'إيقاف الطبيعة',soundOff:'تشغيل الطبيعة',note:'جولة تلقائية للمشاهد الداخلية والخارجية؛ تعاد من البداية دون نقر. الصوت اختياري.',welcome:'مرحبًا بك في جولة القلعة',guest:'ضيفنا العزيز',close:'إغلاق'},en:{brand:'Castle Tour',soundOn:'Mute nature',soundOff:'Nature sounds',note:'Automatic interior and exterior tour, looping without taps. Sound is optional.',welcome:'Welcome to the Castle Tour',guest:'Our honored guest',close:'Close'}};
const video=$('sceneVideo'),poster=$('poster'),progress=$('progressFill');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SCENE_MS=reduceMotion?10500:8200;
let lang=(document.documentElement.lang||'ar').startsWith('en')?'en':'ar',guest='',current=0,entered=false,loadSeq=0,tourTimer=null,doorTimer=null,plaqueTimer=null,sceneStart=0,remaining=SCENE_MS,closing=false;
const ambient={ctx:null,source:null,noise:null,chirpTimer:null,on:false};
const cleanName=n=>String(n||'').replace(/[\u0000-\u001f\u007f<>]/g,'').trim().slice(0,70);
function tr(k){return copy[lang][k]||k}
function renderLanguage(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=lang==='ar'?'جولة القلعة':'Castle Tour';
 $('brandTitle').textContent=tr('brand');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));
 $('langBtn').textContent=lang==='ar'?'EN':'ع';$('langBtn').setAttribute('aria-label',lang==='ar'?'English':'العربية');
 $('welcome').textContent=tr('welcome');$('guestName').textContent=guest||tr('guest');
 $('soundBtn').lastElementChild.textContent=tr(ambient.on?'soundOn':'soundOff');$('closeBtn').setAttribute('aria-label',tr('close'));
 renderScene();
}
function renderScene(){const sc=scenes[current];$('sceneTitle').textContent=lang==='ar'?sc.ar:sc.en;$('sceneDescription').textContent=lang==='ar'?sc.arDesc:sc.enDesc;$('sceneIndex').textContent=(current+1)+' / '+scenes.length;}
function stopTourTimer(){clearTimeout(tourTimer);tourTimer=null;}
function progressRestart(){progress.classList.remove('playing');progress.style.animation='none';void progress.offsetWidth;progress.style.animation='';progress.style.animationDuration=SCENE_MS+'ms';progress.classList.add('playing')}
function advanceAfter(ms){stopTourTimer();remaining=ms;sceneStart=Date.now();tourTimer=setTimeout(()=>loadScene(current+1),ms);}
function loadScene(index){
 if(closing)return;
 current=((index%scenes.length)+scenes.length)%scenes.length;renderScene();
 const sc=scenes[current],seq=++loadSeq;poster.src=base+sc.id+'.jpg';
 video.pause();video.classList.remove('ready');video.oncanplay=null;video.onerror=null;
 video.removeAttribute('src');video.load();video.poster=base+sc.id+'.jpg';
 video.src=base+sc.id+'.mp4';video.load();
 video.oncanplay=()=>{if(seq!==loadSeq||document.hidden)return;video.play().then(()=>{if(seq===loadSeq)video.classList.add('ready')}).catch(()=>{video.classList.remove('ready')})};
 video.onerror=()=>{if(seq===loadSeq)video.classList.remove('ready')};
 progressRestart();advanceAfter(SCENE_MS);
}
function start(){
 if(entered||closing)return;entered=true;$('gateIntro').classList.add('open');$('plaque').classList.remove('hidden');$('mainControls').classList.add('on');loadScene(0);
 plaqueTimer=setTimeout(()=>$('plaque').classList.add('hidden'),4400);
}
function chirp(){
 if(!ambient.ctx||!ambient.on)return;const ctx=ambient.ctx,now=ctx.currentTime;
 for(let i=0;i<3;i++){const oscillator=ctx.createOscillator(),gain=ctx.createGain(),t=now+i*.14;
 oscillator.type='sine';oscillator.frequency.setValueAtTime(1250+i*120,t);oscillator.frequency.exponentialRampToValueAtTime(1750+i*160,t+.11);
 gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.012,t+.035);gain.gain.exponentialRampToValueAtTime(.0001,t+.18);
 oscillator.connect(gain);gain.connect(ctx.destination);oscillator.start(t);oscillator.stop(t+.19);
 }
}
function soundOn(){
 try{if(!ambient.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();ambient.ctx=ctx;
 const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
 const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;const low=ctx.createBiquadFilter();low.type='lowpass';low.frequency.value=650;const gain=ctx.createGain();gain.gain.value=.065;
 src.connect(low);low.connect(gain);gain.connect(ctx.destination);src.start();ambient.source=src;ambient.noise=gain;}
 ambient.on=true;ambient.ctx.resume();chirp();if(ambient.chirpTimer)clearInterval(ambient.chirpTimer);ambient.chirpTimer=setInterval(chirp,5200);
 }catch(_){ambient.on=false}renderLanguage();
}
function soundOff(){ambient.on=false;clearInterval(ambient.chirpTimer);ambient.chirpTimer=null;if(ambient.ctx)ambient.ctx.suspend();renderLanguage()}
function shutDown(){closing=true;stopTourTimer();clearTimeout(doorTimer);clearTimeout(plaqueTimer);video.pause();if(ambient.on)soundOff();}
$('soundBtn').addEventListener('click',()=>{ambient.on?soundOff():soundOn();$('soundBtn').setAttribute('aria-pressed',String(ambient.on))});
$('langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';renderLanguage()});
$('closeBtn').addEventListener('click',()=>{shutDown();if(window.parent!==window){window.parent.postMessage({type:'sak-castle-close'},location.origin)}else window.location.href='/'});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||!e.data||e.data.type!=='sak-castle-greeting')return;guest=cleanName(e.data.name);if(e.data.lang==='ar'||e.data.lang==='en')lang=e.data.lang;renderLanguage()});
document.addEventListener('visibilitychange',()=>{
 if(!entered||closing)return;
 if(document.hidden){remaining=Math.max(2000,remaining-(Date.now()-sceneStart));stopTourTimer();video.pause();progress.style.animationPlayState='paused';}
 else{video.play().catch(()=>{});progress.style.animationPlayState='running';advanceAfter(remaining);}
});
window.addEventListener('pagehide',shutDown,{once:true});
renderLanguage();doorTimer=setTimeout(start,1100);
if(window.parent!==window)window.parent.postMessage({type:'sak-castle-ready'},location.origin);
})();
</script>
</body>
</html>
