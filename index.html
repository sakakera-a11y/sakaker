<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>abwalqmrzmrd castle</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<style>
:root {
    --bg-1: #021d1a;
    --bg-2: #062e2a;
    --accent: #00ffcc;
    --accent-2: #00d9ad;
    --gold: #ffd700;
    --text: #ffffff;
    --danger: #ff8d8d;
    --shadow: rgba(0, 255, 204, 0.25);
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at top, rgba(0, 255, 204, 0.13), transparent 35%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color: var(--text);
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

body.locked > *:not(#loginOverlay) {
    visibility: hidden !important;
}

body.locked {
    overflow: hidden;
}

button, input {
    font: inherit;
}

#loginOverlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    overflow-x: hidden;
    direction: rtl;
    box-sizing: border-box;
    padding: 30px 15px;
    background:
        linear-gradient(to bottom, rgba(2, 16, 15, 0.65), rgba(3, 27, 24, 0.8)),
        url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
}

#loginBox {
    position: relative;
    width: min(420px, 92%);
    box-sizing: border-box;
    padding: 32px 28px 24px;
    border-radius: 26px;
    background: linear-gradient(145deg, rgba(0,0,0,.72), rgba(0,25,22,.62));
    border: 1px solid rgba(0,255,204,.55);
    box-shadow: 0 0 15px rgba(0,255,204,.25), 0 0 45px rgba(0,255,204,.18), inset 0 0 30px rgba(0,255,204,.04);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: white;
    text-align: center;
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    animation: loginBoxShow .7s ease;
}

@keyframes loginBoxShow {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

#loginLanguageButton {
    position: absolute;
    top: 15px;
    left: 15px;
    min-width: 92px;
    padding: 8px 14px;
    border: 1px solid #00ffcc;
    border-radius: 25px;
    background: rgba(0,0,0,.38);
    color: #00ffcc;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    transition: .25s ease;
    box-shadow: 0 0 10px rgba(0,255,204,.12);
}

#loginLanguageButton:hover {
    background: #00ffcc;
    color: #002b25;
    box-shadow: 0 0 18px rgba(0,255,204,.65);
    transform: translateY(-1px);
}

#loginTitle {
    margin: 18px 0 25px;
    color: #00ffcc;
    font-size: 27px;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(0,255,204,.45);
}

.loginInput {
    width: 100%;
    height: 52px;
    box-sizing: border-box;
    margin: 8px 0;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.14);
    outline: none;
    background: rgba(255,255,255,.10);
    color: white;
    font-size: 15px;
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    transition: border-color .25s, background .25s, box-shadow .25s, transform .25s;
}

.loginInput::placeholder {
    color: rgba(255,255,255,.72);
}

.loginInput:focus {
    background: rgba(0,255,204,.09);
    border-color: #00ffcc;
    box-shadow: 0 0 0 3px rgba(0,255,204,.10), 0 0 15px rgba(0,255,204,.18);
    transform: translateY(-1px);
}

.loginAction {
    width: 100%;
    height: 52px;
    box-sizing: border-box;
    margin-top: 10px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 800;
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    transition: .25s ease;
}

.loginAction:hover {
    transform: translateY(-2px);
}

#loginButton {
    background: linear-gradient(135deg, #00ffcc, #00d9ad);
    color: #00352c;
    box-shadow: 0 5px 18px rgba(0,255,204,.22);
}

#loginButton:hover {
    box-shadow: 0 8px 25px rgba(0,255,204,.42);
}

#googleButton {
    background: rgba(66,133,244,.92);
    color: white;
    box-shadow: 0 5px 15px rgba(0,0,0,.20);
}

#googleButton:hover {
    background: #357ae8;
    box-shadow: 0 8px 22px rgba(66,133,244,.35);
}

#signupButton {
    background: rgba(255,255,255,.07);
    color: #00ffcc;
    border: 1px solid rgba(0,255,204,.65);
}

#signupButton:hover {
    background: rgba(0,255,204,.12);
    box-shadow: 0 0 18px rgba(0,255,204,.15);
}

#loginError {
    min-height: 22px;
    margin: 10px 0 4px;
    color: #ff8d8d;
    font-size: 14px;
    font-weight: bold;
}

#loginCopyright {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.13);
    color: rgba(255,255,255,.78);
    font-size: 13px;
    line-height: 1.9;
}

#loginCopyright .siteName {
    color: #00ffcc;
    font-weight: bold;
}

#loginCopyright .email {
    color: #ffd700;
    text-decoration: none;
    transition:.2s;
}

#loginCopyright .email:hover {
    color: white;
    text-shadow: 0 0 10px #ffd700;
}

#userProfile {
    display: none;
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 99999;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 18px;
    background: rgba(0,0,0,.78);
    border: 1px solid #00ffcc;
    color: white;
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    box-shadow: 0 0 18px rgba(0,255,204,.18);
    backdrop-filter: blur(10px);
}

#userPhoto {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid gold;
    object-fit: cover;
}

#userName {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#logoutButton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 70px;
    height: 38px;
    padding: 5px 12px;
    border: 1px solid gold;
    border-radius: 20px;
    background: linear-gradient(145deg, #fff3a0, #ffd700, #b8860b);
    color: #3a2900;
    font-weight: bold;
    cursor: pointer;
    transition: .25s;
}

#logoutButton:hover {
    transform: scale(1.04);
    box-shadow: 0 0 15px rgba(255,215,0,.45);
}

#facebookVideoIcon {
    position: fixed;
    right: 118px;
    bottom: 50px;
    width: 86px;
    height: 86px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 99999999;
    user-select: none;
    background: transparent;
    border: none;
    transition: transform .35s ease, opacity .5s ease;
    filter: drop-shadow(0 0 8px rgba(0,255,210,.9)) drop-shadow(0 0 18px rgba(0,255,180,.75)) drop-shadow(0 0 30px rgba(255,215,0,.55));
    animation: fbFloat 3s ease-in-out infinite, fbGlow 2s ease-in-out infinite;
}

.fbIconRays {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,210,.30), rgba(0,255,190,.12) 40%, rgba(255,215,0,.08) 55%, transparent 72%);
    box-shadow: 0 0 10px rgba(0,255,200,.8), 0 0 22px rgba(0,255,200,.65), 0 0 42px rgba(255,215,0,.4);
    animation: fbRayPulse 1.5s ease-in-out infinite, fbRayRotate 8s linear infinite;
}

.fbIconCircle {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #65eaff 8%, #1877f2 38%, #0759c7 65%, #003b91 100%);
    border: 1px solid rgba(255,255,255,.75);
    box-shadow: inset 0 0 10px rgba(255,255,255,.5), 0 0 8px rgba(0,191,255,.9), 0 0 18px rgba(0,191,255,.8), 0 0 30px rgba(255,215,0,.45);
    z-index: 2;
    animation: fbCirclePulse 1.8s ease-in-out infinite;
}

.fbIconCircle span {
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
    text-shadow: 0 0 4px #fff, 0 0 10px #00eaff, 0 0 18px #00bfff;
}

.fbIconText {
    position: relative;
    z-index: 3;
    margin-top: 2px;
    color: #fff;
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
    text-shadow: 0 0 5px #00ffd0, 0 0 10px #00ffd0, 0 0 15px #FFD700;
}

#facebookVideoPopup {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0,0,0,.82);
    backdrop-filter: blur(7px);
    z-index: 2147483646;
}

#facebookVideoPopup.active {
    display: flex;
    animation: fbPopupIn .35s ease;
}

.fbVideoBox {
    position: relative;
    width: min(620px, 96vw);
    max-height: 94vh;
    overflow: auto;
    padding: 15px;
    box-sizing: border-box;
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(3,50,39,.98), rgba(4,28,25,.98));
    border: 1px solid rgba(0,255,190,.55);
    box-shadow: 0 0 12px rgba(0,255,190,.65), 0 0 35px rgba(0,255,190,.35), 0 0 60px rgba(255,215,0,.18);
    scrollbar-width: thin;
}

#facebookVideoClose {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    color: #fff;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 0 10px rgba(255,0,80,.55);
    transition: .25s;
}

#facebookVideoClose:hover {
    transform: scale(1.12);
    background: #8b0038;
}

.fbVideoTitle {
    text-align: center;
    color: #fff;
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    font-size: 17px;
    font-weight: 900;
    margin-bottom: 10px;
    text-shadow: 0 0 6px #00ffd0, 0 0 12px #FFD700;
}

.fbVideoTitle span {
    color: #00ffd0;
    margin-left: 5px;
}

.fbVideoFrame {
    width: 100%;
    display: flex;
    justify-content: center;
    overflow: hidden;
    border-radius: 14px;
    background: #000;
    box-shadow: 0 0 20px rgba(0,0,0,.8);
}

.fbVideoFrame iframe {
    display: block;
    width: 560px;
    max-width: 100%;
    height: 493px;
    max-height: 65vh;
    border: none;
}

.fbComments {
    margin-top: 14px;
    padding: 12px;
    border-radius: 15px;
    background: rgba(0,255,190,.055);
    border: 1px solid rgba(0,255,190,.22);
    color: rgba(255,255,255,.9);
    font-family: Tajawal, Tahoma, Arial, sans-serif;
    line-height: 1.8;
}

@keyframes fbFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
}

@keyframes fbGlow {
    0%, 100% { opacity: 1; }
    50% { opacity: .9; }
}

@keyframes fbRayPulse {
    0%, 100% { transform: scale(1); opacity: .85; }
    50% { transform: scale(1.12); opacity: 1; }
}

@keyframes fbRayRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes fbCirclePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

@keyframes fbPopupIn {
    from { opacity: 0; transform: scale(.96); }
    to { opacity: 1; transform: scale(1); }
}

@media (max-width:600px) {
    #loginOverlay {
        padding: 20px 10px;
    }

    #loginBox {
        width: 94%;
        padding: 30px 18px 20px;
        border-radius: 22px;
    }

    #loginTitle {
        font-size: 23px;
        margin-top: 22px;
    }

    #loginLanguageButton {
        top: 12px;
        left: 12px;
        min-width: 82px;
        padding: 7px 10px;
        font-size: 13px;
    }

    .loginInput,
    .loginAction {
        height: 50px;
    }

    #userProfile {
        top: 10px;
        right: 10px;
        max-width: calc(100% - 20px);
    }

    #userName {
        max-width: 100px;
    }

    #logoutButton {
        width: 42px;
        min-width: 42px;
        height: 42px;
        padding: 0;
        border-radius: 50%;
    }

    #logoutText {
        display: none;
    }

    #loginCopyright {
        font-size: 12px;
    }
}

@media (max-width:360px) {
    #loginBox {
        padding: 28px 14px 18px;
    }

    #loginTitle {
        font-size: 21px;
    }

    .loginInput,
    .loginAction {
        height: 48px;
        font-size: 14px;
    }

    #loginCopyright {
        margin-top: 16px;
    }
}
</style>
</head>
<body>
<div id="loginOverlay">
    <div id="loginBox">
        <button id="loginLanguageButton" type="button">العربية</button>
        <h1 id="loginTitle">مرحباً بعودتك</h1>
        <input class="loginInput" id="loginEmail" type="email" placeholder="البريد الإلكتروني أو اسم المستخدم" aria-label="البريد الإلكتروني أو اسم المستخدم" />
        <input class="loginInput" id="loginPassword" type="password" placeholder="كلمة المرور" aria-label="كلمة المرور" />
        <div id="loginError" aria-live="polite"></div>
        <button class="loginAction" id="loginButton" type="button">تسجيل الدخول</button>
        <button class="loginAction" id="googleButton" type="button">الدخول عبر Google</button>
        <button class="loginAction" id="signupButton" type="button">إنشاء حساب جديد</button>

        <div id="loginCopyright">
            <div><span class="siteName">abwalqmrzmrd castle</span></div>
            <div><a class="email" href="mailto:info@abwalqmrzmrd.com">info@abwalqmrzmrd.com</a></div>
        </div>
    </div>
</div>

<div id="userProfile" aria-live="polite">
    <img id="userPhoto" alt="صورة المستخدم" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" />
    <span id="userName">اسم المستخدم</span>
    <button id="logoutButton" type="button"><span id="logoutText">خروج</span></button>
</div>

<button id="facebookVideoIcon" type="button" aria-label="فتح الفيديو">
    <span class="fbIconRays" aria-hidden="true"></span>
    <span class="fbIconCircle" aria-hidden="true"><span>f</span></span>
    <span class="fbIconText">فيديو</span>
</button>

<div id="facebookVideoPopup" role="dialog" aria-modal="true" aria-label="نافذة الفيديو">
    <div class="fbVideoBox">
        <button id="facebookVideoClose" type="button" aria-label="إغلاق">×</button>
        <div class="fbVideoTitle">فيديو <span>Facebook</span></div>
        <div class="fbVideoFrame">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0" allowfullscreen title="فيديو التوضيح"></iframe>
        </div>
        <div class="fbComments">
            مرحباً بك في صفحة الفيديو. يمكنك فتح هذا الفيديو من داخل النافذة كإضافة تفاعلية للعناصر المصممة داخل الصفحة.
        </div>
    </div>
</div>

<script>
const loginOverlay = document.getElementById('loginOverlay');
const loginError = document.getElementById('loginError');
const loginButton = document.getElementById('loginButton');
const googleButton = document.getElementById('googleButton');
const signupButton = document.getElementById('signupButton');
const logoutButton = document.getElementById('logoutButton');
const userProfile = document.getElementById('userProfile');
const loginLanguageButton = document.getElementById('loginLanguageButton');

function showLogin() {
    loginOverlay.style.display = 'flex';
    document.body.classList.add('locked');
}

function hideLogin() {
    loginOverlay.style.display = 'none';
    document.body.classList.remove('locked');
}

function showProfile(name) {
    const userName = document.getElementById('userName');
    userName.textContent = name || 'اسم المستخدم';
    userProfile.style.display = 'flex';
    hideLogin();
}

function loginAttempt() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
        loginError.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور.';
        return;
    }

    loginError.textContent = '';
    showProfile(email.split('@')[0] || 'اسم المستخدم');
}

loginButton.addEventListener('click', loginAttempt);

googleButton.addEventListener('click', function () {
    loginError.textContent = '';
    showProfile('Google User');
});

signupButton.addEventListener('click', function () {
    loginError.textContent = 'يمكنك إنشاء الحساب من خلال صفحة التسجيل الرسمية.';
});

logoutButton.addEventListener('click', function () {
    userProfile.style.display = 'none';
    showLogin();
    document.getElementById('loginPassword').value = '';
});

loginLanguageButton.addEventListener('click', function () {
    const isArabic = loginLanguageButton.textContent.trim() === 'العربية';
    loginLanguageButton.textContent = isArabic ? 'English' : 'العربية';
    document.documentElement.lang = isArabic ? 'en' : 'ar';
    document.documentElement.dir = isArabic ? 'ltr' : 'rtl';
    document.body.dir = isArabic ? 'ltr' : 'rtl';
});

const facebookVideoIcon = document.getElementById('facebookVideoIcon');
const facebookVideoPopup = document.getElementById('facebookVideoPopup');
const facebookVideoClose = document.getElementById('facebookVideoClose');

facebookVideoIcon.addEventListener('click', function () {
    facebookVideoPopup.classList.add('active');
});

facebookVideoClose.addEventListener('click', function () {
    facebookVideoPopup.classList.remove('active');
});

facebookVideoPopup.addEventListener('click', function (event) {
    if (event.target === facebookVideoPopup) {
        facebookVideoPopup.classList.remove('active');
    }
});

document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
        facebookVideoPopup.classList.remove('active');
    }
});

showLogin();
</script>
</body>
</html>
