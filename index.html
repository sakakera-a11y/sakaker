<script>
const birdBtn = document.getElementById('bird-sound-btn');
const birdAudio = document.getElementById('bird-sound');

// حالة أولية
birdBtn.textContent = "🐦";

// عند النقر على الأيقونة
birdBtn.addEventListener('click', async () => {
  try {
    if (birdAudio.paused) {
      await birdAudio.play();
      birdBtn.textContent = "🔊";
      birdBtn.style.boxShadow = "0 0 35px rgba(0,255,200,1), 0 0 70px rgba(0,255,200,0.6)";

      birdBtn.style.boxShadow = "0 0 25px rgba(0,255,200,0.9), 0 0 50px rgba(0,255,200,0.4)";

<script>

function updateOceanClock(){

const now=new Date();

const days=[
"الأحد",
"الإثنين",
"الثلاثاء",
"الأربعاء",
"الخميس",
"الجمعة",
"السبت"
];

const months=[
"يناير",
"فبراير",
"مارس",
"أبريل",
"مايو",
"يونيو",
"يوليو",
"أغسطس",
"سبتمبر",
"أكتوبر",
"نوفمبر",
"ديسمبر"
];

const h=String(now.getHours()).padStart(2,"0");
const m=String(now.getMinutes()).padStart(2,"0");
const s=String(now.getSeconds()).padStart(2,"0");

document.getElementById("clockTime").textContent=
`${h}:${m}:${s}`;

document.getElementById("clockDate").textContent=
`${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

}

updateOceanClock();

setInterval(updateOceanClock,1000);

</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

/* Firebase */

const firebaseConfig = {
  apiKey: "AIzaSyCZw747d_KJa85KTDSOVI8EeX_J9Grpqrk",
  authDomain: "sakaker-9247f.firebaseapp.com",
  projectId: "sakaker-9247f",
  storageBucket: "sakaker-9247f.firebasestorage.app",
  messagingSenderId: "689588937441",
  appId: "1:689588937441:web:4d17a1d02e72189bbfcda0",
  measurementId: "G-RB0V6GTVER"
};

const app = initializeApp(firebaseConfig);
getAnalytics(app);
const auth = getAuth(app);

/* دخول بالبريد */

document.getElementById("emailLogin").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    document.getElementById("loginError").textContent =
      "أدخل البريد الإلكتروني وكلمة المرور";
    return;
  }

  try {

    await signInWithEmailAndPassword(auth, email, password);

  } catch (e) {

    document.getElementById("loginError").textContent = e.message;

  }

};

/* Google */

document.getElementById("googleLogin").onclick = async () => {

  try {

    await signInWithPopup(auth, new GoogleAuthProvider());

  } catch (e) {

    document.getElementById("loginError").textContent = e.message;

  }

};

/* عند نجاح تسجيل الدخول */

onAuthStateChanged(auth, (user) => {

  if (user) {

    document.getElementById("loginOverlay").style.display = "none";

    document.body.classList.remove("login-lock");

  } else {

    document.getElementById("loginOverlay").style.display = "flex";

    document.body.classList.add("login-lock");

  }

});

</script>

</body>

<script type="module">


import { initializeApp }

import { getAnalytics }

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
setPersistence,
browserLocalPersistence,
signOut
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import { getFirestore }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


import { getStorage }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";



const firebaseConfig = {
  apiKey: "AIzaSyCZw747d_KJa85KTDSOVI8EeX_J9Grpqrk",
  authDomain: "sakaker-9247f.firebaseapp.com",
  projectId: "sakaker-9247f",
  storageBucket: "sakaker-9247f.firebasestorage.app",
  messagingSenderId: "689588937441",
  appId: "1:689588937441:web:4d17a1d02e72189bbfcda0",
  measurementId: "G-RB0V6GTVER"
};



const app=initializeApp(firebaseConfig);


const analytics=getAnalytics(app);

const auth=getAuth(app);

const db=getFirestore(app);

const storage=getStorage(app);



window.firebaseApp=app;

window.firebaseAuth=auth;

window.firebaseDB=db;

window.firebaseStorage=storage;



await setPersistence(
auth,
browserLocalPersistence
);



const overlay=document.getElementById("loginOverlay");

const email=document.getElementById("emailInput");

const pass=document.getElementById("passwordInput");

const error=document.getElementById("loginError");



/* دخول */

document.getElementById("loginButton").onclick=async()=>{


try{


await signInWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};



/* إنشاء حساب */

document.getElementById("signupButton").onclick=async()=>{


try{


await createUserWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};




/* Google */

document.getElementById("googleButton").onclick=async()=>{


const provider=new GoogleAuthProvider();


try{


await signInWithPopup(
auth,
provider
);


}catch(e){

error.textContent="❌ "+e.message;

}


};





/* مراقبة الدخول */

onAuthStateChanged(auth,(user)=>{


if(user){


overlay.style.display="none";

document.body.classList.remove("locked");


document.getElementById("userProfile").style.display="flex";


document.getElementById("userName").textContent =
user.displayName || user.email;


document.getElementById("userPhoto").src =
user.photoURL ||
"https://cdn-icons-png.flaticon.com/512/149/149071.png";


}else{


overlay.style.display="flex";

document.body.classList.add("locked");


document.getElementById("userProfile").style.display="none";


}


});





/* خروج */

document.getElementById("logoutButton").onclick=async()=>{

await signOut(auth);

};



console.log("SAKAKER Firebase Ready");

</script>
