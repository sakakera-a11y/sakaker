import { initializeApp }

import { getAnalytics }

onAuthStateChanged,
setPersistence,
browserLocalPersistence,
signOut
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import { getFirestore }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


import { getStorage }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";



const firebaseConfig = {
  apiKey: "AIzaSyCZw747d_KJa85KTDSOVI8EeX_J9Grpqrk",
  authDomain: "sakaker-9247f.firebaseapp.com",
  projectId: "sakaker-9247f",
  storageBucket: "sakaker-9247f.firebasestorage.app",
  messagingSenderId: "689588937441",
  appId: "1:689588937441:web:4d17a1d02e72189bbfcda0",
  measurementId: "G-RB0V6GTVER"
};



const app=initializeApp(firebaseConfig);


const analytics=getAnalytics(app);

const auth=getAuth(app);

const db=getFirestore(app);

const storage=getStorage(app);



window.firebaseApp=app;

window.firebaseAuth=auth;

window.firebaseDB=db;

window.firebaseStorage=storage;



await setPersistence(
auth,
browserLocalPersistence
);



const overlay=document.getElementById("loginOverlay");

const email=document.getElementById("emailInput");

const pass=document.getElementById("passwordInput");

const error=document.getElementById("loginError");



/* دخول */

document.getElementById("loginButton").onclick=async()=>{


try{


await signInWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};



/* إنشاء حساب */

document.getElementById("signupButton").onclick=async()=>{


try{


await createUserWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};




/* Google */

document.getElementById("googleButton").onclick=async()=>{


const provider=new GoogleAuthProvider();


try{


await signInWithPopup(
auth,
provider
);


}catch(e){

error.textContent="❌ "+e.message;

}


};





/* مراقبة الدخول */

onAuthStateChanged(auth,(user)=>{


if(user){


overlay.style.display="none";

document.body.classList.remove("locked");


document.getElementById("userProfile").style.display="flex";


document.getElementById("userName").textContent =
user.displayName || user.email;


document.getElementById("userPhoto").src =
user.photoURL ||
"https://cdn-icons-png.flaticon.com/512/149/149071.png";


}else{


overlay.style.display="flex";

document.body.classList.add("locked");


document.getElementById("userProfile").style.display="none";


}


});





/* خروج */

document.getElementById("logoutButton").onclick=async()=>{

await signOut(auth);

};



console.log("SAKAKER Firebase Ready");

</script>

    language =
        language === "ar"
        ? "en"
        : "ar";

    applyLanguage();

};


/* =========================================================
   OPEN / CLOSE
========================================================= */

chatButton.onclick =
function(){

    chatWindow.style.display =
        "flex";

    chatButton.style.display =
        "none";

    setTimeout(
        () => userNameInput.focus(),
        100
    );

};


closeButton.onclick =
function(){

    chatWindow.style.display =
        "none";

    chatButton.style.display =
        "block";

};


/* =========================================================
   WORD COUNT
========================================================= */

function getWordCount(text){

    return text
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;

}


/* =========================================================
   FIREBASE LOGIN
========================================================= */

signInAnonymously(auth)

.then(result => {

    currentUser =
        result.user;

    connection.textContent =
        translations[
            language
        ].connected;

    connection.style.color =
        "#21e58a";

    console.log(
        "Firebase UID:",
        currentUser.uid
    );

    startRealtimeListeners();

})

.catch(error => {

    console.error(
        "Firebase Authentication Error:",
        error
    );

    connection.textContent =
        translations[
            language
        ].disconnected;

    connection.style.color =
        "#ff6666";

});


/* =========================================================
   LISTENERS
========================================================= */

function startRealtimeListeners(){

    if(listenersStarted){

        return;

    }

    listenersStarted =
        true;


    onValue(

        ref(
            db,
            "onlineUsers"
        ),

        renderOnlineUsers,

        error => {

            console.error(
                "Online users error:",
                error
            );

        }

    );


    onChildAdded(

        query(
            ref(
                db,
                "publicChat"
            ),

            limitToLast(100)

        ),

        renderMessage,

        error => {

            console.error(
                "Public chat error:",
                error
            );

        }

    );

}


/* =========================================================
   USERS
========================================================= */

function renderOnlineUsers(snapshot){

    usersList.replaceChildren();

    let count =
        0;


    snapshot.forEach(
        child => {

            const data =
                child.val();

            if(
                !data ||
                typeof data.name !==
                "string"
            ){

                return;

            }


            count++;


            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "chatUser";


            const dot =
                document.createElement(
                    "span"
                );

            dot.className =
                "onlineDot";


            const name =
                document.createElement(
                    "span"
                );

            name.textContent =
                data.name;


            item.append(
                dot,
                name
            );

            usersList.appendChild(
                item
            );

        }
    );


    onlineCount.textContent =
        count;

}


/* =========================================================
   MESSAGE RENDER
========================================================= */

function renderMessage(snapshot){

    const data =
        snapshot.val();


    if(
        !data ||
        typeof data.text !==
        "string"
    ){

        return;

    }


    /*
       إذا كانت الرسالة انتهت
       نحاول حذفها مباشرة.
    */

    if(
        data.expiresAt &&
        Date.now() >=
        Number(data.expiresAt)
    ){

        remove(snapshot.ref)
        .catch(
            error =>
            console.error(
                "Expired message:",
                error
            )
        );

        return;

    }


    welcome.style.display =
        "none";


    const message =
        document.createElement(
            "div"
        );

    message.className =
        "chatMessage";


    const username =
        document.createElement(
            "div"
        );

    username.className =
        "messageUser";

    username.textContent =
        data.name ||
        "Visitor";


    const text =
        document.createElement(
            "div"
        );

    text.className =
        "messageText";

    text.textContent =
        data.text;


    message.append(
        username,
        text
    );


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;


    /*
       حذف الرسالة من الواجهة
       بعد انتهاء الخمس دقائق.
    */

    if(data.expiresAt){

        const remaining =
            Number(data.expiresAt) -
            Date.now();


        if(remaining > 0){

            setTimeout(
                async () => {

                    try{

                        await remove(
                            snapshot.ref
                        );

                        if(
                            message.parentNode
                        ){

                            message.remove();

                        }

                    }catch(error){

                        console.error(
                            "Message expiration:",
                            error
                        );

                    }

                },
                remaining
            );

        }

    }

}


/* =========================================================
   REGISTER USER
========================================================= */

async function registerOnlineUser(){

    if(
        !currentUser ||
        !myName
    ){

        return false;

    }


    myUserRef =
        ref(
            db,
            `onlineUsers/${currentUser.uid}`
        );


    try{

        /*
           نسجل المستخدم أولًا.
        */

        await set(
            myUserRef,
            {

                name:
                myName,

                uid:
                currentUser.uid,

                joinedAt:
                Date.now()

            }
        );


        /*
           ثم نحدد أن Firebase
           يحذف المستخدم عند
           انقطاع الاتصال.
        */

        await onDisconnect(
            myUserRef
        ).remove();


        return true;


    }catch(error){

        console.error(
            "Register Online User Error:",
            error
        );

        return false;

    }

}


/* =========================================================
   ENTER CHAT
========================================================= */

async function enterPublicChat(){

    const name =
        userNameInput.value.trim();


    if(
        name.length < 2
    ){

        alert(
            translations[
                language
            ].nameError
        );

        return;

    }


    if(
        !currentUser
    ){

        alert(
            translations[
                language
            ].wait
        );

        return;

    }


    myName =
        name;


    enterChat.disabled =
        true;

    enterChat.textContent =
        translations[
            language
        ].joining;


    const success =
        await registerOnlineUser();


    enterChat.disabled =
        false;


    if(!success){

        enterChat.textContent =
            translations[
                language
            ].join;

        alert(
            translations[
                language
            ].onlineError
        );

        return;

    }


    loginArea.style.display =
        "none";

    sendArea.style.display =
        "flex";


    messageInput.focus();

}


enterChat.onclick =
enterPublicChat;


userNameInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            enterPublicChat();

        }

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendPublicMessage(){

    const text =
        messageInput.value.trim();


    if(!text){

        alert(
            translations[
                language
            ].empty
        );

        return;

    }


    const words =
        getWordCount(text);


    if(
        words > MAX_WORDS
    ){

        alert(
            translations[
                language
            ].maxWords
        );

        return;

    }


    if(
        !currentUser ||
        !myName
    ){

        return;

    }


    sendButton.disabled =
        true;

    sendButton.textContent =
        translations[
            language
        ].sending;


    try{

        const messageRef =
            push(
                ref(
                    db,
                    "publicChat"
                )
            );


        /*
           الرسالة تنتهي بعد 5 دقائق.
        */

        const expiresAt =
            Date.now() +
            MESSAGE_LIFETIME;


        await set(
            messageRef,
            {

                name:
                myName,

                text:
                text,

                timestamp:
                serverTimestamp(),

                expiresAt:
                expiresAt,

                uid:
                currentUser.uid

            }
        );


        messageInput.value =
            "";


    }catch(error){

        console.error(
            "Send Message Error:",
            error
        );

        alert(
            translations[
                language
            ].sendError
        );

    }


    sendButton.disabled =
        false;

    sendButton.textContent =
        translations[
            language
        ].send;

    messageInput.focus();

}


sendButton.onclick =
sendPublicMessage;


messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendPublicMessage();

        }

    }
);


/* =========================================================
   START
========================================================= */

applyLanguage();

</script>
