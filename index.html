<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import { getAnalytics }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";


import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
setPersistence,
browserLocalPersistence,
signOut
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import { getFirestore }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


import { getStorage }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";



const firebaseConfig = {
  apiKey: "AIzaSyCZw747d_KJa85KTDSOVI8EeX_J9Grpqrk",
  authDomain: "sakaker-9247f.firebaseapp.com",
  projectId: "sakaker-9247f",
  storageBucket: "sakaker-9247f.firebasestorage.app",
  messagingSenderId: "689588937441",
  appId: "1:689588937441:web:4d17a1d02e72189bbfcda0",
  measurementId: "G-RB0V6GTVER"
};



const app=initializeApp(firebaseConfig);


const analytics=getAnalytics(app);

const auth=getAuth(app);

const db=getFirestore(app);

const storage=getStorage(app);



window.firebaseApp=app;

window.firebaseAuth=auth;

window.firebaseDB=db;

window.firebaseStorage=storage;



await setPersistence(
auth,
browserLocalPersistence
);



const overlay=document.getElementById("loginOverlay");

const email=document.getElementById("emailInput");

const pass=document.getElementById("passwordInput");

const error=document.getElementById("loginError");



/* دخول */

document.getElementById("loginButton").onclick=async()=>{


try{


await signInWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};



/* إنشاء حساب */

document.getElementById("signupButton").onclick=async()=>{


try{


await createUserWithEmailAndPassword(
auth,
email.value,
pass.value
);


}catch(e){

error.textContent="❌ "+e.message;

}

};




/* Google */

document.getElementById("googleButton").onclick=async()=>{


const provider=new GoogleAuthProvider();


try{


await signInWithPopup(
auth,
provider
);


}catch(e){

error.textContent="❌ "+e.message;

}


};





/* مراقبة الدخول */

onAuthStateChanged(auth,(user)=>{


if(user){


overlay.style.display="none";

document.body.classList.remove("locked");


document.getElementById("userProfile").style.display="flex";


document.getElementById("userName").textContent =
user.displayName || user.email;


document.getElementById("userPhoto").src =
user.photoURL ||
"https://cdn-icons-png.flaticon.com/512/149/149071.png";


}else{


overlay.style.display="flex";

document.body.classList.add("locked");


document.getElementById("userProfile").style.display="none";


}


});





/* خروج */

document.getElementById("logoutButton").onclick=async()=>{

await signOut(auth);

};



console.log("SAKAKER Firebase Ready");

</script>

<script>
// 🔹 حركة الألوان المتغيرة للأيقونة
setInterval(() => {
  const btn = document.getElementById('support-toggle-btn');
  const colors = [
    'linear-gradient(45deg, #007bff, #00ffff)',
    'linear-gradient(45deg, #ff1493, #ff69b4)',
    'linear-gradient(45deg, #00ffcc, #0066ff)',
    'linear-gradient(45deg, #ff9900, #ff66cc)',
  ];
  btn.style.background = colors[Math.floor(Math.random() * colors.length)];
  btn.style.boxShadow = `0 0 20px ${btn.style.background.split(',')[1] || 'rgba(255,255,255,0.6)'}`;
}, 1000);

// 🔹 فتح/إغلاق القائمة مع تأثير لطيف
const supportBtn = document.getElementById('support-toggle-btn');
const supportSection = document.getElementById('support-section');

supportBtn.addEventListener('click', () => {
  if (supportSection.style.display === 'none' || supportSection.style.display === '') {
    supportSection.style.display = 'block';
    setTimeout(() => {
      supportSection.style.opacity = 1;
      supportSection.style.transform = 'translateX(0)';
    }, 10);
  } else {
    supportSection.style.opacity = 0;
    supportSection.style.transform = 'translateX(20px)';
    setTimeout(() => { supportSection.style.display = 'none'; }, 400);
  }
});
</script>
