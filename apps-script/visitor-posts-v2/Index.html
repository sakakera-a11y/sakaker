<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>مشاركات الزوار | Castle Visitor Posts</title>
  <style>
    :root{color-scheme:dark;--gold:#efd276;--mint:#68e6d0;--panel:rgba(8,27,35,.94)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:clamp(12px,3vw,28px);font-family:Tahoma,Arial,sans-serif;color:#f7fbff;background:radial-gradient(circle at 15% 8%,#315b63 0,transparent 35%),radial-gradient(circle at 85% 85%,#3f285d 0,transparent 38%),linear-gradient(145deg,#08151d,#102c35 55%,#111e31);display:grid;place-items:center}
    .shell{width:min(760px,100%);padding:1px;border-radius:26px;background:linear-gradient(135deg,#f5d876,#53dfd0 45%,#b57dff);box-shadow:0 22px 70px #0009,0 0 30px #58ead333}
    .panel{position:relative;overflow:hidden;border-radius:25px;padding:clamp(18px,4vw,32px);background:linear-gradient(145deg,rgba(5,24,32,.97),rgba(12,35,45,.95));backdrop-filter:blur(16px)}
    .panel:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#fff0a8,#62f3dc,#a78aff,#fff0a8)}
    header{text-align:center;margin-bottom:24px}
    .gull{width:56px;height:44px;filter:drop-shadow(0 0 12px #ffd94a);margin-bottom:6px}
    h1{font-size:clamp(21px,5vw,30px);margin:0;color:#fff0b2;text-shadow:0 0 18px #eecb6a55}
    .subtitle{margin:9px auto 0;color:#c7dce6;line-height:1.7;font-size:14px}
    .drop{display:grid;place-items:center;gap:9px;min-height:180px;padding:24px;text-align:center;border:1px dashed #73dfd1;border-radius:20px;background:linear-gradient(140deg,#12343a99,#17283d99);transition:.2s}
    .drop.drag{border-color:#ffe27c;background:#604d2644;transform:scale(1.01)}
    .file-icon{font-size:38px;filter:drop-shadow(0 0 12px #6de3d6)}
    .drop strong{font-size:17px;color:#effffb}
    .hint{font-size:12px;color:#adc6d1;line-height:1.6}
    .choose,.save,.action{border:0;border-radius:13px;padding:12px 18px;font-weight:800;font-family:inherit;cursor:pointer;touch-action:manipulation}
    .choose{color:#071c24;background:linear-gradient(135deg,#ffe998,#62e6d3);box-shadow:0 8px 22px #56ddcb33}
    input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
    .selected{display:none;margin-top:16px;padding:13px 15px;border-radius:13px;border:1px solid #548b8a;background:#0a2530;color:#e6ffff;word-break:break-word}
    .selected.show{display:block}
    .save{width:100%;margin-top:14px;color:#0b1e27;background:linear-gradient(110deg,#f2d679,#6ce5d4);font-size:16px}
    .save:disabled,.action:disabled{opacity:.45;cursor:not-allowed}
    .status{min-height:26px;margin:12px 0 0;text-align:center;color:#bfeee6;font-size:14px;line-height:1.6}
    .admin{display:none;margin-top:24px;padding-top:20px;border-top:1px solid #ffffff26}
    .admin.show{display:block}
    .admin h2{margin:0 0 12px;color:#ffe69a;font-size:18px}
    .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;margin:9px 0;border:1px solid #ffffff20;border-radius:14px;background:#ffffff08}
    .item-name{min-width:0;overflow-wrap:anywhere;font-size:13px}
    .actions{display:flex;gap:7px;flex:none}
    .action{padding:9px 11px;font-size:12px}
    .approve{background:#75e5b0;color:#0b2b20}
    .remove{background:#ff9898;color:#371010}
    .empty{color:#bdd0d8;font-size:13px}
    footer{margin-top:18px;text-align:center;color:#91aab6;font-size:11px}
    @media(max-width:520px){body{padding:0}.shell{width:100%;min-height:100dvh;border-radius:0}.panel{min-height:100dvh;border-radius:0;padding:22px 16px calc(20px + env(safe-area-inset-bottom))}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.action{flex:1}.drop{min-height:160px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="title">
      <header>
        <svg class="gull" viewBox="0 0 100 76" aria-hidden="true"><path fill="#ffd700" d="M5 43c16-16 29-21 43-15 12 5 18 4 26-5-2 14-14 22-29 18-14-4-23 1-40 15 7-1 15-5 21-9-4 7-12 13-21 15 12 1 25-4 34-13 10-9 20-9 31-4-13-1-22 7-31 16C29 80 9 71 5 43Z"/><path fill="#ffd700" d="M30 34c10-18 24-27 46-27-6 8-11 17-14 25-9 7-18 7-32 2Z"/></svg>
        <h1 id="title">مشاركات الزوار</h1>
        <p class="subtitle" id="intro">ارفع ملفك ليُحفظ في قائمة المراجعة الخاصة.</p>
      </header>
      <div class="drop" id="drop">
        <span class="file-icon" aria-hidden="true">✦</span>
        <strong id="dropTitle">اختر ملفًا لرفعه</strong>
        <span class="hint" id="fileHint">صور، مستندات، وملفات فيديو قصيرة · الحد الأقصى 10 MB</span>
        <label class="choose" for="fileInput" id="chooseLabel">اختيار ملف</label>
        <input id="fileInput" type="file" accept="image/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.mp4,.webm,.mov,video/*">
      </div>
      <div class="selected" id="selected" aria-live="polite"></div>
      <button class="save" id="saveBtn" type="button" disabled>حفظ الملف للمراجعة</button>
      <p class="status" id="status" role="status" aria-live="polite">جارٍ التحقق من تسجيل دخول الموقع…</p>
      <section class="admin" id="admin" aria-labelledby="adminTitle">
        <h2 id="adminTitle">لوحة المشرف · الملفات قيد المراجعة</h2>
        <div id="pendingList"></div>
      </section>
      <footer id="footer">Castle Visitor Posts · sakaker.co</footer>
    </section>
  </main>

  <script>
    const TEXT = {
      ar: {title:"مشاركات الزوار",intro:"ارفع ملفك ليُحفظ في قائمة المراجعة الخاصة.",dropTitle:"اختر ملفًا لرفعه",fileHint:"صور، مستندات، وملفات فيديو قصيرة · الحد الأقصى 10 MB",choose:"اختيار ملف",save:"حفظ الملف للمراجعة",checking:"جارٍ التحقق من تسجيل دخول الموقع…",signin:"سجّل الدخول إلى الموقع أولًا لرفع الملفات.",select:"اختر ملفًا أولًا.",size:"الحد الأقصى لحجم الملف 10 MB.",video:"مدة الفيديو لا تتجاوز دقيقة واحدة.",ready:"الملف جاهز للحفظ.",sending:"جارٍ حفظ الملف في المراجعة الخاصة…",saved:"تم حفظ الملف في قائمة المراجعة الخاصة.",failed:"تعذر حفظ الملف. حاول مرة أخرى.",adminTitle:"لوحة المشرف · الملفات قيد المراجعة",empty:"لا توجد ملفات قيد المراجعة.",approve:"اعتماد",remove:"حذف",approved:"تم اعتماد الملف.",deleted:"تم حذف الملف."},
      en: {title:"Visitor Posts",intro:"Upload a file to save it in the private review queue.",dropTitle:"Choose a file to upload",fileHint:"Images, documents, and short videos · 10 MB maximum",choose:"Choose file",save:"Save file for review",checking:"Checking site sign-in…",signin:"Sign in to the site before uploading.",select:"Choose a file first.",size:"Maximum file size is 10 MB.",video:"Videos must be one minute or shorter.",ready:"File is ready to save.",sending:"Saving file to the private review queue…",saved:"File saved in the private review queue.",failed:"Could not save the file. Please try again.",adminTitle:"Admin · Pending files",empty:"No files are waiting for review.",approve:"Approve",remove:"Delete",approved:"File approved.",deleted:"File deleted."}
    };
    const allowedOrigins = new Set(["https://sakaker.co","https://www.sakaker.co","https://sakakera-a11y.github.io"]);
    const el = id => document.getElementById(id);
    let idToken = "";
    let isAdmin = false;
    let selectedFile = null;
    let language = "ar";
    let pendingRecords = [];

    function setLanguage(value) {
      language = value === "en" ? "en" : "ar";
      const t = TEXT[language];
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      el("title").textContent = t.title;
      el("intro").textContent = t.intro;
      el("dropTitle").textContent = t.dropTitle;
      el("fileHint").textContent = t.fileHint;
      el("chooseLabel").textContent = t.choose;
      el("saveBtn").textContent = t.save;
      el("adminTitle").textContent = t.adminTitle;
      if (!idToken) el("status").textContent = t.checking;
      renderPending(pendingRecords);
    }
    function setStatus(message, error) {
      el("status").textContent = message;
      el("status").style.color = error ? "#ffaaaa" : "#bfeee6";
    }
    function fileChanged(file) {
      selectedFile = file || null;
      const box = el("selected");
      const t = TEXT[language];
      if (!selectedFile) {
        box.classList.remove("show");
        el("saveBtn").disabled = true;
        return;
      }
      if (selectedFile.size > 10 * 1024 * 1024) {
        selectedFile = null;
        box.classList.remove("show");
        el("saveBtn").disabled = true;
        setStatus(t.size, true);
        return;
      }
      box.textContent = selectedFile.name + " · " + (selectedFile.size / 1048576).toFixed(2) + " MB";
      box.classList.add("show");
      el("saveBtn").disabled = !idToken;
      setStatus(t.ready, false);
      if (selectedFile.type.startsWith("video/")) {
        const probe = document.createElement("video");
        probe.preload = "metadata";
        probe.onloadedmetadata = function() {
          URL.revokeObjectURL(probe.src);
          if (probe.duration > 60) {
            selectedFile = null;
            box.classList.remove("show");
            el("saveBtn").disabled = true;
            setStatus(t.video, true);
          }
        };
        probe.src = URL.createObjectURL(selectedFile);
      }
    }
    function renderPending(records) {
      pendingRecords = records || [];
      const host = el("pendingList");
      host.innerHTML = "";
      if (!isAdmin) return;
      if (!pendingRecords.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = TEXT[language].empty;
        host.appendChild(p);
        return;
      }
      pendingRecords.forEach(record => {
        const row = document.createElement("div");
        row.className = "item";
        const name = document.createElement("div");
        name.className = "item-name";
        const link = document.createElement("a");
        link.href = record.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = record.fileName;
        link.style.color = "#bfeee6";
        name.appendChild(link);
        const actions = document.createElement("div");
        actions.className = "actions";
        const approve = document.createElement("button");
        approve.className = "action approve";
        approve.textContent = TEXT[language].approve;
        approve.onclick = () => runAdminAction("approveVisitorFile", record.id, TEXT[language].approved);
        const remove = document.createElement("button");
        remove.className = "action remove";
        remove.textContent = TEXT[language].remove;
        remove.onclick = () => runAdminAction("deleteVisitorFile", record.id, TEXT[language].deleted);
        actions.append(approve, remove);
        row.append(name, actions);
        host.appendChild(row);
      });
    }
    function loadState() {
      google.script.run.withSuccessHandler(state => {
        isAdmin = Boolean(state && state.isAdmin);
        el("admin").classList.toggle("show", isAdmin);
        renderPending(state && state.pending || []);
      }).withFailureHandler(err => setStatus(err.message || TEXT[language].signin, true)).getVisitorState(idToken);
    }
    function runAdminAction(method, recordId, successText) {
      setStatus(TEXT[language].sending, false);
      google.script.run.withSuccessHandler(() => {
        setStatus(successText, false);
        loadState();
      }).withFailureHandler(err => setStatus(err.message || TEXT[language].failed, true))[method](idToken, recordId);
    }
    el("fileInput").addEventListener("change", event => fileChanged(event.target.files[0]));
    el("drop").addEventListener("dragover", event => { event.preventDefault(); el("drop").classList.add("drag"); });
    el("drop").addEventListener("dragleave", () => el("drop").classList.remove("drag"));
    el("drop").addEventListener("drop", event => {
      event.preventDefault();
      el("drop").classList.remove("drag");
      if (event.dataTransfer.files[0]) fileChanged(event.dataTransfer.files[0]);
    });
    el("saveBtn").addEventListener("click", () => {
      const t = TEXT[language];
      if (!idToken) return setStatus(t.signin, true);
      if (!selectedFile) return setStatus(t.select, true);
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = String(reader.result).split(",")[1] || "";
        setStatus(t.sending, false);
        el("saveBtn").disabled = true;
        google.script.run.withSuccessHandler(() => {
          selectedFile = null;
          el("fileInput").value = "";
          el("selected").classList.remove("show");
          setStatus(t.saved, false);
          el("saveBtn").disabled = true;
          if (isAdmin) loadState();
        }).withFailureHandler(err => {
          el("saveBtn").disabled = false;
          setStatus(err.message || t.failed, true);
        }).saveVisitorFile({idToken:idToken,fileName:selectedFile.name,mimeType:selectedFile.type,base64:base64});
      };
      reader.onerror = () => setStatus(t.failed, true);
      reader.readAsDataURL(selectedFile);
    });
    window.addEventListener("message", event => {
      if (event.source !== window.parent || !allowedOrigins.has(event.origin)) return;
      const data = event.data || {};
      if (data.type !== "sakakerVisitorAuth" || !data.token) return;
      idToken = String(data.token);
      setLanguage(data.lang);
      el("saveBtn").disabled = !selectedFile;
      setStatus(language === "en" ? "Signed in to the site." : "تم التحقق من تسجيل دخول الموقع.", false);
      loadState();
    });
    setLanguage("ar");
  </script>
</body>
</html>
