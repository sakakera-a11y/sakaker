name: Set Static Main Background Temp

on:
  push:
    paths:
      - '.github/workflows/set-static-main-background-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set generated image as main site background
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          image_url = 'https://raw.githubusercontent.com/sakakera-a11y/sakaker/main/%D8%B3%D9%81%D9%8A%D9%86%D8%A9%20%D8%A7%D9%84%D9%82%D9%85%D8%B1%20%D9%81%D9%88%D9%82%20%D8%A7%D9%84%D9%85%D8%AD%D9%8A%D8%B7%E0%B8%AD%E0%B8%B1%E0%B8%99%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B9%88%E0%B8%B2.png'

          # Disable the old dynamically-created main background video paths only.
          text = text.replace('function loggedIn(){return!!document.body&&!document.body.classList.contains("locked")}',
                              'function loggedIn(){return false}')
          text = text.replace('function refreshBackgrounds(){setVideoSource(document.getElementById("sakakerMainVideoBackground"))}',
                              'function refreshBackgrounds(){return}')
          text = text.replace('const ids=["sakakerMainVideoBackground"];', 'const ids=[];')
          text = text.replace('const main=document.getElementById("sakakerMainVideoBackground");const LOGIN_SRC=',
                              'const main=null;const LOGIN_SRC=')

          marker = 'sakaker-static-main-background-final'
          if marker not in text:
              addition = f'''\n<style id="{marker}">\nhtml body:not(.locked){{\n  background-color:#03141e !important;\n  background-image:url("{image_url}") !important;\n  background-position:center center !important;\n  background-size:cover !important;\n  background-repeat:no-repeat !important;\n  background-attachment:fixed !important;\n}}\nhtml body:not(.locked) #sakakerMainVideoBackground{{\n  display:none !important;\n  visibility:hidden !important;\n  opacity:0 !important;\n}}\n@media(max-width:700px){{\n  html body:not(.locked){{\n    background-attachment:scroll !important;\n    background-position:center center !important;\n  }}\n}}\n</style>\n<script id="sakaker-static-main-background-controller">\n(function(){{\n  "use strict";\n  function stopOldMainVideo(){{\n    const v=document.getElementById("sakakerMainVideoBackground");\n    if(!v)return;\n    try{{v.pause()}}catch(_){{}}\n    v.preload="none";\n    v.removeAttribute("autoplay");\n    v.removeAttribute("src");\n    v.querySelectorAll("source").forEach(function(s){{s.removeAttribute("src")}});\n    try{{v.load()}}catch(_){{}}\n    v.style.display="none";\n  }}\n  stopOldMainVideo();\n  document.addEventListener("DOMContentLoaded",stopOldMainVideo,{{once:true}});\n  window.addEventListener("pageshow",stopOldMainVideo);\n  new MutationObserver(function(){{\n    if(!document.body.classList.contains("locked")) stopOldMainVideo();\n  }}).observe(document.body,{{attributes:true,attributeFilter:["class"],childList:true}});\n}})();\n</script>\n'''
              text += addition

          p.write_text(text, encoding='utf-8')

      - name: Verify static background and login video
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'sakaker-static-main-background-final' in s
          assert '%D8%B3%D9%81%D9%8A%D9%86%D8%A9%20%D8%A7%D9%84%D9%82%D9%85%D8%B1' in s
          assert 'gemini_generated_video_be58b3bc.mp4' in s
          assert 'sakLoginBackgroundVideo' in s
          assert 'sakSeaAudio' in s
          print('STATIC_BACKGROUND_VERIFY_OK')

      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use generated ocean image as main background"
          git push
