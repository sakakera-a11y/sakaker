name: Index Audit Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/index-audit-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit index.html
        shell: python
        run: |
          from pathlib import Path
          import re, hashlib, collections

          p=Path('index.html')
          s=p.read_text(encoding='utf-8', errors='ignore')
          print(f'INDEX|bytes={len(s.encode("utf-8"))}|chars={len(s)}|lines={s.count(chr(10))+1}')

          script_matches=list(re.finditer(r'<script\b([^>]*)>(.*?)</script>', s, flags=re.S|re.I))
          style_matches=list(re.finditer(r'<style\b([^>]*)>(.*?)</style>', s, flags=re.S|re.I))

          print(f'INLINE|scripts={len(script_matches)}|script_bytes={sum(len(m.group(2).encode("utf-8")) for m in script_matches)}|styles={len(style_matches)}|style_bytes={sum(len(m.group(2).encode("utf-8")) for m in style_matches)}')

          print('TOP_SCRIPTS_BEGIN')
          for idx,m in sorted(enumerate(script_matches), key=lambda x: len(x[1].group(2).encode('utf-8')), reverse=True)[:30]:
              attrs=m.group(1).strip().replace('\n',' ')[:180]
              body=m.group(2)
              flags=[]
              if re.search(r'\bdocument\.currentScript\b',body): flags.append('currentScript')
              if re.search(r'\bimport\s*(?:\(|["\'])',body): flags.append('import')
              if re.search(r'\bexport\s+',body): flags.append('export')
              if re.search(r'\btype\s*=\s*["\']module["\']',m.group(0),re.I): flags.append('module')
              if re.search(r'</script',body,re.I): flags.append('closeTagText')
              print(f'SCRIPT|idx={idx}|bytes={len(body.encode("utf-8"))}|attrs={attrs}|flags={",".join(flags) or "none"}')
          print('TOP_SCRIPTS_END')

          print('TOP_STYLES_BEGIN')
          for idx,m in sorted(enumerate(style_matches), key=lambda x: len(x[1].group(2).encode('utf-8')), reverse=True)[:30]:
              attrs=m.group(1).strip().replace('\n',' ')[:180]
              body=m.group(2)
              flags=[]
              if 'url(' in body.lower(): flags.append('url')
              if '@import' in body.lower(): flags.append('import')
              print(f'STYLE|idx={idx}|bytes={len(body.encode("utf-8"))}|attrs={attrs}|flags={",".join(flags) or "none"}')
          print('TOP_STYLES_END')

          # duplicated ids / function names for cleanup candidates
          ids=re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']',s,re.I)
          cnt=collections.Counter(ids)
          for k,v in sorted(((k,v) for k,v in cnt.items() if v>1), key=lambda x:x[1], reverse=True):
              print(f'DUP_ID|{v}|{k}')

          funcs=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',s)
          fcnt=collections.Counter(funcs)
          for k,v in sorted(((k,v) for k,v in fcnt.items() if v>1), key=lambda x:x[1], reverse=True):
              print(f'DUP_FUNC|{v}|{k}')
