name: Update Audio Video Final Temp

on:
  push:
    paths:
      - '.github/workflows/update-audio-video-final-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch audio video studio
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import quote

          p = Path('audio-video.html')
          s = p.read_text(encoding='utf-8')

          audio_name = 'فهدبن سعيد ياصاحبي ماتجي بالزياره بخيل_٢٠٢٦٠٤١٣_١٦٣٦٢٥.mp3'
          image_name = 'سفينة القمر فوق المحيطอันว่างเปล่า.png'
          audio_url = '/'+quote(audio_name)
          image_url = '/'+quote(image_name)

          s = s.replace('src="https://upload.wikimedia.org/wikipedia/commons/0/07/Meeresrauschen.ogg"','src="'+audio_url+'"')
          s = s.replace('<img id="siteImage" class="siteimg" alt="صورة الموقع" title="اضغط للمشاهدة بالحجم الكامل">','<img id="siteImage" class="siteimg" alt="صورة الموقع" title="اضغط للمشاهدة بالحجم الكامل" src="'+image_url+'">')

          video_tag = '<video id="siteVideoSource" muted playsinline preload="metadata" crossorigin="anonymous" src="/gemini_generated_video_be58b3bc.mp4"></video>'
          s = s.replace(video_tag,'')

          old_audio_const = "const SITE_AUDIO_URL='https://upload.wikimedia.org/wikipedia/commons/0/07/Meeresrauschen.ogg';"
          new_audio_const = "const SITE_AUDIO_URL='"+audio_url+"';\nconst SITE_IMAGE_URL='"+image_url+"';"
          s = s.replace(old_audio_const,new_audio_const)

          start = s.find("let siteImageData='';")
          end = s.find("function fit(img,t)")
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('site image block not found')
          replacement = '''let siteImageData=SITE_IMAGE_URL;\nfunction viewImg(){const w=window.open(SITE_IMAGE_URL,'_blank','noopener');if(!w)location.href=SITE_IMAGE_URL}\nviewSiteImage.onclick=viewImg;siteImage.onclick=viewImg;downloadSiteImage.onclick=()=>forceDownload(SITE_IMAGE_URL,'sakaker-site-image.png');\n'''
          s = s[:start] + replacement + s[end:]

          marker = "X.fillStyle=g;X.fillRect(0,0,w,h)}"
          branded = "X.fillStyle=g;X.fillRect(0,0,w,h);X.textAlign='center';X.shadowColor='rgba(50,255,230,.9)';X.shadowBlur=18;X.fillStyle='#fff';X.font='900 44px Arial';X.fillText('sakaker.co',w/2,h-42);X.shadowBlur=0}"
          if marker not in s:
              raise SystemExit('fit marker not found')
          s = s.replace(marker,branded,1)

          s = s.replace("downloadSiteAudio.onclick=()=>forceDownload(SITE_AUDIO_URL,'sakaker-site-sound.ogg');","downloadSiteAudio.onclick=()=>forceDownload(SITE_AUDIO_URL,'ya-sahbi-ma-taji.mp3');")

          p.write_text(s, encoding='utf-8')

      - name: Verify update
        shell: python
        run: |
          from pathlib import Path
          s = Path('audio-video.html').read_text(encoding='utf-8')
          assert 'فهدبن سعيد ياصاحبي ماتجي بالزياره بخيل_٢٠٢٦٠٤١٣_١٦٣٦٢٥.mp3' in s or '%D9%81%D9%87%D8%AF%D8%A8%D9%86' in s
          assert 'سفينة القمر فوق المحيط' in s or '%D8%B3%D9%81%D9%8A%D9%86%D8%A9' in s
          assert "fillText('sakaker.co'" in s
          assert 'siteVideoSource' not in s
          assert 'Meeresrauschen.ogg' not in s
          print('AUDIO_VIDEO_FINAL_OK')

      - name: Commit update
        run: |
          if git diff --quiet -- audio-video.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-video.html
          git commit -m "Use site song and ocean image in audio video studio"
          git push
