name: Music Audio Video Upgrade Temp

on:
  push:
    paths:
      - '.github/workflows/music-audio-video-upgrade-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep existing media player and load converter
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          music_url = 'https://raw.githubusercontent.com/sakakera-a11y/sakaker/main/%D9%81%D9%87%D8%AF%D8%A8%D9%86%20%D8%B3%D8%B9%D9%8A%D8%AF%20%D9%8A%D8%A7%D8%B5%D8%A7%D8%AD%D8%A8%D9%8A%20%D9%85%D8%A7%D8%AA%D8%AC%D9%8A%20%D8%A8%D8%A7%D9%84%D8%B2%D9%8A%D8%A7%D8%B1%D9%87%20%D8%A8%D8%AE%D9%8A%D9%84_%D9%A2%D9%A0%D9%A2%D9%A6%D9%A0%D9%A4%D9%A1%D9%A3_%D9%A1%D9%A6%D9%A3%D9%A6%D9%A2%D9%A5.mp3'
          s, n = re.subn(
              r'const remote="https://raw\.githubusercontent\.com/sakakera-a11y/sakaker/main/[^\"]+\.mp3";',
              'const remote="' + music_url + '";',
              s,
              count=1
          )
          print('restored music source refs:', n)

          tag = '<script src="/assets/audio-video-maker.js" defer></script>'
          if tag not in s:
              pos = s.lower().rfind('</body>')
              if pos >= 0:
                  s = s[:pos] + '\n' + tag + '\n' + s[pos:]
              else:
                  s += '\n' + tag + '\n'

          p.write_text(s, encoding='utf-8')

      - name: Verify old player and new converter coexist
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'sakMusicPlayer' in s
          assert 'sakNativeAudio' in s
          assert 'sakNativeVideo' in s
          assert 'sakMediaPlay' in s
          assert 'sakMediaPause' in s
          assert '/assets/audio-video-maker.js' in s
          assert 'فهدبن%20' in s or '%D9%81%D9%87%D8%AF%D8%A8%D9%86' in s
          print('MEDIA_AND_CONVERTER_VERIFY_OK')

      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep media player and add audio video converter"
          git push
