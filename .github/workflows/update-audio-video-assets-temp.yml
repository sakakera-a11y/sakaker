name: Update Audio Video Assets Temp

on:
  push:
    paths:
      - '.github/workflows/update-audio-video-assets-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update audio video studio
        shell: python
        run: |
          from pathlib import Path
          p = Path('audio-video.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('.note{margin-top:14px;padding:12px 14px;font-size:12px;line-height:1.7;color:#d7f4f1}\n@media(max-width:860px){.grid{grid-template-columns:1fr}.side{order:2}}', '''.note{margin-top:14px;padding:12px 14px;font-size:12px;line-height:1.7;color:#d7f4f1}
.assetbar{position:sticky;top:10px;z-index:50;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;margin-bottom:16px}
.assetcard{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;border-radius:16px;background:rgba(0,15,24,.62);border:1px solid rgba(109,255,233,.32)}
.assetinfo{flex:1;min-width:0}.assettitle{font-weight:900;margin-bottom:6px;color:#eafffb}.assetactions{display:flex;gap:7px;flex-wrap:wrap}.mini{padding:8px 11px;font-size:12px;border-radius:10px}
.assetcard audio{width:min(360px,100%);height:38px}.siteimg{width:112px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #62e6dc;background:#02070d;cursor:pointer}
#siteVideoSource{display:none}
@media(max-width:860px){.grid{grid-template-columns:1fr}.side{order:2}.assetbar{grid-template-columns:1fr;position:relative;top:auto}.assetcard{align-items:flex-start}.siteimg{width:96px;height:58px}}''')

          s = s.replace('''  <div class="grid">''', '''  <section class="assetbar glass" aria-label="Site media">
    <div class="assetcard">
      <div class="assetinfo">
        <div class="assettitle" id="siteAudioTitle">🔊 صوت الموقع</div>
        <audio id="siteAudio" controls preload="metadata" src="https://upload.wikimedia.org/wikipedia/commons/0/07/Meeresrauschen.ogg"></audio>
        <div class="assetactions"><button class="btn mini" id="downloadSiteAudio" type="button">⬇ تحميل الصوت</button></div>
      </div>
    </div>
    <div class="assetcard">
      <img id="siteImage" class="siteimg" alt="صورة الموقع" title="اضغط للمشاهدة بالحجم الكامل">
      <div class="assetinfo">
        <div class="assettitle" id="siteImageTitle">🖼️ صورة الموقع</div>
        <div class="assetactions"><button class="btn mini" id="viewSiteImage" type="button">👁 مشاهدة</button><button class="btn mini" id="downloadSiteImage" type="button">⬇ تحميل الصورة</button></div>
      </div>
      <video id="siteVideoSource" muted playsinline preload="metadata" crossorigin="anonymous" src="/gemini_generated_video_be58b3bc.mp4"></video>
    </div>
  </section>
  <div class="grid">''', 1)

          s = s.replace('<div class="stage"><canvas id="canvas" width="1280" height="720"></canvas><div class="watermark">sakaker.co</div></div>', '<div class="stage"><canvas id="canvas" width="1280" height="720"></canvas></div>', 1)
          s = s.replace("X.fillStyle='#fff';X.font='900 44px Arial';X.fillText('sakaker.co',w/2,h-42);X.shadowBlur=0", "X.shadowBlur=0", 1)

          s = s.replace("back:'العودة للموقع'", "back:'العودة للموقع',siteAudio:'🔊 صوت الموقع',downloadAudio:'⬇ تحميل الصوت',siteImage:'🖼️ صورة الموقع',viewImage:'👁 مشاهدة',downloadImage:'⬇ تحميل الصورة'", 1)
          s = s.replace("back:'Back to site'", "back:'Back to site',siteAudio:'🔊 Site sound',downloadAudio:'⬇ Download sound',siteImage:'🖼️ Site image',viewImage:'👁 View',downloadImage:'⬇ Download image'", 1)
          s = s.replace("document.querySelector('a[href=\"/\"]').textContent=t.back;if(!recording)ST.textContent=t.ready", "document.querySelector('a[href=\"/\"]').textContent=t.back;siteAudioTitle.textContent=t.siteAudio;downloadSiteAudio.textContent=t.downloadAudio;siteImageTitle.textContent=t.siteImage;viewSiteImage.textContent=t.viewImage;downloadSiteImage.textContent=t.downloadImage;if(!recording)ST.textContent=t.ready", 1)

          hook = "langBtn.onclick=()=>{lang=lang==='ar'?'en':'ar';tr()};S.oninput=()=>SV.textContent=S.value;"
          addon = r'''langBtn.onclick=()=>{lang=lang==='ar'?'en':'ar';tr()};S.oninput=()=>SV.textContent=S.value;
const SITE_AUDIO_URL='https://upload.wikimedia.org/wikipedia/commons/0/07/Meeresrauschen.ogg';
async function forceDownload(url,name){try{const r=await fetch(url,{mode:'cors'});if(!r.ok)throw new Error('download');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}catch(_){window.open(url,'_blank','noopener')}}
downloadSiteAudio.onclick=()=>forceDownload(SITE_AUDIO_URL,'sakaker-site-sound.ogg');
let siteImageData='';
function captureSiteImage(){const v=document.getElementById('siteVideoSource');const img=document.getElementById('siteImage');const take=()=>{try{const c=document.createElement('canvas');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);siteImageData=c.toDataURL('image/png',.95);img.src=siteImageData}catch(e){console.warn(e)}};v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(.6,Math.max(0,(v.duration||1)/10))}catch(_){take()}},{once:true});v.addEventListener('seeked',take,{once:true});v.addEventListener('loadeddata',()=>{if(!siteImageData)take()},{once:true});v.load()}
function viewImg(){if(siteImageData){const w=window.open('','_blank','noopener');if(w){w.document.write('<title>sakaker.co</title><style>html,body{margin:0;background:#000;height:100%}img{width:100%;height:100%;object-fit:contain}</style><img src="'+siteImageData+'">');w.document.close()}}}
viewSiteImage.onclick=viewImg;siteImage.onclick=viewImg;downloadSiteImage.onclick=()=>{if(!siteImageData)return;const a=document.createElement('a');a.href=siteImageData;a.download='sakaker-site-image.png';document.body.appendChild(a);a.click();a.remove()};
captureSiteImage();'''
          if hook not in s:
              raise SystemExit('translation hook not found')
          s = s.replace(hook, addon, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify studio update
        shell: python
        run: |
          from pathlib import Path
          s=Path('audio-video.html').read_text(encoding='utf-8')
          assert s.count('<div class="brand">sakaker.co') == 1
          assert '<div class="watermark">sakaker.co</div>' not in s
          assert "fillText('sakaker.co'" not in s
          assert 'id="siteAudio"' in s
          assert 'downloadSiteAudio' in s
          assert 'id="siteImage"' in s
          assert 'downloadSiteImage' in s
          assert 'gemini_generated_video_be58b3bc.mp4' in s
          print('AUDIO_VIDEO_ASSETS_OK')

      - name: Commit update
        run: |
          if git diff --quiet -- audio-video.html; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-video.html
          git commit -m "Add fixed site sound and image controls"
          git push
