name: Update login video and verify library

on:
  push:
    paths:
      - '.github/workflows/update-login-video-and-verify-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update login video references and verify library
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          new = '/gemini_video_birds_login.mp4'
          video = Path('gemini_video_birds_login.mp4')
          if not video.exists():
              raise SystemExit('New login video is not present in repository root: gemini_video_birds_login.mp4')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          original_index = index

          pat = re.compile(r'(<video\b(?=[^>]*\bid=["\']sakLoginBackgroundVideo["\'])[^>]*)(>)', re.I|re.S)
          m = pat.search(index)
          if not m:
              raise SystemExit('Login background video element is missing from index.html')
          tag = m.group(1)
          if re.search(r'\bsrc\s*=\s*["\'][^"\']*["\']', tag, re.I):
              tag = re.sub(r'\bsrc\s*=\s*["\'][^"\']*["\']', f'src="{new}"', tag, count=1, flags=re.I)
          else:
              tag += f' src="{new}"'
          index = index[:m.start()] + tag + m.group(2) + index[m.end():]

          login_pos = index.find('sakLoginBackgroundVideo')
          window_end = min(len(index), login_pos + 1500)
          segment = index[login_pos:window_end]
          segment = re.sub(r'(<source\b[^>]*\bsrc\s*=\s*)["\'][^"\']+["\']', rf'\1"{new}"', segment, count=1, flags=re.I)
          index = index[:login_pos] + segment + index[window_end:]

          old_video_pattern = re.compile(r'(?:https://raw\.githubusercontent\.com/sakakera-a11y/sakaker/main/)?/?gemini_generated_video_[A-Za-z0-9_-]+\.mp4', re.I)
          index = old_video_pattern.sub(new, index)
          index = index.replace('https://github.com/sakakera-a11y/sakaker/blob/main/gemini_video_birds_login.mp4', new)
          if index != original_index:
              index_path.write_text(index, encoding='utf-8')

          helper_files = [
              Path('assets/login-rescue.js'),
              Path('.github/scripts/optimize_login_video.py'),
              Path('.github/scripts/diagnose_login_runtime.py'),
              Path('.github/scripts/neutralize_legacy_login_heavy.py'),
          ]
          changed_helpers = []
          for p in helper_files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              old = s
              s = old_video_pattern.sub(new, s)
              s = s.replace('https://github.com/sakakera-a11y/sakaker/blob/main/gemini_video_birds_login.mp4', new)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed_helpers.append(str(p))

          index = index_path.read_text(encoding='utf-8')
          login_match = pat.search(index)
          if not login_match or new not in login_match.group(0):
              raise SystemExit('New login video is not set on sakLoginBackgroundVideo')

          books = Path('books.html').read_text(encoding='utf-8')
          checks = {
              'ship button': 'sakShipStoryLibraryBtn',
              'ship runtime': '/assets/text-library-ship.js',
              'order runtime': '/assets/text-library-order.js',
              'ship label': 'محتوى السفينة',
              'section host': 'sakTextLibrarySections',
          }
          missing = [name for name, needle in checks.items() if needle not in books]
          if missing:
              raise SystemExit('Text library verification failed: ' + ', '.join(missing))

          print('Login video updated to:', new)
          print('Updated helper files:', ', '.join(changed_helpers) if changed_helpers else 'none')
          print('Text library verified: ordered sections + ship content present')
          PY

      - name: Commit updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No content changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/login-rescue.js .github/scripts/optimize_login_video.py .github/scripts/diagnose_login_runtime.py .github/scripts/neutralize_legacy_login_heavy.py
          git commit -m 'Use bird-sound video for login background'
          git push
