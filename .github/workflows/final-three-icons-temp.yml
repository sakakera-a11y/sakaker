name: Final Three Icons Temp

on:
  push:
    paths:
      - '.github/workflows/final-three-icons-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add final trio assets to index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link id="sak-final-business-map-audio-icons-v1" rel="stylesheet" href="/assets/final-three-icons.css">'
          js='<script id="sak-final-business-map-audio-icons-js-v1" src="/assets/final-three-icons.js"></script>'
          if 'sak-final-business-map-audio-icons-v1' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if 'sak-final-business-map-audio-icons-js-v1' not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify final trio
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '/assets/final-three-icons.css' in s
          assert '/assets/final-three-icons.js' in s
          assert Path('assets/final-three-icons.css').exists()
          assert Path('assets/final-three-icons.js').exists()
          print('FINAL_TRIO_OK')
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load glowing star moon sun icon assets"
          git push
