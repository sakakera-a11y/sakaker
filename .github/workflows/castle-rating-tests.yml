name: Castle rating tests

on:
  pull_request:
    paths:
      - "functions/api/castle-rating.js"
      - "migrations/0002_castle_rating.sql"
      - "tests/castle-rating.test.mjs"
      - ".github/workflows/castle-rating-tests.yml"
  push:
    branches:
      - main
    paths:
      - "functions/api/castle-rating.js"
      - "migrations/0002_castle_rating.sql"
      - "tests/castle-rating.test.mjs"
      - ".github/workflows/castle-rating-tests.yml"

permissions:
  contents: read

jobs:
  castle-rating-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run authenticated rating endpoint tests
        run: node --test tests/castle-rating.test.mjs
