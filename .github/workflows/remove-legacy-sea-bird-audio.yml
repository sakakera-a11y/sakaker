name: Remove Legacy Sea Bird Audio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-legacy-sea-bird-audio.yml'
      - '.github/scripts/remove_legacy_sea_bird_audio.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy independent sounds
        run: python .github/scripts/remove_legacy_sea_bird_audio.py
      - name: Verify approved sounds remain
        shell: python
        run: |
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          runtime=Path('assets/main-runtime-locks.js').read_text(encoding='utf-8')
          icons=Path('assets/final-three-icons.js').read_text(encoding='utf-8')
          cleanup=Path('assets/final-ui-cleanup.js').read_text(encoding='utf-8')
          assert 'gemini_video_birds_login.mp4' in runtime
          assert 'gemini_generated_video_34118154.mp4' in icons
          assert 'sakSiteSoundBtn' in icons
          assert 'purgeLegacyIndependentSounds' in cleanup
          print('Only login-video sound and main-site sound path are preserved.')
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/final-ui-cleanup.js
          git commit -m 'Remove legacy independent sea and bird sounds'
          git push
