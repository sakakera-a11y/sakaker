name: Restore ostrich index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ostrich-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore optimized ostrich index
        shell: bash
        run: |
          set -euo pipefail
          git show 2c05c2d3ace385db96f7daf29b781d31bd791b96:.tmp/index_updated_optimized_ostrich.html.gz.b64 > /tmp/index.b64
          base64 -d /tmp/index.b64 > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > index.html
          grep -q 'sak-final-ostrich-art' index.html
          grep -q 'Audio to Video' index.html
          grep -q 'تحويل الصوت' index.html
          echo "Restored index size: $(wc -c < index.html) bytes"

      - name: Commit restored index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Restore optimized ostrich audio-converter index'
          git push origin HEAD:main
