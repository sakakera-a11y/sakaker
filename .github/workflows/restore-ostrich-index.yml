name: Restore ostrich index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ostrich-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore optimized ostrich index
        shell: python
        run: |
          from pathlib import Path
          import subprocess, base64, gzip, re

          ref='2c05c2d3ace385db96f7daf29b781d31bd791b96:.tmp/index_updated_optimized_ostrich.html.gz.b64'
          raw=subprocess.check_output(['git','show',ref], text=True)
          data_text=''.join(raw.split())
          data_text=re.sub(r'[^A-Za-z0-9+/=]','',data_text)
          data_text += '=' * (-len(data_text) % 4)
          packed=base64.b64decode(data_text, validate=False)
          html=gzip.decompress(packed)
          text=html.decode('utf-8')
          required=['sak-final-ostrich-art','Audio to Video','تحويل الصوت']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing expected markers: '+', '.join(missing))
          Path('index.html').write_text(text, encoding='utf-8')
          print('Restored index size:', Path('index.html').stat().st_size)

      - name: Commit restored index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Restore optimized ostrich audio-converter index'
          git push origin HEAD:main
