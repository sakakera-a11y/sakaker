name: Optimize Pong on demand

on:
  push:
    paths:
      - '.github/workflows/optimize-pong-on-demand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pong:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable automatic Pong startup
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('pong.html')
          text = p.read_text(encoding='utf-8')

          # Remove the legacy delayed auto-click that opens Pong without user action.
          text, n = re.subn(
              r'<script>\s*setTimeout\(\(\)=>document\.getElementById\(["\']pongGame-btn["\']\)\?\.click\(\),\s*600\s*\)\s*</script>',
              '',
              text,
              count=1,
              flags=re.S
          )

          # Safety: ensure the background/audio iframe has no live src before user interaction.
          text = re.sub(
              r'(<iframe\s+id=["\']pongGame-video["\'][^>]*?)\s+src=(["\']).*?\2',
              r'\1',
              text,
              count=1,
              flags=re.S|re.I
          )

          p.write_text(text, encoding='utf-8')
          print('Removed auto-start entries:', n)

      - name: Verify Pong is user-initiated only
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('pong.html').read_text(encoding='utf-8')
          assert 'setTimeout(()=>document.getElementById("pongGame-btn")?.click(),600)' not in text
          m = re.search(r'<iframe\s+id=["\']pongGame-video["\'][^>]*>', text, re.S|re.I)
          assert m, 'pongGame-video iframe not found'
          assert not re.search(r'\bsrc=', m.group(0), re.I), 'pongGame-video still has an eager src'
          assert 'data-audio-src=' in m.group(0), 'lazy audio source missing'
          print('Pong now waits for a real user click')

      - name: Commit update
        run: |
          if git diff --quiet -- pong.html; then
            echo "No pong.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pong.html
          git commit -m "Load Pong only when opened"
          git push
