name: Remove visitor counter once

on:
  push:
    paths:
      - '.github/workflows/remove-visitor-counter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visitor counter block from index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div id="sakakerVisitorCounter"'
          start = s.find(marker)
          if start < 0:
              print('Visitor counter block already absent')
          else:
              token_re = re.compile(r'<div\b|</div\s*>', re.I)
              depth = 0
              end = None
              for m in token_re.finditer(s, start):
                  tok = m.group(0).lower()
                  if tok.startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = m.end()
                          break
              if end is None:
                  raise SystemExit('Could not find balanced end of visitor counter div')
              s = s[:start] + s[end:]
              p.write_text(s, encoding='utf-8')

          check = p.read_text(encoding='utf-8')
          if '<div id="sakakerVisitorCounter"' in check:
              raise SystemExit('Visitor counter HTML still present')
          print('Visitor counter HTML removed successfully')
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/remove-visitor-counter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/remove-visitor-counter.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Remove visitor counter permanently'
          git push
