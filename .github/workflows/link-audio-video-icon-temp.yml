name: Link Audio Video Icon Temp

on:
  push:
    paths:
      - '.github/workflows/link-audio-video-icon-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reuse music icon for audio video studio
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('btn.innerHTML="<span>⭐ موسيقى</span>";',
               'btn.innerHTML="<span>🎬 تحويل الصوت لفيديو</span>";'),
              ('btn.onclick=()=>{if(!modal.classList.contains("is-open"))previousOverflow=document.body.style.overflow;modal.classList.add("is-open");document.body.style.overflow="hidden";render();modal.querySelector("#sakRemotePlay").focus()};',
               'btn.onclick=()=>{if(document.body.classList.contains("locked"))return;window.location.href="/audio-video.html"};'),
              ('[music,en?"Music":"موسيقى","⭐"]',
               '[music,en?"Audio to Video":"تحويل الصوت لفيديو","🎬"]'),
              ('en?"Maps, business and music":"الخرائط وبزنس والموسيقى"',
               'en?"Maps, business and audio to video":"الخرائط وبزنس وتحويل الصوت لفيديو"')
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected pattern not found: {old[:90]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify link and login isolation
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '/audio-video.html' in s
          assert 'تحويل الصوت لفيديو' in s
          assert 'Audio to Video' in s
          assert 'sakMusicIcon' in s
          assert 'loginOverlay' in s
          assert 'gemini_generated_video_be58b3bc.mp4' in s
          assert 'btn.innerHTML="<span>⭐ موسيقى</span>";' not in s
          print('AUDIO_VIDEO_ICON_LINK_OK')

      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use music icon for audio video studio"
          git push
