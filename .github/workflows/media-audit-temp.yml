name: Media Audit Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/media-audit-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit media references
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import quote, quote_plus

          media_ext={'.png','.jpg','.jpeg','.webp','.gif','.svg','.mp4','.webm','.mov','.m4v','.mp3','.wav','.ogg'}
          text_ext={'.html','.htm','.css','.js','.json','.md','.txt','.yml','.yaml','.xml','.py'}
          root=Path('.')
          media=[]
          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file():
                  continue
              if p.suffix.lower() in media_ext:
                  media.append(p)

          texts=[]
          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  texts.append((p,p.read_text(encoding='utf-8',errors='ignore')))
              except Exception:
                  pass

          print('MEDIA_AUDIT_BEGIN')
          unused=[]
          for m in sorted(media,key=lambda x:str(x).lower()):
              rel=m.as_posix()
              name=m.name
              candidates={rel,name,quote(rel),quote(name),quote(rel,safe='/'),quote(name,safe=''),quote_plus(name)}
              refs=[]
              for p,s in texts:
                  if p.as_posix()==rel:
                      continue
                  if any(c and c in s for c in candidates):
                      refs.append(p.as_posix())
              size=m.stat().st_size
              status='USED' if refs else 'UNUSED'
              if not refs: unused.append(rel)
              print(f'MEDIA|{status}|{size}|{rel}|REFS={";".join(refs[:20])}')
          print(f'SUMMARY|media={len(media)}|unused={len(unused)}|unused_bytes={sum(Path(x).stat().st_size for x in unused)}')
          print('MEDIA_AUDIT_END')
