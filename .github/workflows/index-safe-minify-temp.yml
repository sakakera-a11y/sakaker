name: Safe Index Minify Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/index-safe-minify-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install safe JS minifier
        run: npm install --no-save --no-package-lock terser@5

      - name: Conservatively minify inline JavaScript and JSON
        shell: node {0}
        run: |
          const fs = require('fs');
          const terser = require('terser');

          (async()=>{
            const path='index.html';
            let html=fs.readFileSync(path,'utf8');
            const beforeBytes=Buffer.byteLength(html,'utf8');
            const beforeScripts=(html.match(/<script\b/gi)||[]).length;
            const beforeStyles=(html.match(/<style\b/gi)||[]).length;
            const beforeIds=(html.match(/\bid\s*=\s*["'][^"']+["']/gi)||[]).length;

            let processed=0, skipped=0, jsonDone=0, jsDone=0;
            const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let out='', last=0, m;
            while((m=re.exec(html))!==null){
              out += html.slice(last,m.index);
              const attrs=m[1]||'';
              const body=m[2]||'';
              let replacement=m[0];
              const hasSrc=/\bsrc\s*=/.test(attrs);
              const typeMatch=attrs.match(/\btype\s*=\s*["']([^"']+)["']/i);
              const type=(typeMatch?typeMatch[1]:'').toLowerCase().trim();

              if(!hasSrc && body.trim()){
                if(type==='application/json'){
                  try{
                    const parsed=JSON.parse(body);
                    const compact=JSON.stringify(parsed);
                    replacement=`<script${attrs}>${compact}</script>`;
                    jsonDone++; processed++;
                  }catch(e){ skipped++; }
                } else if(type==='' || type==='text/javascript' || type==='application/javascript' || type==='module'){
                  try{
                    const result=await terser.minify(body,{
                      compress:false,
                      mangle:false,
                      module:type==='module',
                      format:{comments:false,beautify:false,semicolons:true}
                    });
                    if(result.code){
                      replacement=`<script${attrs}>${result.code}</script>`;
                      jsDone++; processed++;
                    } else skipped++;
                  }catch(e){ skipped++; }
                }
              }
              out += replacement;
              last=re.lastIndex;
            }
            out += html.slice(last);

            // Remove ordinary HTML comments only (keep conditional comments if any).
            out=out.replace(/<!--(?!\[if)[\s\S]*?-->/gi,'');
            // Trim trailing whitespace and collapse fully blank HTML-only lines conservatively.
            out=out.split('\n').map(x=>x.replace(/[ \t]+$/,'')).join('\n');
            out=out.replace(/\n{3,}/g,'\n\n');

            const afterBytes=Buffer.byteLength(out,'utf8');
            const afterScripts=(out.match(/<script\b/gi)||[]).length;
            const afterStyles=(out.match(/<style\b/gi)||[]).length;
            const afterIds=(out.match(/\bid\s*=\s*["'][^"']+["']/gi)||[]).length;

            if(beforeScripts!==afterScripts) throw new Error(`script count changed ${beforeScripts}->${afterScripts}`);
            if(beforeStyles!==afterStyles) throw new Error(`style count changed ${beforeStyles}->${afterStyles}`);
            if(beforeIds!==afterIds) throw new Error(`id count changed ${beforeIds}->${afterIds}`);
            for(const marker of ['loginOverlay','sakLoginBackgroundVideo','gemini_generated_video_be58b3bc.mp4','pong.html','videos.html']){
              if(!out.includes(marker)) throw new Error(`required marker missing: ${marker}`);
            }
            if(afterBytes>=beforeBytes) throw new Error(`No size reduction: ${beforeBytes} -> ${afterBytes}`);

            fs.writeFileSync(path,out,'utf8');
            console.log(`SAFE_MINIFY|before=${beforeBytes}|after=${afterBytes}|saved=${beforeBytes-afterBytes}|processed=${processed}|js=${jsDone}|json=${jsonDone}|skipped=${skipped}`);
          })().catch(e=>{console.error(e);process.exit(1)});

      - name: Verify index remains structurally complete
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<!DOCTYPE html' in s or '<!doctype html' in s.lower()
          assert '</html>' in s.lower()
          assert 'gemini_generated_video_be58b3bc.mp4' in s
          assert 'sakLoginBackgroundVideo' in s
          print('INDEX_VERIFY_OK', len(s.encode('utf-8')))

      - name: Commit optimized index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Safely reduce index size"
          git push
