name: Diagnose login runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/diagnose_login_runtime.py'
      - '.github/workflows/diagnose-login-runtime.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Print login runtime occurrences
        run: python .github/scripts/diagnose_login_runtime.py
