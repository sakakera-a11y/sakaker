name: One-time index icon repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-index-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text, n_business_css = re.subn(
              r'\n?\.sakakerBusinessHidden\s*\{[^{}]*?opacity\s*:\s*0\s*;[^{}]*?visibility\s*:\s*hidden\s*;[^{}]*?pointer-events\s*:\s*none\s*;[^{}]*?transform\s*:\s*scale\(\.5\)\s*;[^{}]*?\}\s*',
              '\n', text, flags=re.S
          )

          business_pattern = re.compile(
              r'<script>\(function\(\)\{const icon=document\.getElementById\("sakakerBusinessIcon"\);.*?showIcon\(\).*?\}\)\(\);</script>',
              re.S
          )
          stable_business = '''<script>(function(){const icon=document.getElementById("sakakerBusinessIcon");const popup=document.getElementById("sakakerBusinessPopup");const close=document.getElementById("sbClose");if(!icon||!popup)return;icon.classList.remove("sakakerBusinessHidden");icon.style.removeProperty("opacity");icon.style.removeProperty("visibility");icon.style.removeProperty("transform");icon.style.removeProperty("pointer-events");icon.addEventListener("click",function(e){e.stopPropagation();popup.style.display="flex"});if(close)close.addEventListener("click",function(){popup.style.display="none"});popup.addEventListener("click",function(e){if(e.target===popup){popup.style.display="none"}});document.addEventListener("keydown",function(e){if(e.key==="Escape"){popup.style.display="none"}})})();</script>'''
          text, n_business_js = business_pattern.subn(stable_business, text, count=1)

          text, n_cycle_css = re.subn(
              r'\n?/\* الدورة لا تمس النوافذ.*?\*/\s*\.sak-icon-cycle\{.*?@media\(prefers-reduced-motion:reduce\)\{\.sak-icon-cycle\{transition:none!important;\}\}\s*',
              '\n', text, flags=re.S
          )
          text, n_cycle_js = re.subn(
              r'\s*<script id="sak-mobile-grid-and-icon-cycle-js">.*?</script>\s*',
              '\n', text, flags=re.S
          )

          guard_id = 'sakaker-icon-visibility-guard-final'
          guard = '''\n<style id="sakaker-icon-visibility-guard-final">\nhtml body #sakakerAllIconsDock{visibility:visible!important;opacity:1!important;}\nhtml body #sakakerAllIconsDock .icon-card{visibility:visible!important;opacity:1!important;pointer-events:auto!important;}\nhtml body #sakakerBusinessIcon{visibility:visible!important;opacity:1!important;pointer-events:auto!important;transform:none!important;}\n</style>\n'''
          if guard_id not in text:
              body_close = text.lower().rfind('</body>')
              if body_close >= 0:
                  text = text[:body_close] + guard + text[body_close:]
              else:
                  text += guard

          html_close = text.lower().rfind('</html>')
          moved_tail = False
          if html_close >= 0 and text[html_close + len('</html>'):].strip():
              tail = text[html_close + len('</html>'):]
              before_html = text[:html_close]
              body_close = before_html.lower().rfind('</body>')
              if body_close >= 0:
                  body_tag_end = body_close + len('</body>')
                  between = before_html[body_tag_end:]
                  before_body = before_html[:body_close]
                  text = before_body.rstrip() + '\n' + between + '\n' + tail.strip() + '\n</body>\n</html>\n'
                  moved_tail = True

          # Remove residual runtime class assignments from obsolete icon cycling code without touching unrelated text.
          text = text.replace('sak-cycle-hidden', '')

          if text == original:
              print('No index changes were needed.')
          else:
              path.write_text(text, encoding='utf-8')
              print('Repair summary:')
              print('business CSS removed:', n_business_css)
              print('business JS replaced:', n_business_js)
              print('cycle CSS removed:', n_cycle_css)
              print('cycle JS removed:', n_cycle_js)
              print('moved trailing content before closing HTML:', moved_tail)
              print('new size:', path.stat().st_size)

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix index icon visibility and HTML closure'
          git push origin HEAD:main
