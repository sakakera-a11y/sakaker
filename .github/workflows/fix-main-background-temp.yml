name: Fix Main Background Temp

on:
  push:
    paths:
      - '.github/workflows/fix-main-background-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace missing main background with current video
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          new_url = 'https://raw.githubusercontent.com/sakakera-a11y/sakaker/main/gemini_generated_video_be58b3bc.mp4'
          old_encoded = 'https://raw.githubusercontent.com/sakakera-a11y/sakaker/main/%D8%B6%D8%B9_%D8%A7%D9%84%D8%A7%D9%85%D9%88%D8%A7%D8%AC_%D8%AA%D8%AA%D9%84%D8%A7%D8%B7%D9%85_%D9%88%D9%83%D8%B0%D9%84%D9%83_%D8%A7%D9%84%D8%B3%D9%81%D9%8A%D9%86.mp4'

          before = text.count(old_encoded)
          text = text.replace(old_encoded, new_url)

          if before == 0:
              print('Old main background URL was already absent')
          else:
              print(f'Replaced {before} old main background reference(s)')

          p.write_text(text, encoding='utf-8')

      - name: Verify background references
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          new_name = 'gemini_generated_video_be58b3bc.mp4'
          old_fragment = '%D8%B6%D8%B9_%D8%A7%D9%84%D8%A7%D9%85%D9%88%D8%A7%D8%AC_%D8%AA%D8%AA%D9%84%D8%A7%D8%B7%D9%85'
          assert new_name in text
          assert old_fragment not in text
          assert 'sakakerMainVideoBackground' in text
          assert 'sakLoginBackgroundVideo' in text
          print('BACKGROUND_VERIFY_OK')

      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use current video for main site background"
          git push
