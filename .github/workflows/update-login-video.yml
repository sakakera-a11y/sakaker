name: Update login background video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-login-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-login-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep login video and remove obsolete yacht patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for old in ('/sakaker-video.mp4','/sakaker-video%20(1).mp4','/sakaker-video (1).mp4'):
              s=s.replace(old,'/sakaker-video%20(2).mp4')
          s=re.sub(
              r'\s*<style\s+id=["\']sakYachtDirectStyle["\'][^>]*>.*?</style>\s*',
              '\n', s, flags=re.I|re.S
          )
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep login video without legacy yacht CSS'
          git push
