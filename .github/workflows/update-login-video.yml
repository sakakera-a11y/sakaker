name: Update login background video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-login-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-login-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep login video and install yacht icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for old in ('/sakaker-video.mp4','/sakaker-video%20(1).mp4','/sakaker-video (1).mp4'):
              s=s.replace(old,'/sakaker-video%20(2).mp4')
          marker='sakYachtDirectStyle'
          if marker not in s:
              patch='''\n<style id="sakYachtDirectStyle">\n#shipIcon_new{background-image:url('/file_00000000e530821086e1b6135c3db20e.png')!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;color:transparent!important;-webkit-text-fill-color:transparent!important;border:2px solid #ffd84d!important;border-radius:50%!important;box-shadow:0 0 8px #fff6b0,0 0 18px #ffd54a,0 0 34px rgba(255,174,0,.95)!important;filter:brightness(1.14) saturate(1.12)!important;animation:sakYachtGlow 2.2s ease-in-out infinite alternate!important;overflow:visible!important}\n#shipIcon_new>*{visibility:hidden!important}\n#shipIcon_new:hover,#shipIcon_new:focus-visible{filter:brightness(1.3) saturate(1.2)!important;box-shadow:0 0 12px #fff,0 0 26px #ffe36b,0 0 44px #ffad00!important}\n@keyframes sakYachtGlow{from{box-shadow:0 0 7px #fff6b0,0 0 15px #ffd54a,0 0 26px rgba(255,174,0,.78)}to{box-shadow:0 0 11px #fff,0 0 24px #ffe36b,0 0 42px rgba(255,174,0,1)}}\n@media(prefers-reduced-motion:reduce){#shipIcon_new{animation:none!important}}\n</style>\n'''
              s=s.replace('</head>',patch+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use glowing yacht image for ship icon'
          git push
