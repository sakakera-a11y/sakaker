name: Install five-differences image pack
on:
  push:
    branches: [main]
    paths:
      - 'assets/castle-newspaper.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract the 30-day image pack
        run: |
          test -f five_differences_30_days_60_images.zip
          mkdir -p /tmp/five-differences
          unzip -q five_differences_30_days_60_images.zip -d /tmp/five-differences
          test "$(find /tmp/five-differences/five_differences_30_days_60_images -type f -name '*.jpg' | wc -l)" -eq 60
          mkdir -p assets/five-differences
          cp -R /tmp/five-differences/five_differences_30_days_60_images/day_* assets/five-differences/
          test "$(find assets/five-differences -type f -name '*.jpg' | wc -l)" -eq 60
      - name: Commit extracted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/five-differences/day_*
          if git diff --cached --quiet; then
            echo "No new image files to commit."
          else
            git commit -m "Add all 30 five-differences image pairs"
            git push
          fi
