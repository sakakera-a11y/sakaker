name: Build bilingual story PDFs
on:
  push:
    branches:
      - prepare-story-ebook-pdfs
    paths:
      - "data/khwater.json"
      - "data/ebook-stories.json"
      - ".github/scripts/build_story_pdfs.py"
      - ".github/workflows/build-story-pdfs.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: story-pdf-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Arabic font and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install reportlab arabic-reshaper python-bidi
      - name: Generate PDFs from canonical story data
        run: python .github/scripts/build_story_pdfs.py
      - name: Validate generated PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path("ebooks/storybook-bilingual.pdf"), *sorted(Path("ebooks/stories").glob("*.pdf"))]
          assert len(files) == 12, f"Expected 12 PDFs, got {len(files)}"
          for path in files:
              assert path.stat().st_size > 3000, f"PDF appears empty: {path}"
              assert path.read_bytes().startswith(b"%PDF-"), f"Invalid PDF: {path}"
          print("Validated combined book and 11 individual PDFs.")
          PY
      - name: Commit generated PDFs to proposal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebooks/
          if git diff --cached --quiet; then
            echo "PDFs are already up to date."
          else
            git commit -m "Generate bilingual story PDFs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
