name: Build Sakaker Official Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "sakaker-official-app/**"
      - ".github/workflows/sakaker-official-android.yml"
    branches:
      - "feature/sakaker-official-android-app"
      - "feature/sakaker-official-twa"
      - "main"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate and prepare Android signing key
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/sakaker-release.jks"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not valid Base64."
            rm -f "$KEYSTORE"
            exit 1
          fi

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "ERROR: The decoded keystore is empty."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Keystore decoded successfully."

      - name: Build Android debug APK and signed release packages
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          gradle -p sakaker-official-app \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Verify signed Android release APK and certificate
        shell: bash
        run: |
          set -euo pipefail

          test -s "$ANDROID_KEYSTORE_PATH"

          APK="$(find sakaker-official-app/app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)"

          AAB="$(find sakaker-official-app/app/build/outputs/bundle/release \
            -type f -name '*.aab' | head -n 1)"

          test -n "$APK"
          test -n "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

          VERIFY_OUTPUT="$(jarsigner -verify "$AAB" 2>&1)"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -q "jar verified."

          echo "APK and AAB signature verification completed."

      - name: Store Android build files in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: sakaker-official-android-${{ github.run_number }}
          path: |
            sakaker-official-app/app/build/outputs/apk/debug/app-debug.apk
            sakaker-official-app/app/build/outputs/apk/release/*.apk
            sakaker-official-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
