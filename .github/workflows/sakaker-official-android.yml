name: Build Sakaker Official Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "sakaker-official-app/**"
      - ".github/workflows/sakaker-official-android.yml"
    branches:
      - "feature/sakaker-official-android-app"
      - "feature/sakaker-official-twa"
      - "main"

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Android release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakaker-release.jks"
      - name: Build debug APK and release packages
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sakaker-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p sakaker-official-app :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Require release signing secrets
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "Release signing secrets are missing; refusing to publish unsigned release artifacts."
          exit 1
      - name: Verify signed Android release APK and certificate
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sakaker-release.jks
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_PATH"
          APK="$(find sakaker-official-app/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          AAB="$(find sakaker-official-app/app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$APK"
          test -n "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
          VERIFY_OUTPUT="$(jarsigner -verify "$AAB" 2>&1)"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -q "jar verified."
      - name: Upload Android test and signed release packages
        uses: actions/upload-artifact@v4
        with:
          name: sakaker-official-android-builds
          path: |
            sakaker-official-app/app/build/outputs/apk/debug/app-debug.apk
            sakaker-official-app/app/build/outputs/apk/release/*.apk
            sakaker-official-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
