name: Build Sakaker Official Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "sakaker-official-app/**"
      - ".github/workflows/sakaker-official-android.yml"
    branches:
      - "feature/sakaker-official-android-app"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p sakaker-official-app :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sakaker-official-debug-apk
          path: sakaker-official-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
