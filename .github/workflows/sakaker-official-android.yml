name: Build Sakaker Official Android app

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - "sakaker-official-app/**"
      - ".github/workflows/sakaker-official-android.yml"
    branches:
      - "feature/sakaker-official-android-app"
      - "feature/sakaker-official-twa"
      - "main"

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate and prepare Android signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "ERROR: Android signing password or alias secret is missing."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/sakaker-release.jks"

          # Remove accidental whitespace/line breaks, accept URL-safe Base64,
          # and restore omitted padding without printing the secret.
          CLEAN_BASE64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')"
          case $((${#CLEAN_BASE64} % 4)) in
            0) ;;
            2) CLEAN_BASE64="${CLEAN_BASE64}==" ;;
            3) CLEAN_BASE64="${CLEAN_BASE64}=" ;;
            1)
              echo "ERROR: ANDROID_KEYSTORE_BASE64 is truncated or contains invalid characters."
              exit 1
              ;;
          esac

          if ! printf '%s' "$CLEAN_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 could not be decoded. Replace it with the complete Base64 output of the keystore file."
            rm -f "$KEYSTORE"
            exit 1
          fi

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "ERROR: The decoded keystore is empty."
            exit 1
          fi

          # Confirm the decoded file is a usable keystore with the supplied password and alias.
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERROR: The decoded file is not a valid keystore for the supplied password and alias."
            rm -f "$KEYSTORE"
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Keystore decoded and validated successfully."
      - name: Build Android debug APK and signed release packages
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          gradle -p sakaker-official-app \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Verify signed Android release APK and certificate
        shell: bash
        run: |
          set -euo pipefail

          test -s "$ANDROID_KEYSTORE_PATH"

          APK="$(find sakaker-official-app/app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)"

          AAB="$(find sakaker-official-app/app/build/outputs/bundle/release \
            -type f -name '*.aab' | head -n 1)"

          test -n "$APK"
          test -n "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

          VERIFY_OUTPUT="$(jarsigner -verify "$AAB" 2>&1)"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -q "jar verified."

          echo "APK and AAB signature verification completed."


      - name: Prepare stable APK for GitHub Release
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find sakaker-official-app/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/sakaker-official.apk

      - name: Publish signed APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sakaker-official.apk
          fail_on_unmatched_files: true

      - name: Store Android build files in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: sakaker-official-android-${{ github.run_number }}
          path: |
            sakaker-official-app/app/build/outputs/apk/debug/app-debug.apk
            sakaker-official-app/app/build/outputs/apk/release/*.apk
            sakaker-official-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
