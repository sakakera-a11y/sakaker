name: Sync index.html from Google Drive

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID (optional; otherwise uses .github/drive-index-source.txt)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/drive-index-source.txt'

permissions:
  contents: write

concurrency:
  group: drive-index-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync-index:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Resolve Google Drive file ID
        shell: bash
        env:
          MANUAL_ID: ${{ github.event.inputs.drive_file_id || '' }}
        run: |
          set -euo pipefail
          ID="${MANUAL_ID:-}"
          if [ -z "$ID" ] && [ -f .github/drive-index-source.txt ]; then
            ID="$(grep -vE '^[[:space:]]*(#|$)' .github/drive-index-source.txt | head -n1 | tr -d '[:space:]' || true)"
          fi
          if [ -z "$ID" ]; then
            echo 'No Drive file ID configured; nothing to sync.'
            echo 'SKIP_SYNC=1' >> "$GITHUB_ENV"
            exit 0
          fi
          if ! [[ "$ID" =~ ^[A-Za-z0-9_-]{10,}$ ]]; then
            echo 'Invalid Google Drive file ID.'
            exit 1
          fi
          echo "DRIVE_FILE_ID=$ID" >> "$GITHUB_ENV"
          echo 'SKIP_SYNC=0' >> "$GITHUB_ENV"

      - name: Download and validate index.html
        if: env.SKIP_SYNC != '1'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://drive.google.com/uc?export=download&id=${DRIVE_FILE_ID}"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o index.html.new
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html.new')
          data = p.read_bytes()
          if len(data) < 100:
              raise SystemExit('Downloaded file is unexpectedly small')
          text = data.decode('utf-8', errors='ignore').lower()
          if '<html' not in text or '</html>' not in text:
              raise SystemExit('Downloaded file does not look like a complete HTML document')
          PY
          mv index.html.new index.html

      - name: Apply safe browser performance optimizations
        if: env.SKIP_SYNC != '1'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8', errors='ignore')

          def add_attrs(match, attrs):
              tag = match.group(0)
              lower = tag.lower()
              additions = []
              for name, value in attrs:
                  if re.search(r'\b' + re.escape(name) + r'\s*=', lower, re.I):
                      continue
                  additions.append(f' {name}="{value}"')
              if not additions:
                  return tag
              if tag.endswith('/>'):
                  return tag[:-2] + ''.join(additions) + '/>'
              return tag[:-1] + ''.join(additions) + '>'

          s = re.sub(r'<iframe\b[^>]*>', lambda m: add_attrs(m, [('loading','lazy')]), s, flags=re.I)
          s = re.sub(r'<img\b[^>]*>', lambda m: add_attrs(m, [('loading','lazy'),('decoding','async')]), s, flags=re.I)

          def media_tag(match):
              tag = match.group(0)
              if re.search(r'\bpreload\s*=\s*["\']auto["\']', tag, re.I):
                  tag = re.sub(r'\bpreload\s*=\s*["\']auto["\']', 'preload="metadata"', tag, flags=re.I)
              elif not re.search(r'\bpreload\s*=', tag, re.I):
                  tag = tag[:-1] + ' preload="metadata">'
              return tag

          s = re.sub(r'<(?:video|audio)\b[^>]*>', media_tag, s, flags=re.I)

          marker = '<!-- SAKAKER FREE HOSTING PERFORMANCE HINTS -->'
          if marker not in s:
              hints = marker + '''
<style id="sakaker-free-hosting-performance">
@media (max-width: 900px){
  html body *{ -webkit-tap-highlight-color:transparent; }
  html body [style*="backdrop-filter"],html body [class*="glass"]{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
}
@media (prefers-reduced-motion: reduce){
  html body *,html body *::before,html body *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
'''
              s = s.replace('</head>', hints + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          print('Optimized index.html bytes:', p.stat().st_size)
          PY

      - name: Commit index.html only
        if: env.SKIP_SYNC != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html is already current.'
            exit 0
          fi
          git commit -m 'Sync optimized index.html from Google Drive'
          git push origin HEAD:main
