name: Install yacht ship icon

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-yacht-icon.yml'

permissions:
  contents: write

jobs:
  install-yacht-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify yacht assets
        shell: bash
        run: |
          test -f assets/yacht-ship-icon.js
          test -f file_00000000e530821086e1b6135c3db20e.png
          node --check assets/yacht-ship-icon.js

      - name: Load yacht icon on the main page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/yacht-ship-icon.js"></script>'

          if tag not in s:
              pos = s.lower().rfind('</body>')
              if pos == -1:
                  raise SystemExit('index.html has no </body> tag')
              s = s[:pos] + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
              print('Installed yacht icon script in index.html')
          else:
              print('Yacht icon script is already installed')
          PY

      - name: Verify installation
        shell: bash
        run: |
          grep -F '<script src="assets/yacht-ship-icon.js"></script>' index.html
          grep -F "const IMG='/file_00000000e530821086e1b6135c3db20e.png'" assets/yacht-ship-icon.js

      - name: Commit installation
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load glowing yacht ship icon'
          git push
