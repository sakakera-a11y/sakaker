name: Set login video background

on:
  push:
    paths:
      - '.github/workflows/set-login-video-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch login background video
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          video_id = 'sakakerLoginBgVideo'
          video_src = 'gemini_generated_video_be58b3bc.mp4'

          if video_id not in text:
              marker = '<div id="loginOverlay"'
              i = text.find(marker)
              if i == -1:
                  raise SystemExit('loginOverlay not found')

              gt = text.find('>', i)
              if gt == -1:
                  raise SystemExit('loginOverlay opening tag is malformed')

              video = f'''\n  <video id="{video_id}" autoplay muted loop playsinline preload="auto" aria-hidden="true">\n    <source src="{video_src}" type="video/mp4">\n  </video>'''
              text = text[:gt+1] + video + text[gt+1:]

          css_marker = '/* SAKAKER LOGIN VIDEO BACKGROUND */'
          if css_marker not in text:
              css = f'''\n<style>\n{css_marker}\n#loginOverlay{{\n  overflow:hidden !important;\n  isolation:isolate;\n}}\n#{video_id}{{\n  position:absolute;\n  inset:0;\n  width:100%;\n  height:100%;\n  object-fit:cover;\n  object-position:center center;\n  z-index:0;\n  pointer-events:none;\n}}\n#loginOverlay > *:not(#{video_id}){{\n  position:relative;\n  z-index:1;\n}}\n@media (max-width:768px){{\n  #{video_id}{{object-position:center center;}}\n}}\n</style>\n'''
              head_close = text.lower().find('</head>')
              if head_close != -1:
                  text = text[:head_close] + css + text[head_close:]
              else:
                  text = css + text

          p.write_text(text, encoding='utf-8')

      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set Sakaker login video background"
          git push
