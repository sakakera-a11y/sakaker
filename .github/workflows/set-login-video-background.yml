name: Fix login video background

on:
  push:
    paths:
      - '.github/workflows/set-login-video-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old login video with requested video
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove the duplicate video element added by the previous patch.
          text = re.sub(
              r'\s*<video id="sakakerLoginBgVideo"[^>]*>\s*<source[^>]*>\s*</video>',
              '',
              text,
              count=1,
              flags=re.S
          )

          # Remove the extra CSS block added by the previous patch.
          text = re.sub(
              r'\s*<style>\s*/\* SAKAKER LOGIN VIDEO BACKGROUND \*/.*?</style>\s*',
              '\n',
              text,
              count=1,
              flags=re.S
          )

          # Replace the source of the site's original login background video.
          pattern = r'(<video\s+id="sakLoginBackgroundVideo"[^>]*\bsrc=")[^"]*("[^>]*></video>)'
          replacement = r'\1https://raw.githubusercontent.com/sakakera-a11y/sakaker/main/gemini_generated_video_be58b3bc.mp4\2'
          text2, n = re.subn(pattern, replacement, text, count=1, flags=re.S)

          if n != 1:
              raise SystemExit('Original sakLoginBackgroundVideo element not found or could not be updated')

          p.write_text(text2, encoding='utf-8')

      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Sakaker login video background"
          git push
