name: Extract Five Differences Progress Archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-five-differences-archive.yml'
      - 'five_differences_30_days_progress_6_of_30.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, 'Extract five differences archive assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract six completed days
        run: |
          mkdir -p assets/five-differences
          unzip -oq five_differences_30_days_progress_6_of_30.zip -d /tmp/five-differences
          cp -R /tmp/five-differences/five_differences_30_days_progress/day_* assets/five-differences/
          cp /tmp/five-differences/five_differences_30_days_progress/README_AR.txt assets/five-differences/README_AR.txt
          find assets/five-differences -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: five-differences-extracted-images
          path: assets/five-differences/**
      - name: Refresh main page runtime references
        run: python .github/scripts/ensure_entertainment_station.py index.html
      - name: Commit extracted puzzle images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/five-differences
          if ! git diff --cached --quiet; then
            git commit -m "Extract five differences archive assets"
            git push
          fi
