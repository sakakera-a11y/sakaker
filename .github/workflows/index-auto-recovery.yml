name: Index Auto Recovery

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'archive/index_safety.html'
      - 'archive/index_emergency_2026-10-08.html'
      - 'archive/index_stable_2026-10-31.html'
      - '.github/scripts/refresh_index_recovery.py'
      - '.github/workflows/index-auto-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-auto-recovery-main
  cancel-in-progress: false

jobs:
  validate-and-recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate published homepage
        id: validate
        shell: python
        run: |
          from pathlib import Path
          import os
          import sys

          index = Path('index.html')
          candidates = [
              Path('archive/index_safety.html'),
              Path('archive/index_emergency_2026-10-08.html'),
              Path('archive/index_stable_2026-10-31.html'),
          ]
          required = (
              '<!DOCTYPE html',
              '<html',
              '</html>',
              '<body',
              '</body>',
              'id="loginOverlay"',
              'id="facebookVideoPopup"',
              'id="shipPopup_new"',
          )

          def valid(path: Path) -> bool:
              if not path.is_file():
                  return False
              text = path.read_text(encoding='utf-8', errors='replace')
              if len(text) < 900_000:
                  return False
              if any(marker not in text for marker in required):
                  return False
              if text.count('<html') != 1 or text.count('</html>') != 1:
                  return False
              return True

          if valid(index):
              print('index.html is valid and is the active recovery baseline.')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('recovery_required=false\n')
              sys.exit(0)

          for candidate in candidates:
              if valid(candidate):
                  print(f'Restoring index.html from approved candidate: {candidate}')
                  index.write_text(candidate.read_text(encoding='utf-8', errors='replace'), encoding='utf-8')
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                      out.write('recovery_required=true\n')
                  break
          else:
              print('ERROR: homepage and all recovery copies are missing or invalid.')
              sys.exit(1)

      - name: Refresh all approved recovery copies from the current homepage
        run: python3 .github/scripts/refresh_index_recovery.py

      - name: Commit refreshed homepage recovery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/index_safety.html archive/index_emergency_2026-10-08.html archive/index_stable_2026-10-31.html
          if ! git diff --cached --quiet; then
            git commit -m "Sync homepage recovery copies to current approved baseline"
            git push
          else
            echo "No homepage recovery file changes were required."
          fi
