name: Fix background loaders and ebooks section

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-background-loaders-and-ebooks.yml'
      - '.github/scripts/fix_backgrounds_ebooks.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        run: python .github/scripts/fix_backgrounds_ebooks.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/main-runtime-locks.js assets/text-library-order.js books.html index.html
          git commit -m 'Stop duplicate background loading and add ebooks section'
          git push
