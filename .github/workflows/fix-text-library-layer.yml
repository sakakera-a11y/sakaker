name: Fix text library modal layering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-text-library-layer.yml'

permissions:
  contents: write

jobs:
  fix-layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise text-library windows above all site content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='sakaker-text-library-top-layer-fix'
          if marker not in s:
              css='''\n<style id="sakaker-text-library-top-layer-fix">\n/* Text-library child windows must always be above every dock/icon/window. */\nhtml body .modal,\nhtml body #folderModal,\nhtml body #quizModal,\nhtml body #puzzleModal {\n  position:fixed !important;\n  inset:0 !important;\n  z-index:2147483646 !important;\n  isolation:isolate !important;\n}\nhtml body .modal .panel,\nhtml body #folderModal .panel,\nhtml body #quizModal .panel,\nhtml body #puzzleModal .panel {\n  position:relative !important;\n  z-index:2147483647 !important;\n}\nhtml body #sakTextLibraryModal {\n  position:fixed !important;\n  inset:0 !important;\n  z-index:2147483645 !important;\n}\n</style>\n'''
              pos=s.lower().rfind('</head>')
              if pos >= 0:
                  s=s[:pos]+css+s[pos:]
              else:
                  s=css+s
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index.html
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep text library windows above all content'
          git push origin HEAD:main
