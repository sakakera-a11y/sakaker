name: Fix responsive icon layout

on:
  push:
    paths:
      - '.github/workflows/fix-icons-responsive.yml'

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Business icon fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/final-three-icons.js')
          s = p.read_text(encoding='utf-8')
          old = "if(!dock||!business||!audio||!map)return;"
          new = "if(!dock||!audio||!map)return;"
          if old not in s:
              raise SystemExit('Expected build guard not found')
          s = s.replace(old, new, 1)
          old2 = "b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();clickOriginal(target)};return b}"
          new2 = "b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();if(target){clickOriginal(target)}else if(kind==='business'){window.location.href='https://business.sakaker.co/'}};return b}"
          if old2 not in s:
              raise SystemExit('Expected proxy click handler not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

      - name: Improve desktop icon layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/final-three-icons.css')
          s = p.read_text(encoding='utf-8')
          marker = "@media(max-width:700px){"
          if marker not in s:
              raise SystemExit('Mobile media marker not found')
          block = r'''
/* Desktop/tablet: compact two-row icon panel instead of one stretched strip. */
@media(min-width:701px){
  html body #sakUnifiedIconsRow{
    width:min(92vw,760px)!important;
    max-width:760px!important;
    display:grid!important;
    grid-template-columns:repeat(7,72px)!important;
    grid-auto-rows:82px!important;
    align-items:start!important;
    justify-content:center!important;
    justify-items:center!important;
    gap:10px 16px!important;
    padding:14px 18px 12px!important;
    overflow:visible!important;
    background:linear-gradient(180deg,rgba(1,25,38,.34),rgba(1,15,25,.58))!important;
    border:1px solid rgba(165,241,255,.30)!important;
    border-radius:24px!important;
    box-shadow:0 10px 36px rgba(0,0,0,.34),0 0 24px rgba(58,221,255,.12)!important;
    backdrop-filter:blur(8px)!important;
    -webkit-backdrop-filter:blur(8px)!important;
  }
  html body #sakUnifiedIconsRow .sak-unified-gull,
  html body #sakUnifiedIconsRow .sak-shore-gull.sak-unified-gull,
  html body #sakUnifiedIconsRow .sak-unified-extra{
    flex:none!important;
    width:68px!important;height:78px!important;
    min-width:68px!important;min-height:78px!important;
    max-width:68px!important;max-height:78px!important;
  }
  html body #sakUnifiedIconsRow .sak-proxy-art,
  html body #sakUnifiedIconsRow .sak-proxy-star{
    width:54px!important;height:54px!important;
  }
  html body #sakUnifiedIconsRow .sak-unified-label{
    width:76px!important;max-width:76px!important;
    font-size:8px!important;
  }
}

'''
          if 'Desktop/tablet: compact two-row icon panel' not in s:
              s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify changes
        shell: python
        run: |
          from pathlib import Path
          js = Path('assets/final-three-icons.js').read_text(encoding='utf-8')
          css = Path('assets/final-three-icons.css').read_text(encoding='utf-8')
          assert "if(!dock||!audio||!map)return;" in js
          assert "business.sakaker.co" in js
          assert "grid-template-columns:repeat(7,72px)" in css
          print('Responsive icons fix verified')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/final-three-icons.js assets/final-three-icons.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix icon layout and restore Business launcher"
            git push
          fi
