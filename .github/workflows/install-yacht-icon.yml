name: Install yacht icon safely

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-yacht-icon.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh branch before editing
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Link compact yacht and text-library ship story
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if '<html' not in text.lower() or '</html>' not in text.lower():
              raise SystemExit('Refusing to modify incomplete index.html')

          text = re.sub(
              r'\s*<style\s+id=["\']sakYachtDirectStyle["\'][^>]*>.*?</style>\s*',
              '\n', text, flags=re.I|re.S
          )

          yacht_tag = '<script id="sak-yacht-ship-runtime" src="/assets/yacht-ship-icon.js?v=20261003-7" defer></script>'
          if 'id="sak-yacht-ship-runtime"' in text:
              text = re.sub(r'<script\s+id="sak-yacht-ship-runtime"[^>]*></script>', yacht_tag, text, count=1, flags=re.I)
          else:
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('Closing body tag not found in index.html')
              text = text[:pos] + yacht_tag + '\n' + text[pos:]
          index.write_text(text, encoding='utf-8')

          books = Path('books.html')
          b = books.read_text(encoding='utf-8')
          if '<html' not in b.lower() or '</html>' not in b.lower():
              raise SystemExit('Refusing to modify incomplete books.html')
          library_tag = '<script id="sak-ship-story-library-runtime" src="/assets/text-library-ship.js?v=20261003-2" defer></script>'
          if 'id="sak-ship-story-library-runtime"' in b:
              b = re.sub(r'<script\s+id="sak-ship-story-library-runtime"[^>]*></script>', library_tag, b, count=1, flags=re.I)
          else:
              pos = b.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('Closing body tag not found in books.html')
              b = b[:pos] + library_tag + '\n' + b[pos:]
          books.write_text(b, encoding='utf-8')

      - name: Verify yacht and library runtimes
        shell: bash
        run: |
          test -f assets/yacht-ship-icon.js
          test -f assets/text-library-ship.js
          test -f file_00000000e530821086e1b6135c3db20e.png
          grep -Fq 'id="sak-yacht-ship-runtime"' index.html
          grep -Fq 'yacht-ship-icon.js?v=20261003-7' index.html
          ! grep -Fq 'id="sakYachtDirectStyle"' index.html
          grep -Fq 'id="sak-ship-story-library-runtime"' books.html
          grep -Fq 'text-library-ship.js?v=20261003-2' books.html
          grep -Fq 'sakYachtPaymentLauncher' assets/yacht-ship-icon.js
          grep -Fq 'sakYachtPaymentImage' assets/yacht-ship-icon.js
          grep -Fq "BUSINESS_URL='https://business.sakaker.co/'" assets/yacht-ship-icon.js
          grep -Fq 'window.location.href=BUSINESS_URL' assets/yacht-ship-icon.js
          grep -Fq 'removeDuplicateBusinessStar' assets/yacht-ship-icon.js
          grep -Fq '#sakakerBusinessAd' assets/yacht-ship-icon.js
          grep -Fq '.sakaker-utility-slot[data-sakaker-util="business"]' assets/yacht-ship-icon.js
          grep -Fq 'sakShipStoryLibraryBtn' assets/text-library-ship.js
          grep -Fq '🌙 الذكرى السنوية لبناء أبو القمر زمرد' assets/text-library-ship.js
          grep -Fq '🌱 الفصل الأول… حين بدأت الحكاية' assets/text-library-ship.js
          grep -Fq '🚢 الفصل الثالث… حين أبحرت السفينة' assets/text-library-ship.js
          grep -Fq '🕯️ كلمة في الذكرى' assets/text-library-ship.js
          grep -Fq '2025 — 2026' assets/text-library-ship.js
          node --check assets/yacht-ship-icon.js
          node --check assets/text-library-ship.js

      - name: Commit safe runtime links with retry
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- index.html books.html; then
            echo 'Compact yacht and ship story runtimes are already linked.'
            exit 0
          fi

          git add index.html books.html
          git commit -m 'Publish sole Business yacht and fixed ship anniversary library'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt raced with another update; rebasing and retrying."
            git fetch origin main
            git rebase origin/main
          done

          echo 'Unable to push after three attempts.' >&2
          exit 1
