name: Install yacht icon safely

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-yacht-icon.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Safely link yacht runtime into index
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if '<html' not in text.lower() or '</html>' not in text.lower():
              raise SystemExit('Refusing to modify incomplete index.html')
          tag = '<script id="sak-yacht-ship-runtime" src="/assets/yacht-ship-icon.js?v=20261003-2" defer></script>'
          if 'id="sak-yacht-ship-runtime"' in text:
              text = re.sub(r'<script\s+id="sak-yacht-ship-runtime"[^>]*></script>', tag, text, count=1, flags=re.I)
              p.write_text(text, encoding='utf-8')
          else:
              low = text.lower()
              pos = low.rfind('</body>')
              if pos < 0:
                  raise SystemExit('Closing body tag not found')
              text = text[:pos] + tag + '\n' + text[pos:]
              p.write_text(text, encoding='utf-8')

      - name: Verify yacht assets and link
        shell: bash
        run: |
          test -f assets/yacht-ship-icon.js
          test -f file_00000000e530821086e1b6135c3db20e.png
          grep -Fq 'id="sak-yacht-ship-runtime"' index.html
          grep -Fq 'yacht-ship-icon.js?v=20261003-2' index.html
          grep -Fq 'file_00000000e530821086e1b6135c3db20e.png' assets/yacht-ship-icon.js
          grep -Fq 'data-sakaker-util="ship"' assets/yacht-ship-icon.js
          node --check assets/yacht-ship-icon.js

      - name: Commit safe index link
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Yacht runtime already linked with current cache version.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh stable yacht icon runtime cache'
          git push
