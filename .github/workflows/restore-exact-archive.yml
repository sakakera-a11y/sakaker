name: Restore exact archive
on:
  push:
    branches:
      - restore-exact-archive-20261006
    paths:
      - .github/workflows/restore-exact-archive.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact archived index
        run: python .github/scripts/restore_exact_archive.py
      - name: Verify exact Git blob
        run: test "$(git hash-object index.html)" = "4081ebeaf357755d5f4630f35883e2505a30a600"
      - name: Commit verified archive
        run: |
          rm -f .github/scripts/restore_exact_archive.py .github/workflows/restore-exact-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore exact second archive index"
          git push origin HEAD:restore-exact-archive-20261006
