name: Lazy Load Audio Video Temp

on:
  push:
    paths:
      - '.github/workflows/lazy-load-audio-video-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make converter load only after login and click
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="/assets/audio-video-maker.js" defer></script>','')
          marker='sakaker-audio-video-lazy-loader'
          if marker not in s:
              block='''\n<script id="sakaker-audio-video-lazy-loader">\n(function(){\n  "use strict";\n  let loading=false,loaded=false;\n  function loadTool(){\n    if(loaded||loading||document.body.classList.contains("locked")) return;\n    loading=true;\n    const sc=document.createElement("script");\n    sc.src="/assets/audio-video-maker.js";\n    sc.async=true;\n    sc.onload=function(){loaded=true;loading=false};\n    sc.onerror=function(){loading=false};\n    document.head.appendChild(sc);\n  }\n  document.addEventListener("click",function(e){\n    const t=e.target instanceof Element?e.target.closest("#sakMusicIcon"):null;\n    if(!t) return;\n    if(document.body.classList.contains("locked")) return;\n    loadTool();\n  },true);\n})();\n</script>\n'''
              s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify login isolation
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<script src="/assets/audio-video-maker.js" defer></script>' not in s
          assert 'sakaker-audio-video-lazy-loader' in s
          assert 'classList.contains("locked")' in s
          assert 'gemini_generated_video_be58b3bc.mp4' in s
          assert 'loginOverlay' in s
          print('LAZY_CONVERTER_OK')
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Lazy load audio video tool after login click"
          git push
