
<!-- SAKAKER ENTERTAINMENT STATION — flying gull launcher -->
<style id="sakaker-chess-launcher-style">
html body #sakakerAllIconsDock #sakEmeraldChessIcon,
html body #sakEmeraldChessIcon{position:relative!important;inset:auto!important;flex:0 0 74px!important;width:74px!important;height:80px!important;min-width:0!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;color:#e2fff3!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;pointer-events:auto!important;touch-action:manipulation!important;overflow:visible!important;font:700 11px/1.2 Tahoma,Arial,sans-serif!important;transform:none!important}
#sakEmeraldChessIcon svg{width:66px;height:58px;overflow:visible;filter:drop-shadow(0 0 7px #a6ffdd);animation:sakChessFlight 3.4s ease-in-out infinite}
#sakEmeraldChessIcon .sak-chess-wing{transform-origin:39px 35px;animation:sakChessWing 1.6s ease-in-out infinite alternate}
#sakEmeraldChessIcon small{display:block;max-width:96px;text-align:center;white-space:normal!important;font:700 10px/1.2 Tahoma,Arial,sans-serif;color:#d0ffec;text-shadow:0 0 7px #00dfab}
#sakEmeraldChessIcon:focus-visible{outline:2px solid #ffe399!important;border-radius:10px!important}
@keyframes sakChessFlight{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes sakChessWing{from{rotate:-5deg}to{rotate:9deg}}

/* Hide the five launchers from the public icon row; their functions stay available
   through the Entertainment Station. */
html body:not(.locked) #pongGame-btn,
html body:not(.locked) #emOpenBtn,
html body:not(.locked) #sakCreativeIcon,
html body:not(.locked) #sakChatIcon{display:none!important;visibility:hidden!important;pointer-events:none!important}
html body #sakakerAllIconsDock .sakaker-utility-slot[data-sak-entertainment-hidden="1"]{display:none!important}

#sakEntertainmentStation[hidden]{display:none!important}
#sakEntertainmentStation{position:fixed!important;inset:0!important;z-index:2147483647!important;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box;background:rgba(0,9,15,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:Tajawal,Tahoma,Arial,sans-serif;color:#effff8}
#sakEntertainmentStation .sak-ent-panel{width:min(640px,calc(100vw - 22px));max-height:calc(100dvh - 24px);overflow:auto;padding:18px;border:1px solid rgba(164,255,222,.78);border-radius:24px;background:linear-gradient(145deg,rgba(4,40,45,.96),rgba(4,15,29,.97) 62%,rgba(66,43,11,.94));box-shadow:0 0 18px rgba(84,255,216,.58),0 0 42px rgba(255,211,84,.2);box-sizing:border-box}
#sakEntertainmentStation .sak-ent-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
#sakEntertainmentStation h2{margin:0;color:#eafff6;font-size:clamp(18px,4vw,26px);text-shadow:0 0 10px rgba(101,255,220,.72)}
#sakEntertainmentClose{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid #ffe28a;background:rgba(35,15,11,.86);color:#fff;font-size:25px;cursor:pointer;box-shadow:0 0 12px rgba(255,210,91,.4)}
#sakEntertainmentGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sak-ent-item{min-height:96px;border:1px solid rgba(152,255,225,.6);border-radius:18px;background:linear-gradient(145deg,rgba(0,82,77,.78),rgba(7,29,45,.9));color:#fff;cursor:pointer;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column;text-align:center;font:800 15px/1.3 Tajawal,Tahoma,Arial,sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 13px rgba(63,255,217,.22);transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
.sak-ent-item:hover,.sak-ent-item:focus-visible{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 0 18px rgba(81,255,222,.62);outline:2px solid #ffe99e;outline-offset:2px}
.sak-ent-item .sak-ent-symbol{font-size:34px;line-height:1}
.sak-ent-item[data-action="chess"]{grid-column:1/-1;background:linear-gradient(145deg,rgba(63,43,6,.88),rgba(4,62,58,.9))}
@media(max-width:700px){html body #sakakerAllIconsDock #sakEmeraldChessIcon{flex-basis:54px!important;width:54px!important;height:62px!important}#sakEmeraldChessIcon svg{width:49px;height:43px}#sakEmeraldChessIcon small{font-size:8px!important}#sakEntertainmentStation{padding:7px}#sakEntertainmentStation .sak-ent-panel{padding:13px;border-radius:18px}#sakEntertainmentGrid{grid-template-columns:1fr;gap:9px}.sak-ent-item{min-height:72px;flex-direction:row;justify-content:flex-start;text-align:start}.sak-ent-item[data-action="chess"]{grid-column:auto}.sak-ent-item .sak-ent-symbol{font-size:28px}}
@media(prefers-reduced-motion:reduce){#sakEmeraldChessIcon svg,#sakEmeraldChessIcon .sak-chess-wing,.sak-ent-item{animation:none!important;transition:none!important}}
</style>
<script id="sakaker-chess-launcher-js">
(function(){
 'use strict';
 let button=null,loadingChess=false;
 const $=id=>document.getElementById(id);
 const targets={music:'emOpenBtn',creative:'sakCreativeIcon',pong:'pongGame-btn',chat:'sakChatIcon'};
 function en(){return document.documentElement.lang==='en'}
 function label(){
   if(!button)return;
   const text=en()?'Entertainment Station':'المحطة الترفيهية';
   button.setAttribute('aria-label',text);button.title=text;
   const small=button.querySelector('small');if(small)small.textContent=text;
   updatePanelLanguage();
 }
 function panel(){
   let modal=$('sakEntertainmentStation');
   if(modal)return modal;
   modal=document.createElement('div');
   modal.id='sakEntertainmentStation';modal.hidden=true;modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
   modal.innerHTML='<div class="sak-ent-panel"><div class="sak-ent-head"><h2 id="sakEntertainmentTitle"></h2><button id="sakEntertainmentClose" type="button" aria-label="Close">×</button></div><div id="sakEntertainmentGrid"><button class="sak-ent-item" type="button" data-action="music"><span class="sak-ent-symbol">🎹</span><span></span></button><button class="sak-ent-item" type="button" data-action="creative"><span class="sak-ent-symbol">🎨</span><span></span></button><button class="sak-ent-item" type="button" data-action="pong"><span class="sak-ent-symbol">🏓</span><span></span></button><button class="sak-ent-item" type="button" data-action="chat"><span class="sak-ent-symbol">💬</span><span></span></button><button class="sak-ent-item" type="button" data-action="chess"><span class="sak-ent-symbol">♞</span><span></span></button></div></div>';
   document.body.appendChild(modal);
   $('sakEntertainmentClose').addEventListener('click',closePanel);
   modal.addEventListener('click',e=>{if(e.target===modal)closePanel()});
   $('sakEntertainmentGrid').addEventListener('click',e=>{const item=e.target.closest('.sak-ent-item');if(item)launch(item.dataset.action)});
   updatePanelLanguage();
   return modal;
 }
 function updatePanelLanguage(){
   const modal=$('sakEntertainmentStation');if(!modal)return;
   modal.dir=en()?'ltr':'rtl';
   const title=$('sakEntertainmentTitle');if(title)title.textContent=en()?'Entertainment Station':'المحطة الترفيهية';
   const close=$('sakEntertainmentClose');if(close){close.title=en()?'Close':'إغلاق';close.setAttribute('aria-label',close.title)}
   const names={music:en()?'Music Studio':'استديو الموسيقى',creative:en()?'Creative Studio':'الاستديو الإبداعي',pong:en()?'Pong Game':'لعبة البونج',chat:en()?'Chat':'الشات',chess:en()?'Chess Game':'لعبة الشطرنج'};
   modal.querySelectorAll('.sak-ent-item').forEach(item=>{const span=item.querySelector('span:last-child');if(span)span.textContent=names[item.dataset.action]||item.dataset.action;item.title=names[item.dataset.action]||'';item.setAttribute('aria-label',item.title)});
 }
 function openPanel(){const modal=panel();modal.hidden=false;document.body.style.overflow='hidden';setTimeout(()=>$('sakEntertainmentClose')?.focus(),0)}
 function closePanel(){const modal=$('sakEntertainmentStation');if(modal)modal.hidden=true;document.body.style.overflow='';button?.focus()}
 async function openChess(){
   if(loadingChess)return;loadingChess=true;
   try{const module=await import('/assets/chess/chess-app.js?v=20260930-5');await module.openChess()}
   catch(error){alert(en()?'Chess could not load. Please check your connection and retry.':'تعذر تحميل الشطرنج. تحقق من الاتصال ثم أعد المحاولة.')}
   finally{loadingChess=false}
 }
 function clickTarget(id,missingAr,missingEn){
   const target=$(id);if(target){target.click();return true}
   alert(en()?missingEn:missingAr);return false;
 }
 function launch(action){
   closePanel();
   if(action==='chess'){openChess();return}
   if(action==='music'){clickTarget(targets.music,'استديو الموسيقى لم يكتمل تحميله بعد. أعد المحاولة بعد لحظة.','Music Studio is still loading. Try again in a moment.');return}
   if(action==='creative'){clickTarget(targets.creative,'الاستديو الإبداعي لم يكتمل تحميله بعد. أعد المحاولة بعد لحظة.','Creative Studio is still loading. Try again in a moment.');return}
   if(action==='pong'){clickTarget(targets.pong,'لعبة البونج لم تكتمل بعد. أعد المحاولة بعد لحظة.','Pong is still loading. Try again in a moment.');return}
   if(action==='chat'){clickTarget(targets.chat,'الشات لم يكتمل تحميله بعد. أعد المحاولة بعد لحظة.','Chat is still loading. Try again in a moment.');return}
 }
 function groupLaunchers(){
   Object.values(targets).forEach(id=>{
     const el=$(id);if(!el)return;
     el.dataset.sakEntertainmentGrouped='1';
     const slot=el.closest('.sakaker-utility-slot');if(slot)slot.dataset.sakEntertainmentHidden='1';
   });
 }
 function mount(){
   const dock=$('sakakerAllIconsDock');if(!dock)return;
   button=$('sakEmeraldChessIcon');
   if(!button){
     button=document.createElement('button');button.id='sakEmeraldChessIcon';button.type='button';button.dataset.sakRole='entertainment-station';
     button.innerHTML='<svg viewBox="0 0 88 68" aria-hidden="true"><defs><linearGradient id="sakChessBirdMetal" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#d1eee5"/><stop offset="1" stop-color="#639b94"/></linearGradient></defs><path d="M38 38 18 49 12 44 25 35Z" fill="#e3fff4" stroke="#254b4d" stroke-width="1.4"/><path class="sak-chess-wing" d="M38 37C25 25 10 22 3 8C20 12 34 17 45 32L43 38Z" fill="url(#sakChessBirdMetal)" stroke="#234c4d" stroke-width="1.3"/><path class="sak-chess-wing" d="M42 34C52 19 69 14 78 5C76 22 67 32 49 41Z" fill="url(#sakChessBirdMetal)" stroke="#234c4d" stroke-width="1.3"/><path d="M25 37C29 30 39 28 46 33C52 34 51 27 52 18C53 8 62 8 67 12L75 15 67 19C64 18 60 17 59 22C60 34 55 43 45 44C37 46 29 43 25 37Z" fill="url(#sakChessBirdMetal)" stroke="#254b4d" stroke-width="1.5"/><path d="m67 13 13 4-13 2Z" fill="#e7bb53" stroke="#8b5b26"/><circle cx="64" cy="13" r="1.7" fill="#102529"/><path d="m39 43-3 7m10-7-2 7" stroke="#d9b967" stroke-width="2"/></svg><small></small>';
     dock.append(button);button.addEventListener('click',openPanel);
   }
   label();panel();groupLaunchers();
 }
 function maybeGroupFromNode(node){
   if(!(node instanceof Element))return false;
   if(Object.values(targets).some(id=>node.id===id||node.querySelector?.('#'+id)))return true;
   return !!node.querySelector?.('.sakaker-utility-slot');
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();
 window.addEventListener('load',()=>{mount();groupLaunchers()},{once:true});
 [250,700,1500,3000,5500,9000].forEach(ms=>setTimeout(()=>{mount();groupLaunchers()},ms));
 new MutationObserver(()=>{label();groupLaunchers()}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
 const observer=new MutationObserver(records=>{if(records.some(r=>[...r.addedNodes].some(maybeGroupFromNode)))groupLaunchers()});
 if(document.body)observer.observe(document.body,{childList:true,subtree:true});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sakEntertainmentStation')?.hidden)closePanel()});
 if(new URLSearchParams(location.search).get('chess')==='1')setTimeout(openChess,350);
})();
</script>
