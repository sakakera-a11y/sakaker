<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAKAKER — Creative Studio</title></head><body><style>html,body{margin:0;min-height:100%;background:#041016;color:#fff;font-family:Tahoma,Arial,sans-serif}#back{position:fixed;top:10px;left:10px;z-index:2147483647;padding:10px 14px;border-radius:12px;border:1px solid #7fffd4;background:#092a2d;color:#fff;cursor:pointer}</style><button id="back" onclick="location.href='../index.html'">↩ الرئيسية / Home</button><style id="sak-creative-studio-style">
html body #sakCreativeIcon { cursor:pointer; font-family:inherit; }

html body #sakCreativeIcon .icon-label { white-space:normal !important; }
html body #sakStudio[hidden] { display:none !important; }
html body #sakStudio {
  position:fixed !important; inset:0 !important; z-index:2147483647 !important;
  display:flex; align-items:center; justify-content:center; padding:12px;
  background:rgba(1,10,15,.92); color:#eef8ff; box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif; text-align:start;
  margin:0 !important; width:100vw !important; height:100dvh !important;
  max-width:none !important; max-height:none !important; border:0 !important;
}
html body #sakStudio::backdrop { background:rgba(1,10,15,.85); }
html body #sakStudio * { box-sizing:border-box; }
html body #sakStudio .studio-panel {
  width:min(1100px,100%); max-height:calc(100dvh - 24px); overflow:auto;
  border:1px solid #adc5d1; border-radius:22px; padding:18px;
  background:linear-gradient(135deg,#172934,#081923); box-shadow:0 0 28px #81b8c84d;
}
html body #sakStudio h2 { margin:0; font-size:22px; color:#f2dfab; }
html body #sakStudio .studio-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
html body #sakStudio .studio-head { justify-content:space-between; }
html body #sakStudio button,html body #sakStudio select,html body #sakStudio input {
  font:inherit; font-size:15px; border:1px solid #7298a9; border-radius:9px;
  min-height:40px; padding:8px 12px; background:#eff8fc; color:#102d3b;
  text-shadow:none; max-width:100%;
}
html body #sakStudio button { cursor:pointer; }
html body #sakStudio button:disabled { opacity:.45; cursor:default; }
html body #sakStudio button[aria-pressed="true"] { background:#ffdc82; border-color:#ffdc82; }
html body #sakStudio :focus-visible { outline:3px solid #5de2bf; outline-offset:2px; }
html body #sakStudio label { display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:13px; }
html body #sakStudio input[type="color"] { width:46px; padding:3px; }
html body #sakStudio input[type="range"] { width:105px; padding:0; }
html body #sakStudio input[type="text"] { flex:1; min-width:160px; }
html body #sakStudio .studio-workspace { overflow:auto; padding:12px; border-radius:12px; background:#071019; }

  height:auto !important; margin:auto; touch-action:none; cursor:crosshair;

}

  html body #sakStudio h2 { font-size:18px; }
  html body #sakStudio .studio-workspace { padding:4px; }
}

  canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);
  $('studioTools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b){tool=b.dataset.tool;selected=-1;render();}});
  $('studioSize').addEventListener('input',()=>{$('studioSizeValue').value=$('studioSize').value;});
  $('studioOpacity').addEventListener('input',()=>{$('studioOpacityValue').value=$('studioOpacity').value+'%';});
  $('studioBackground').addEventListener('change',()=>{history();state.bg=$('studioBackground').value;render();});
  $('studioTemplate').addEventListener('change',()=>{history();state.template=$('studioTemplate').value;render();});
  $('studioFormat').addEventListener('change',()=>{
    history();const [w,h]=$('studioFormat').value.split(',').map(Number),sx=w/state.w,sy=h/state.h;
    state.objects.forEach(o=>{if(o.points)o.points.forEach(p=>{p.x*=sx;p.y*=sy;});else{o.x*=sx;o.y*=sy;if(o.type==='image'){const scale=Math.min(sx,sy);o.w*=scale;o.h*=scale;}if(o.x2!==undefined){o.x2*=sx;o.y2*=sy;}}});
    state.w=w;state.h=h;selected=-1;render();
  });
  $('studioAddText').addEventListener('click',()=>{const text=$('studioText').value.trim();if(!text){say('empty');return;}
    history();state.objects.push({type:'text',text,size:Number($('studioTextSize').value),color:$('studioColor').value,x:state.w/2,y:state.h/2});
    selected=state.objects.length-1;tool='move';render();
  });
  $('studioDelete').addEventListener('click',()=>{if(selected>=0){history();state.objects.splice(selected,1);selected=-1;render();}});
  $('studioUndo').addEventListener('click',()=>{if(undo.length){redo.push(copy(state));state=undo.pop();selected=-1;render();}});
  $('studioRedo').addEventListener('click',()=>{if(redo.length){undo.push(copy(state));state=redo.pop();selected=-1;render();}});
  modal.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(e.shiftKey?'studioRedo':'studioUndo').click();}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('studioRedo').click();}});
  $('studioClear').addEventListener('click',()=>{if(!state.objects.length||confirm(words[lang].confirm)){history();state.objects=[];selected=-1;render();}});
  $('studioSave').addEventListener('click',()=>{try{localStorage.setItem('sak-creative-draft-v1',JSON.stringify(state));say('saved');}catch(e){say('failed');}});
  $('studioUpload').addEventListener('click',()=>{$('studioImageFile').click();});
  $('studioImageFile').addEventListener('change',async()=>{
    const file=$('studioImageFile').files[0];$('studioImageFile').value='';if(!file)return;
    if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)||file.size>20*1024*1024){say('imageError');return;}
    $('studioUpload').disabled=true;say('imageLoading');
    const url=URL.createObjectURL(file);
    try{
      const original=await loadImage(url);
      const scale=Math.min(1,1600/original.naturalWidth,1600/original.naturalHeight);
      const resized=document.createElement('canvas');resized.width=Math.max(1,Math.round(original.naturalWidth*scale));resized.height=Math.max(1,Math.round(original.naturalHeight*scale));
      resized.getContext('2d').drawImage(original,0,0,resized.width,resized.height);
      const src=resized.toDataURL('image/png');await loadImage(src);
      const fit=Math.min(state.w/resized.width,state.h/resized.height,1),w=resized.width*fit,h=resized.height*fit;
      history();state.objects.unshift({type:'image',src,x:(state.w-w)/2,y:(state.h-h)/2,w,h});
      selected=0;tool='move';render();say('imageReady');
    }catch(e){say('imageError');}
    finally{URL.revokeObjectURL(url);imageCache.delete(url);$('studioUpload').disabled=false;}
  });
  function resizeImage(factor){
    const o=state.objects[selected];if(!o||o.type!=='image')return;
    if(Math.min(o.w,o.h)*factor<10||Math.max(o.w,o.h)*factor>8000)return;
    history();const w=o.w*factor,h=o.h*factor;o.x-=(w-o.w)/2;o.y-=(h-o.h)/2;o.w=w;o.h=h;render();
  }
  $('studioImageSmaller').addEventListener('click',()=>resizeImage(.9));
  $('studioImageLarger').addEventListener('click',()=>resizeImage(1.1));
  $('studioLoad').addEventListener('click',async()=>{try{
    const raw=localStorage.getItem('sak-creative-draft-v1');if(!raw){say('missing');return;}
    const saved=JSON.parse(raw);
    if(!['900,600','800,800','600,900'].includes(saved.w+','+saved.h)||!Array.isArray(saved.objects)||saved.objects.length>10000||!/^#[0-9a-f]{6}$/i.test(saved.bg)||!['blank','gold','celebrate'].includes(saved.template))throw Error('Invalid draft');
    saved.objects.forEach(o=>{if(o.opacity!==undefined&&(!Number.isFinite(o.opacity)||o.opacity<0||o.opacity>1))throw Error('Invalid opacity');if(o.type==='image'){if(typeof o.src!=='string'||!o.src.startsWith('data:image/png;base64,')||o.src.length>30000000||![o.x,o.y,o.w,o.h].every(Number.isFinite)||o.w<=0||o.h<=0||Math.max(o.w,o.h)>8000)throw Error('Invalid image');return;}if(![...brushTypes,'text','rect','ellipse'].includes(o.type)||!Number.isFinite(o.size)||o.size<1||o.size>100||!/^#[0-9a-f]{6}$/i.test(o.color))throw Error('Invalid object');if(brushTypes.includes(o.type)){if(!Array.isArray(o.points)||!o.points.length||o.points.length>100000||o.points.some(p=>!Number.isFinite(p.x)||!Number.isFinite(p.y)))throw Error('Invalid path');}else{if(!Number.isFinite(o.x)||!Number.isFinite(o.y))throw Error('Invalid position');if(o.type==='text'){if(typeof o.text!=='string'||o.text.length>120)throw Error('Invalid text');}else if(!Number.isFinite(o.x2)||!Number.isFinite(o.y2))throw Error('Invalid shape');}});
    if(state.objects.length&&!confirm(words[lang].replace))return;
    await Promise.all(saved.objects.filter(o=>o.type==='image').map(o=>loadImage(o.src)));
    history();state=saved;selected=-1;render();say('loaded');
  }catch(e){say('failed');}});
  $('studioExport').addEventListener('click',()=>{
    render(false);canvas.toBlob(blob=>{if(!blob){say('downloadError');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SAKAKER-creative-'+Date.now()+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);say('downloaded');},'image/png');render();
  });
  function close(){if(modal.open)modal.close();modal.hidden=true;gesture=null;document.body.style.overflow=scrollBefore;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
  function open(){if(document.body.classList.contains('locked')||!modal.hidden)return;lastFocus=document.activeElement;scrollBefore=document.body.style.overflow;document.body.style.overflow='hidden';lang=document.documentElement.lang==='en'?'en':'ar';language();modal.hidden=false;if(typeof modal.showModal==='function')modal.showModal();render();$('studioClose').focus();}
  modal.addEventListener('cancel',e=>{e.preventDefault();close();});
  $('studioClose').addEventListener('click',close);
  $('studioLang').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';language();});
  modal.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();}if(e.key==='Tab'){const list=[...modal.querySelectorAll('button:not(:disabled),input:not([hidden]),select,canvas')];const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  function mount(){
    const host=document.querySelector('.cards')||$('sakakerAllIconsDock');if(!host||$('sakCreativeIcon'))return;
    const button=document.createElement('button');button.id='sakCreativeIcon';button.type='button';button.className='icon-card';
    button.innerHTML='<span class="icon-svg" aria-hidden="true" style="font-size:25px">🎨</span><span class="icon-label"></span><span class="sub"></span>';
    button.addEventListener('click',open);host.appendChild(button);labelIcon();
  }
  function labelIcon(){const b=$('sakCreativeIcon'),l=document.documentElement.lang==='en'?'en':'ar';if(b){b.querySelector('.icon-label').textContent=words[l].icon;b.querySelector('.sub').textContent=words[l].sub;b.title=words[l].icon;b.setAttribute('aria-label',words[l].icon);}}
  new MutationObserver(()=>{labelIcon();if(!modal.hidden){lang=document.documentElement.lang==='en'?'en':'ar';language();}}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  new MutationObserver(()=>{if(document.body.classList.contains('locked')&&!modal.hidden)close();}).observe(document.body,{attributes:true,attributeFilter:['class']});
  mount();document.addEventListener('DOMContentLoaded',mount,{once:true});language();render();setTimeout(()=>{const b=document.getElementById('sakCreativeIcon');if(b)b.click();},0);
})();
</script></body></html>
