<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062c31"><title>القنوات المباشرة والراديو</title>
<style>
:root{color-scheme:dark;--sea:#062c31;--glass:rgba(5,34,40,.78);--line:rgba(142,241,212,.23);--mint:#caffeb;--gold:#dfbd70}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tajawal,Cairo,Tahoma,Arial,sans-serif;color:#f4fff9;background:#03171d}
#siteBg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.34}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 0,rgba(10,88,78,.62),rgba(2,17,23,.83) 55%,rgba(1,10,15,.94));pointer-events:none}
header{position:sticky;top:0;z-index:5;padding:14px max(14px,env(safe-area-inset-left));background:rgba(2,20,25,.78);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.top{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:var(--mint);font-size:clamp(18px,3vw,26px);text-shadow:0 0 20px #26ba92}.back,.tab,.action{border:1px solid var(--line);border-radius:13px;background:linear-gradient(130deg,rgba(8,91,77,.86),rgba(7,45,54,.94));color:white;padding:10px 15px;font:700 14px inherit;text-decoration:none;cursor:pointer}
main{width:min(1240px,calc(100% - 24px));margin:24px auto 70px}.hero{padding:clamp(18px,4vw,36px);border:1px solid var(--line);border-radius:26px;background:linear-gradient(135deg,rgba(10,71,68,.72),rgba(5,28,38,.87) 65%,rgba(101,78,35,.30));box-shadow:0 22px 70px #0007,inset 0 1px #ffffff14;backdrop-filter:blur(16px)}
h1{font-size:clamp(25px,4.5vw,42px);margin:0 0 8px;color:#e7fff5}p{color:#c8e4db;line-height:1.7;margin:0}
.tabs{display:flex;gap:10px;margin:20px 0 14px}.tab{flex:1;min-height:48px;font-size:15px}.tab.active{background:linear-gradient(110deg,#087b65,#0c5459,#94712d);border-color:#a4f2d3}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;margin:14px 0}.controls input,.controls select{min-width:0;min-height:46px;padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:#031e25dc;color:white;font:inherit}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.filters button{border:1px solid var(--line);border-radius:999px;background:#092f34;color:#eafff5;padding:8px 13px;cursor:pointer}.filters button.active{background:#087860;border-color:#a2f2d1}
.meta{font-size:13px;color:#c3e8da;padding:4px 2px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,195px),1fr));gap:12px}
.card{position:relative;display:flex;min-height:125px;align-items:center;gap:12px;text-align:start;padding:14px;border:1px solid var(--line);border-radius:18px;color:#f7fff9;background:linear-gradient(145deg,rgba(11,60,61,.89),rgba(4,25,34,.94));box-shadow:0 10px 24px #0003;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:#88f0c5;box-shadow:0 14px 30px #0005,0 0 20px #25cd9c22}.logo{width:48px;height:48px;flex:none;object-fit:contain;border-radius:13px;background:#fff;padding:3px}.fallback{display:grid;place-items:center;background:#12454a;color:#dbfff1;font-size:24px}.details{min-width:0}.name{font-size:14px;font-weight:800;line-height:1.4}.sub{font-size:11px;color:#c0ded4;margin-top:4px;line-height:1.5}.state{font-size:10px;color:#a7f3c8;margin-top:7px}.star{position:absolute;top:8px;inset-inline-end:9px;border:0;background:transparent;color:#ffe18b;font-size:22px;cursor:pointer}
.panel{display:none}.panel.active{display:block}.radioPlayer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--glass);margin:14px 0}.radioPlayer audio{flex:1;min-width:min(100%,250px)}.official{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:9px;margin:14px 0}.official a{padding:12px;border:1px solid var(--line);border-radius:13px;background:#082d33;color:#eefff8;text-align:center;text-decoration:none;font-weight:700}
#player{display:none;position:fixed;inset:0;z-index:99;place-items:center;background:#000d;backdrop-filter:blur(12px);padding:14px}#player.open{display:grid}.playerbox{position:relative;width:min(1000px,96vw);padding:18px;border:1px solid #a0efd2;border-radius:22px;background:linear-gradient(145deg,#0a3e40,#061923);box-shadow:0 20px 90px #000a}.playerbox video{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px}.close{float:inline-end;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#812d36;color:white;font-size:20px;cursor:pointer}
@media(max-width:620px){header{padding:10px}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.tabs{position:sticky;top:65px;z-index:4;padding:5px;background:#031a20e8;border-radius:15px}.card{min-height:116px;padding:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.logo{width:40px;height:40px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style id="sak-live-rose-theme">
body:before{background:radial-gradient(ellipse at 14% 16%,rgba(255,79,177,.35),transparent 34%),radial-gradient(ellipse at 88% 24%,rgba(184,89,255,.30),transparent 36%),radial-gradient(ellipse at 60% 92%,rgba(255,131,188,.26),transparent 38%),linear-gradient(145deg,rgba(35,8,36,.78),rgba(17,8,32,.81) 55%,rgba(52,11,45,.78))!important}
header{background:rgba(31,9,34,.8)!important;border-color:rgba(255,174,222,.34)!important}.brand{color:#ffe6f7!important;text-shadow:0 0 14px #ff66b7,0 0 28px #a65bff!important}
.hero{border-color:rgba(255,167,221,.42)!important;background:radial-gradient(circle at 12% 8%,rgba(255,112,194,.22),transparent 30%),radial-gradient(circle at 90% 85%,rgba(191,99,255,.22),transparent 32%),linear-gradient(135deg,rgba(86,19,70,.8),rgba(34,15,49,.91) 65%,rgba(90,22,69,.72))!important;box-shadow:0 22px 70px #0008,inset 0 1px #ffffff1c,0 0 36px rgba(240,57,169,.13)!important}
h1{color:#fff0fa!important;text-shadow:0 0 16px rgba(255,99,190,.46)!important}p{color:#f1cfe5!important}
.back,.tab,.action{border-color:rgba(255,178,225,.48)!important;background:linear-gradient(125deg,#b92c7d,#71308e 60%,#d65b91)!important;box-shadow:0 0 16px rgba(255,72,176,.18)!important}.tab.active{background:linear-gradient(120deg,#eb489f,#a749c8 55%,#ff86b1)!important;border-color:#ffd7ef!important}
.controls input,.controls select{border-color:rgba(255,179,225,.4)!important;background:rgba(35,12,42,.91)!important}.filters button{border-color:rgba(255,179,225,.38)!important;background:rgba(63,20,59,.91)!important}.filters button.active{background:linear-gradient(120deg,#d63891,#a044bf)!important;border-color:#ffd7ef!important}
.meta{color:#f5d6e9!important}.card{border-color:rgba(255,167,220,.35)!important;background:radial-gradient(circle at 90% 12%,rgba(255,107,190,.18),transparent 38%),linear-gradient(145deg,rgba(82,25,71,.94),rgba(35,16,47,.96))!important;box-shadow:0 10px 26px #0005,0 0 13px rgba(255,73,178,.1)!important}.card:hover{border-color:#ffb7e2!important;box-shadow:0 14px 30px #0006,0 0 24px rgba(255,76,177,.27)!important}
.sub{color:#f0c9e2!important}.state{color:#ffc8e6!important}.official a{border-color:rgba(255,178,225,.4)!important;background:linear-gradient(120deg,rgba(93,28,77,.92),rgba(45,18,58,.96))!important;color:#fff2fa!important}
.radioPlayer{border-color:rgba(255,179,225,.42)!important;background:linear-gradient(120deg,rgba(85,23,72,.91),rgba(39,17,55,.96))!important}#player{background:rgba(22,5,28,.88)!important}.playerbox{border-color:#ffb4df!important;background:linear-gradient(145deg,#571847,#29133d)!important;box-shadow:0 0 40px rgba(255,71,179,.34),0 20px 90px #000b!important}
</style>
</head>
<body>
<video id="siteBg" autoplay muted loop playsinline aria-hidden="true" src="/gemini_generated_video_34118154.mp4"></video>
<header><div class="top"><div class="brand">🌸 قنوات مباشرة</div><a class="back" href="index.html">↩ الرئيسية</a></div></header>
<main><section class="hero"><h1>القنوات المباشرة والراديو</h1><p>دليل بث متجدد للقنوات العالمية ومحطات الراديو، مع حالة التشغيل ومفضّلتك.</p>
<div class="tabs"><button class="tab active" data-panel="tv">📺 القنوات</button><button class="tab" data-panel="radio">📻 الراديو</button></div>
<section class="panel active" id="tv">
<div class="controls"><input id="tvSearch" type="search" placeholder="ابحث عن قناة أو دولة أو لغة"><select id="country"><option value="">كل الدول</option></select><select id="language"><option value="">كل اللغات</option></select></div>
<div class="filters"><button class="active" data-filter="all">الكل</button><button data-filter="online">🟢 يعمل</button><button data-filter="favorites">★ المفضلة</button></div>
<div class="meta" id="tvMeta">جارٍ تحميل الدليل…</div><div class="grid" id="tvGrid"></div><button id="tvMore" class="action" style="width:100%;margin-top:14px">عرض المزيد</button>
</section>
<section class="panel" id="radio">
<div class="radioPlayer"><strong id="radioNow">📻 اختر محطة للاستماع</strong><audio id="radioAudio" controls preload="none"></audio></div>
<div class="official"><a target="_blank" rel="noopener" href="https://radioplus.sba.sa/ar/live/4">إذاعة القرآن الكريم · السعودية ↗</a><a target="_blank" rel="noopener" href="https://radioplus.sba.sa/ar/live/2">إذاعة الرياض ↗</a><a target="_blank" rel="noopener" href="https://radioplus.sba.sa/ar/live/3">إذاعة جدة ↗</a><a target="_blank" rel="noopener" href="https://radioplus.sba.sa/ar/live/1">نداء الإسلام ↗</a><button class="action" id="cairo">▶ إذاعة القرآن الكريم من القاهرة</button></div>
<div class="controls"><input id="radioSearch" type="search" placeholder="ابحث عن إذاعة أو دولة أو نوع"><select id="radioCountry"><option value="">كل الدول</option></select><select id="radioLanguage"><option value="">كل اللغات</option></select></div><div class="meta" id="radioMeta">جارٍ تحميل المحطات…</div><div class="grid" id="radioGrid"></div><button id="radioMore" class="action" style="width:100%;margin-top:14px">عرض المزيد</button>
</section>
</section></main>
<div id="player" role="dialog" aria-modal="true" aria-label="مشغل القناة"><div class="playerbox"><button class="close" id="close" aria-label="إغلاق">×</button><h2 id="playerTitle"></h2><video id="tvVideo" controls playsinline autoplay></video><p id="playerMsg"></p></div></div>
<script>
(()=>{'use strict';
const BASE='https://dearbulut.github.io/iptv',FKEY='sakaker-live-favorites-v1',RADIO_HOSTS=['https://de1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info'];
const $=id=>document.getElementById(id);let tvRows=[],radioRows=[],tvVisible=60,radioVisible=60,filter='all',favorites={};
try{favorites=JSON.parse(localStorage.getItem(FKEY)||'{}')}catch(_){}
const fields={};
function parse(v){if(Array.isArray(v))return v;if(!v)return[];try{return JSON.parse(v)}catch(_){return String(v).split(',').filter(Boolean)}}
function status(ok){return Number(ok)>0}
function setGrid(kind){
 const rows=kind==='tv'?tvRows:radioRows,grid=$(kind==='tv'?'tvGrid':'radioGrid'),search=$(kind==='tv'?'tvSearch':'radioSearch').value.trim().toLowerCase(),country=$(kind==='tv'?'country':'radioCountry').value,language=$(kind==='tv'?'language':'radioLanguage').value,limit=kind==='tv'?tvVisible:radioVisible;
 let found=rows.filter(x=>{
  const langs=kind==='tv'?x.languages:String(x.languagecodes||x.language||'').split(',').map(a=>a.trim());
  const cc=kind==='tv'?x.country:x.countrycode;
  if(country&&cc!==country)return false;if(language&&!langs.includes(language))return false;
  if(kind==='tv'&&filter==='online'&&!x.online)return false;if(kind==='tv'&&filter==='favorites'&&!favorites[x.id])return false;
  if(search&&!String([x.name,x.country,x.countrycode,x.languages,x.tags,x.state].join(' ')).toLowerCase().includes(search))return false;return true
 });
 grid.replaceChildren();found.slice(0,limit).forEach(x=>grid.appendChild(card(kind,x)));
 const more=$(kind==='tv'?'tvMore':'radioMore');more.style.display=found.length>limit?'block':'none';
 const meta=$(kind==='tv'?'tvMeta':'radioMeta');meta.textContent=kind==='tv'?found.length+' قناة · '+rows.filter(x=>x.online).length+' تعمل الآن':found.length+' محطة متاحة';
}
function card(kind,x){
 const b=document.createElement('button');b.className='card';b.type='button';
 let logo;
 if(x.logo||x.favicon){logo=document.createElement('img');logo.className='logo';logo.loading='lazy';logo.src=x.logo||x.favicon;logo.alt='';logo.onerror=()=>{const d=document.createElement('span');d.className='logo fallback';d.textContent=kind==='tv'?'📺':'📻';logo.replaceWith(d)}}
 else{logo=document.createElement('span');logo.className='logo fallback';logo.textContent=kind==='tv'?'📺':'📻'}
 const d=document.createElement('div');d.className='details';const n=document.createElement('div');n.className='name';n.textContent=x.name||'—';const sub=document.createElement('div');sub.className='sub';sub.textContent=kind==='tv'?[x.country,x.languages.join(', ')].filter(Boolean).join(' · '):[x.country,x.codec].filter(Boolean).join(' · ');
 const st=document.createElement('div');st.className='state';st.textContent=kind==='tv'?(x.online?'🟢 البث متاح':'⚪ لم يؤكد آخر فحص'):((x.lastcheckok===1)?'🟢 يعمل':'⚪ يفتح خارجيًا');d.append(n,sub,st);b.append(logo,d);
 if(kind==='tv'){
  const star=document.createElement('span');star.className='star';star.textContent=favorites[x.id]?'★':'☆';star.title='المفضلة';star.addEventListener('click',e=>{e.stopPropagation();favorites[x.id]=!favorites[x.id];if(!favorites[x.id])delete favorites[x.id];try{localStorage.setItem(FKEY,JSON.stringify(favorites))}catch(_){}setGrid('tv')});b.append(star);b.addEventListener('click',()=>playTv(x))
 }else b.addEventListener('click',()=>playRadio(x));
 return b
}
async function playTv(x){
 $('playerTitle').textContent=x.name;$('playerMsg').textContent='جارٍ التحقق من البث…';$('player').classList.add('open');
 try{const r=await fetch(BASE+'/api/v1/channels/'+encodeURIComponent(x.id)+'.json',{cache:'no-cache'});if(!r.ok)throw Error('stream unavailable');const data=await r.json();const s=(data.streams||[]).find(z=>z.url&&(!z.health||z.health.status==='online'))||(data.streams||[]).find(z=>z.url);if(!s)throw Error('no stream');const v=$('tvVideo');if(window._hls){window._hls.destroy();window._hls=null}v.pause();v.removeAttribute('src');const url=s.url;if(window.Hls&&Hls.isSupported()&&/\.m3u8($|\?)/i.test(url)){window._hls=new Hls();window._hls.loadSource(url);window._hls.attachMedia(v)}else v.src=url;$('playerMsg').textContent='';try{await v.play()}catch(_){} }catch(e){$('playerMsg').textContent='تعذر تشغيل البث داخل المشغل. جرّب موقع القناة أو افتحها في الموقع الرئيسي.'}
}
function close(){const p=$('player');p.classList.remove('open');const v=$('tvVideo');v.pause();v.removeAttribute('src');v.load();if(window._hls){window._hls.destroy();window._hls=null}}
$('close').onclick=close;$('player').onclick=e=>{if(e.target===$('player'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function options(select,values,placeholder){select.replaceChildren(new Option(placeholder,''));[...new Set(values.filter(Boolean))].sort().forEach(v=>select.add(new Option(v,v)))}
async function loadTv(){try{const r=await fetch(BASE+'/api/v1/search.json',{cache:'no-cache'});if(!r.ok)throw Error();const d=await r.json();d.fields.forEach((f,i)=>fields[f]=i);tvRows=(d.channels||[]).map(row=>{const val=k=>row[fields[k]];return{id:String(val('id')||''),name:String(val('name')||''),country:String(val('country')||''),languages:parse(val('languages')),logo:String(val('logo')||''),online:status(val('online'))}});options($('country'),tvRows.map(x=>x.country),'كل الدول');options($('language'),tvRows.flatMap(x=>x.languages),'كل اللغات');setGrid('tv')}catch(_){$('tvMeta').textContent='تعذر تحميل دليل القنوات؛ تحقق من الاتصال ثم حدّث الصفحة.'}}
async function loadRadio(){for(const host of RADIO_HOSTS){try{const u=host+'/json/stations/search?hidebroken=true&order=clickcount&reverse=true&limit=500';const r=await fetch(u,{cache:'no-cache'});if(!r.ok)continue;radioRows=(await r.json()).filter(x=>x.name&&(x.url_resolved||x.url));options($('radioCountry'),radioRows.map(x=>x.countrycode),'كل الدول');options($('radioLanguage'),radioRows.flatMap(x=>String(x.languagecodes||'').split(',').filter(Boolean)),'كل اللغات');setGrid('radio');return}catch(_){}}$('radioMeta').textContent='تعذر تحديث دليل الراديو الآن.'}
function playRadio(x){const a=$('radioAudio');$('radioNow').textContent=x.name;a.src=x.url_resolved||x.url;a.load();a.play().catch(()=>{$('radioNow').textContent='تعذر التشغيل المباشر · افتح الموقع الرسمي للمحطة'})}
$('cairo').onclick=()=>playRadio({name:'إذاعة القرآن الكريم من القاهرة',url:'https://stream.radiojar.com/8s5u5tpdtwzuv',url_resolved:'https://stream.radiojar.com/8s5u5tpdtwzuv'});
['tvSearch','country','language'].forEach(id=>$(id).addEventListener('input',()=>{tvVisible=60;setGrid('tv')}));['radioSearch','radioCountry','radioLanguage'].forEach(id=>$(id).addEventListener('input',()=>{radioVisible=60;setGrid('radio')}));
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));tvVisible=60;setGrid('tv')});
$('tvMore').onclick=()=>{tvVisible+=60;setGrid('tv')};$('radioMore').onclick=()=>{radioVisible+=60;setGrid('radio')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.panel));if(b.dataset.panel==='radio'&&!radioRows.length)loadRadio()});
loadTv();loadRadio();
})();
</script>
</body>
</html>
