<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAKAKER — Live Channels</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#031218;color:#fff;font-family:Tahoma,Arial,sans-serif}body{padding:76px 14px 28px;background:radial-gradient(circle at 50% 0,#0b3a3d 0,#031218 55%,#01090c 100%)}
.back{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:100;padding:10px 14px;border:1px solid rgba(130,255,225,.7);border-radius:14px;background:rgba(4,30,35,.88);color:#fff;font-weight:700;cursor:pointer;backdrop-filter:blur(12px)}
h1{text-align:center;margin:0 0 22px;font-size:clamp(22px,5vw,34px);color:#eafff8;text-shadow:0 0 18px #36ffd2}
#liveVideosContainer{width:min(1000px,100%);margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.live-video{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:20px;border:1px solid rgba(100,255,225,.55);background:#000;box-shadow:0 0 20px rgba(0,255,210,.18),inset 0 0 18px rgba(255,255,255,.05);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.live-video:hover{transform:translateY(-3px);box-shadow:0 0 30px rgba(0,255,210,.35)}.live-video iframe{width:100%;height:100%;border:0;pointer-events:none}.live-video::after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#fff;text-shadow:0 0 14px #000;pointer-events:none}
#videoOverlay{display:none;position:fixed;inset:0;z-index:2147483646;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:18px}#videoBox{position:relative;width:min(900px,96vw);aspect-ratio:16/9;background:#000;border-radius:22px;overflow:hidden;border:1px solid rgba(120,255,230,.65);box-shadow:0 0 45px rgba(0,255,210,.3)}#mainVideo{width:100%;height:100%;border:0}#closeVideo{position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;border:0;border-radius:50%;background:rgba(180,20,45,.94);color:#fff;font-size:18px;cursor:pointer}
@media(max-width:600px){body{padding:68px 10px 22px}h1{margin-bottom:16px}#liveVideosContainer{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.live-video{border-radius:14px}.back{padding:8px 11px;font-size:13px}#videoOverlay{padding:8px}#videoBox{width:100%;border-radius:15px}}
@media(max-width:360px){#liveVideosContainer{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="back" type="button" onclick="location.href='index.html'">↩ الرئيسية / Home</button>
<h1>📺 قنوات مباشرة / Live Channels</h1>
<div id="liveVideosContainer"></div>
<div id="videoOverlay" role="dialog" aria-modal="true" aria-label="Live video"><div id="videoBox"><button id="closeVideo" type="button" aria-label="Close">✕</button><iframe id="mainVideo" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div>
<script>
const channels=['AGkp2AL8e7o','0FBiyFpV__g','HfgIFGbdGJ0','LuKwFajn37U','n7eQejkXbnM','J2TXKYeBUi4','GNi0keWY1io','Va6QU9n3q18','MiQe9ob9aDc','TLRlAlyiT7Y'];
const list=document.getElementById('liveVideosContainer'),overlay=document.getElementById('videoOverlay'),main=document.getElementById('mainVideo');
channels.forEach(id=>{const card=document.createElement('div');card.className='live-video';card.innerHTML=`<iframe loading="lazy" title="Live channel" src="https://www.youtube.com/embed/${id}?mute=1" allowfullscreen></iframe>`;card.addEventListener('click',()=>openVideo(id));list.appendChild(card)});
function openVideo(id){main.src=`https://www.youtube.com/embed/${id}?autoplay=1`;overlay.style.display='flex';document.body.style.overflow='hidden'}
function closeVideo(){main.src='';overlay.style.display='none';document.body.style.overflow=''}
document.getElementById('closeVideo').addEventListener('click',closeVideo);overlay.addEventListener('click',e=>{if(e.target===overlay)closeVideo()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});
</script>
</body>
</html>
