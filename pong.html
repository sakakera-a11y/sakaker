 async function sendState(){if(!room||!api||stateWritePending)return;stateWritePending=true;const state=role==='host'?{x:ball.x,y:ball.y,left:y1,right:y2,a:scores[0],b:scores[1]}:{y:y2};try{await api.set(path(role==='host'?'state':'paddle'),state)}catch(e){finish('offline')}finally{stateWritePending=false}}
 async function release(closeRemote=true){generation++;clearInterval(heartbeat);unsubs.forEach(fn=>fn());unsubs=[];const leavingRoom=room,leavingRole=role;if(disconnectHook){try{await disconnectHook.cancel()}catch(e){}disconnectHook=null}if(lobbyDisconnectHook){try{await lobbyDisconnectHook.cancel()}catch(e){}lobbyDisconnectHook=null}if(closeRemote&&leavingRoom&&api){if(leavingRole==='host')await removeLobbyCode(leavingRoom);try{await api.set(api.ref(db,'pongRoomsV1/'+leavingRoom+'/meta/status'),'closed')}catch(e){}}room='';mode='';role='';endAt=0;roomData=null;chatCache={};stateWritePending=false;$('sakPongMessages').replaceChildren();keys.clear();controls();}
 async function watch(token){
  unsubs.push(api.onValue(api.ref(db,'.info/serverTimeOffset'),s=>{offset=Number(s.val())||0}));
  disconnectHook=api.onDisconnect(path('meta/status'));await disconnectHook.set('closed');
  if(token!==generation)return;
  unsubs.push(api.onValue(path('meta'),snap=>{if(token!==generation)return;const data=snap.val();if(!data){finish('offline');return}roomData=data;if(data.status==='closed'){finish('offline');return}if(data.guest&&data.start){endAt=data.start+data.minutes*60000;$('sakPongDuration').value=String(data.minutes);if(role==='host')removeLobbyCode(room);status('playing')}else status('waiting',room);renderPrivateChat();controls();},()=>finish('offline')));
  unsubs.push(api.onValue(path(role==='host'?'paddle':'state'),snap=>{const s=snap.val();if(!s||token!==generation)return;if(role==='host'){if(Number.isFinite(s.y))y2=clamp(s.y,15,405)}else if([s.x,s.y,s.left,s.a,s.b].every(Number.isFinite)){ball.x=clamp(s.x,-10,810);ball.y=clamp(s.y,0,500);y1=clamp(s.left,15,405);scores=[Math.max(0,s.a),Math.max(0,s.b)];}},()=>finish('offline')));
  unsubs.push(api.onValue(api.query(path('chat'),api.limitToLast(50)),snap=>{chatCache=snap.val()||{};renderPrivateChat()},()=>status('error')));
  unsubs.push(api.onValue(api.ref(db,'.info/connected'),s=>{if(s.val()===false&&endAt)finish('offline')}));
 }
 async function online(join){if(busy||mode)return;busy=true;controls();status('busy');let token=++generation,remoteSession=false;
  try{await connect();if(token!==generation)return;reset();
   if(join){
    const candidate=$('sakPongCode').value.replace(/[^A-Fa-f0-9]/g,'').slice(0,12).toUpperCase();
    $('sakPongCode').value=candidate;
    if(!/^[A-F0-9]{12}$/.test(candidate))throw Error('invalid');
    const metaRef=api.ref(db,'pongRoomsV1/'+candidate+'/meta');
    const result=await api.runTransaction(metaRef,m=>{if(!m||m.status!=='waiting'||m.guest||m.host===uid)return;return {...m,guest:uid,status:'playing',start:api.serverTimestamp()};});
    if(!result.committed||result.snapshot.val()?.guest!==uid)throw Error('invalid');
    room=candidate;role='guest';remoteSession=true;
   }else{
    const candidate=Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>n.toString(16).padStart(2,'0')).join('').toUpperCase();
    const metaRef=api.ref(db,'pongRoomsV1/'+candidate+'/meta');
    await api.set(metaRef,{host:uid,status:'waiting',minutes:Number($('sakPongDuration').value),created:api.serverTimestamp()});
    room=candidate;role='host';remoteSession=true;$('sakPongCode').value=room;$('sakPongPublicCode').value='';
   }
   if(token!==generation){await release(true);return;}
   mode='online';$('sakPongMessages').replaceChildren();await watch(token);canvas.focus();
  }catch(e){await release(remoteSession);status(['login','invalid'].includes(e.message)?e.message:'error')}finally{busy=false;controls()}
 }
 $('sakPongSolo').onclick=()=>{if(mode)return;reset();mode='solo';role='host';offset=0;endAt=Date.now()+Number($('sakPongDuration').value)*60000;status('playing');controls();canvas.focus()};
 $('sakPongCreate').onclick=()=>online(false);$('sakPongJoin').onclick=()=>online(true);$('sakPongLeave').onclick=async()=>{await release(true);reset();status('idle')};
 const normalizeRoomCode=input=>{input.value=input.value.replace(/[^A-Fa-f0-9]/g,'').slice(0,12).toUpperCase();};
 $('sakPongCode').addEventListener('input',()=>normalizeRoomCode($('sakPongCode')));
 $('sakPongPublicCode').addEventListener('input',()=>normalizeRoomCode($('sakPongPublicCode')));
 $('sakPongCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!busy&&!mode)online(true)}});
 $('sakPongPublicForm').onsubmit=async e=>{e.preventDefault();const code=$('sakPongPublicCode').value.trim().toUpperCase();if(!/^[A-F0-9]{12}$/.test(code)){status('invalid');return}try{await connect();const metaSnap=await api.get(api.ref(db,'pongRoomsV1/'+code+'/meta'));const meta=metaSnap.val();if(!meta||meta.host!==uid||meta.status!=='waiting'||meta.guest){status('ownRoomOnly');return}await api.set(lobbyPath(code),{code,status:'waiting',created:api.serverTimestamp()});if(room===code&&role==='host'){if(lobbyDisconnectHook){try{await lobbyDisconnectHook.cancel()}catch(err){}}lobbyDisconnectHook=api.onDisconnect(lobbyPath(code));await lobbyDisconnectHook.remove()}$('sakPongPublicCode').value='';status('roomPublished')}catch(err){status('lobbyError')}};
 $('sakPongCopy').onclick=async()=>{if(!room)return;try{await navigator.clipboard.writeText(room);$('sakPongCode').value=room;status('copied')}catch(e){$('sakPongCode').value=room;$('sakPongCode').focus();$('sakPongCode').select();status('copyFail')}};
 const updateShare=()=>{};
 const invitation=(new URL(location.href).searchParams.get('pongRoom')||'').replace(/[^A-Fa-f0-9]/g,'').slice(0,12).toUpperCase();
 if(/^[A-F0-9]{12}$/.test(invitation)){$('sakPongCode').value=invitation;}
 $('sakPongSendForm').onsubmit=async e=>{e.preventDefault();const message=$('sakPongMessage').value.trim();const me=window.firebaseAuth?.currentUser?.uid,allowed=me&&(me===roomData?.host||me===roomData?.guest);if(mode!=='online'||ended||!endAt||!allowed||!message||Date.now()-lastChat<1000)return;lastChat=Date.now();try{await api.push(path('chat'),{uid:me,name:String(window.firebaseAuth.currentUser.displayName||'Player').slice(0,40),text:message.slice(0,240),time:api.serverTimestamp()});$('sakPongMessage').value=''}catch(e){status('error')}};
 const audioFrame=$('pongGame-video');if(audioFrame){audioFrame.id='sakPongAudioFrame';arena.append(audioFrame)}
 $('sakPongAudio').onclick=()=>{audio=!audio;if(audioFrame){if(audio)audioFrame.src=audioFrame.dataset.audioSrc;else audioFrame.removeAttribute('src')}labels()};
 $('sakPongExit').onclick=()=>arena.close();
 arena.addEventListener('close',()=>{gameSession=false;cancelAnimationFrame(raf);stopLobby();release(true);if(audioFrame)audioFrame.removeAttribute('src');audio=false;labels();status('idle');$('pongGame-btn')?.focus()});
 document.addEventListener('click',e=>{if(!e.target.closest('#pongGame-btn'))return;e.preventDefault();e.stopImmediatePropagation();if(!arena.open){arena.showModal();reset();labels();controls();ensureGameAccount().then(()=>{if(window.firebaseAuth?.currentUser)return startLobby()}).catch(()=>status('error'));raf=requestAnimationFrame(frame)}},true);
 new MutationObserver(labels).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
 labels();controls();draw();
})();
