let lang='ar',oldOverflow='';const PAGE=25,state={};
function videoUrl(id){return'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?playsinline=1&rel=0'}

function itemsFor(key){const s=DATA[key],out=s.seeds.map((x,i)=>({ar:x.ar,en:x.en,url:videoUrl(x.id),n:i+1}));if(key==='religious')return out;for(let i=out.length;i<s.target;i++)out.push({ar:s.ar+' '+String(i+1).padStart(3,'0'),en:s.en+' '+String(i+1).padStart(3,'0'),url:playlistUrl(s.playlist,i),n:i+1});return out.slice(0,s.target)}

function renderSection(key){const section=document.querySelector('[data-key="'+key+'"]');if(!section||!state[key]?.open)return;const grid=section.querySelector('.videoGrid'),more=section.querySelector('.moreWrap'),q=(document.getElementById('librarySearch').value||'').trim().toLowerCase(),all=ALL[key],filtered=q?all.filter(x=>(x.ar+' '+x.en+' '+x.n).toLowerCase().includes(q)):all,limit=q?filtered.length:Math.min(state[key].shown||PAGE,filtered.length),shown=filtered.slice(0,limit);grid.innerHTML='';if(!shown.length){grid.innerHTML='<div class="empty">'+t('no')+'</div>'}else{const frag=document.createDocumentFragment();shown.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='emeraldVideoCircle';b.setAttribute('aria-label',lang==='ar'?item.ar:item.en);b.innerHTML='<span class="num">#'+String(item.n).padStart(3,'0')+'</span><span class="label">'+esc(lang==='ar'?item.ar:item.en)+'</span>';b.addEventListener('click',()=>openEmeraldVideo(item.url));frag.appendChild(b)});grid.appendChild(frag)}more.classList.toggle('show',!q&&limit<filtered.length)}
