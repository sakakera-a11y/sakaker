      const identity=x.id
        ?('id:'+x.id+':'+(x.start||0))
        :(x.list?('list:'+x.list+':'+(x.index||0)):(x.href||((x.ar||'')+'|'+(x.en||''))));
      if(!identity||seen.has(identity))return false;
      seen.add(identity);return true;
    })
    .map((x,i)=>({
      ar:x.ar,en:x.en,id:x.id||null,list:x.list||null,
      url:x.id?videoUrl(x.id,x.start||0):(x.list?playlistUrl(x.list,x.index||0):null),
      href:x.href||null,external:!!x.external,n:i+1
    }));
}
const ALL=Object.fromEntries(Object.keys(DATA).map(k=>[k,itemsFor(k)]));
function t(k){return I18N[lang][k]||k}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(I18N[lang][k])el.textContent=I18N[lang][k]});document.getElementById('langBtn').textContent=lang==='ar'?'EN':'AR';const q=document.getElementById('librarySearch');q.placeholder=t('search');q.setAttribute('aria-label',t('search'));renderShells()}
function renderShells(){const host=document.getElementById('library'),openKey=Object.keys(state).find(k=>state[k]?.open);host.innerHTML='';for(const [key,s] of Object.entries(DATA)){const wrap=document.createElement('section');wrap.className='section'+(state[key]?.open?' open':'');wrap.dataset.key=key;const count=ALL[key].length;wrap.innerHTML='<button class="sectionHead" type="button" aria-expanded="'+(state[key]?.open?'true':'false')+'"><span class="sectionName"><span class="sectionIcon">'+s.icon+'</span><span>'+(lang==='ar'?s.ar:s.en)+'</span></span><span class="count">'+count+' '+t('videos')+'</span></button><div class="videoGrid"></div><div class="moreWrap"><button class="moreBtn" type="button">'+t('more')+'</button></div>';wrap.querySelector('.sectionHead').addEventListener('click',()=>toggleSection(key));wrap.querySelector('.moreBtn').addEventListener('click',()=>{state[key].shown+=PAGE;renderSection(key)});host.appendChild(wrap)}if(openKey)renderSection(openKey)}
function toggleSection(key){const was=!!state[key]?.open;for(const k of Object.keys(DATA))state[k]={open:false,shown:state[k]?.shown||PAGE};state[key]={open:!was,shown:state[key]?.shown||PAGE};renderShells();if(!was)setTimeout(()=>document.querySelector('[data-key="'+key+'"]')?.scrollIntoView({block:'nearest',behavior:'smooth'}),20)}
function renderSection(key){const section=document.querySelector('[data-key="'+key+'"]');if(!section||!state[key]?.open)return;const grid=section.querySelector('.videoGrid'),more=section.querySelector('.moreWrap'),q=(document.getElementById('librarySearch').value||'').trim().toLowerCase(),all=ALL[key],filtered=q?all.filter(x=>(x.ar+' '+x.en+' '+x.n).toLowerCase().includes(q)):all,limit=q?filtered.length:Math.min(state[key].shown||PAGE,filtered.length),shown=filtered.slice(0,limit);grid.innerHTML='';if(!shown.length){grid.innerHTML='<div class="empty">'+t('no')+'</div>'}else{const frag=document.createDocumentFragment();shown.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='emeraldVideoCircle';b.setAttribute('aria-label',lang==='ar'?item.ar:item.en);{
      const preview=document.createElement('span');preview.className='videoPreview';
      if(item.id){
        const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+item.id+'/mqdefault.jpg';img.alt='';img.loading='lazy';img.decoding='async';preview.appendChild(img);
      }else{
        preview.classList.add('videoPreviewFallback');preview.textContent='▶';
      }
      const num=document.createElement('span');num.className='num';num.textContent='#'+String(item.n).padStart(3,'0');
      const label=document.createElement('span');label.className='label';label.textContent=lang==='ar'?item.ar:item.en;
      b.append(preview,num,label);
    }b.addEventListener('click',()=>{if(item.external&&item.href){window.open(item.href,'_blank','noopener,noreferrer');return}if(item.url)openEmeraldVideo(item.url)});frag.appendChild(b)});grid.appendChild(frag)}more.classList.toggle('show',!q&&limit<filtered.length)}
function closeEmeraldVideo(){const m=document.getElementById('emeraldModal');if(!m)return;const f=m.querySelector('iframe');if(f)f.src='about:blank';m.remove();document.body.style.overflow=oldOverflow}
function openEmeraldVideo(url){closeEmeraldVideo();oldOverflow=document.body.style.overflow;document.body.style.overflow='hidden';const m=document.createElement('div');m.id='emeraldModal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');const shell=document.createElement('div');shell.className='playerShell';const f=document.createElement('iframe');f.src=url+(url.includes('?')?'&':'?')+'autoplay=1';f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';f.title=lang==='ar'?'مشغل الفيديو':'Video player';const close=document.createElement('button');close.id='emeraldModalClose';close.type='button';close.textContent=t('close');close.addEventListener('click',closeEmeraldVideo);shell.appendChild(f);m.append(shell,close);m.addEventListener('click',e=>{if(e.target===m)closeEmeraldVideo()});document.body.appendChild(m);requestAnimationFrame(()=>close.focus({preventScroll:true}))}
window.openEmeraldVideo=openEmeraldVideo;window.closeEmeraldVideo=closeEmeraldVideo;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEmeraldVideo()});document.getElementById('librarySearch').addEventListener('input',()=>{const key=Object.keys(state).find(k=>state[k]?.open);if(key)renderSection(key)});document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';applyLang()});document.getElementById('homeBtn').addEventListener('click',()=>{try{window.top.location.href='/'}catch(_){location.href='/'}});for(const k of Object.keys(DATA))state[k]={open:false,shown:PAGE};renderShells();
</script>
