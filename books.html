<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الكتب الإلكترونية | abwalqmrzmrd castle</title>
<style>
:root{--bg:#031218;--panel:#07251f;--emerald:#00ffd0;--gold:#ffd45c;--text:#fff;--muted:#b8d3cc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#0b3a31 0,#031218 48%,#010708 100%);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
body{padding:18px 14px 32px}
header{max-width:980px;margin:0 auto 18px;text-align:center;position:relative}
h1{margin:8px 0 4px;color:var(--gold);text-shadow:0 0 14px #00ffd066}
.sub{color:var(--muted);font-size:14px}
.back{position:fixed;top:12px;left:12px;z-index:2147483646;border:1px solid #8fffe7;border-radius:999px;background:#06231e;color:#fff;padding:9px 14px;cursor:pointer;box-shadow:0 0 14px #00ffd044}
.grid{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.book{min-height:165px;border:1px solid #5fffd4aa;border-radius:22px;background:linear-gradient(145deg,rgba(7,47,39,.96),rgba(3,23,28,.98));color:#fff;padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 10px 28px #0008,0 0 20px #00ffd01f;transition:.22s}
.book:hover,.book:focus-visible{transform:translateY(-5px);box-shadow:0 14px 36px #0009,0 0 30px #00ffd044;outline:2px solid #fff8}
.book .ico{font-size:42px;margin-bottom:8px}.book b{font-size:16px;color:#fff}.book small{display:block;color:#cdeee6;margin-top:6px;line-height:1.5}.book span.action{margin-top:10px;color:var(--gold);font-weight:800;font-size:12px}
#reader{display:none;position:fixed;inset:0;width:100vw;height:100dvh;background:rgba(0,0,0,.88);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:2147483647;padding:10px}
#reader.open{display:flex;align-items:center;justify-content:center}
.readerBox{width:min(1100px,98vw);height:min(94dvh,900px);background:linear-gradient(145deg,#062a23,#03161a);border:1px solid #63ffda;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 30px #00ffd044}
.readerHead{min-height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #5fffd455}
.readerTitle{flex:1;text-align:center;font-weight:900;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readerBtn{border:1px solid #7fffe0;border-radius:12px;background:#0b3b33;color:#fff;text-decoration:none;padding:9px 12px;cursor:pointer;font-weight:800}
.readerClose{width:42px;height:42px;border-radius:50%;padding:0;font-size:24px;background:#62172c;border-color:#ff9ab6}
iframe{width:100%;height:100%;border:0;background:#fff;flex:1}
.note{max-width:980px;margin:18px auto 0;text-align:center;color:#b9d7d0;font-size:12px}
@media(max-width:720px){body{padding:65px 10px 24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.book{min-height:145px;padding:13px 8px;border-radius:17px}.book .ico{font-size:34px}.book b{font-size:14px}.readerHead{flex-wrap:wrap}.readerTitle{order:3;flex-basis:100%;font-size:13px}.readerBtn{font-size:12px;padding:8px 9px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.book{min-height:125px}}
</style>

<style id="sak-window-palette-books">
/* Warm amber glass palette for the in-site e-book reader. */
#reader{
 background:radial-gradient(ellipse at 14% 12%,rgba(255,193,94,.24),transparent 34%),radial-gradient(ellipse at 88% 88%,rgba(210,117,67,.18),transparent 38%),rgba(14,9,18,.88)!important;
 backdrop-filter:blur(15px) saturate(130%)!important;-webkit-backdrop-filter:blur(15px) saturate(130%)!important
}
#reader .readerBox{
 border-color:rgba(255,210,126,.82)!important;
 background:linear-gradient(145deg,rgba(77,48,20,.98),rgba(28,22,28,.98) 62%,rgba(117,67,36,.94))!important;
 box-shadow:inset 0 1px rgba(255,255,255,.14),0 22px 70px rgba(0,0,0,.62),0 0 30px rgba(255,181,74,.24)!important
}
#reader .readerHead{border-bottom-color:rgba(255,210,126,.38)!important}
#reader .readerTitle{color:#ffe5ad!important;text-shadow:0 0 15px rgba(255,185,83,.35)!important}
#reader .readerBtn:not(.readerClose){border-color:rgba(255,218,147,.58)!important;background:linear-gradient(125deg,#986026,#74452c 62%,#b77935)!important;box-shadow:0 0 14px rgba(255,184,76,.16)!important}
#reader .readerClose{border-color:#ffc7ac!important;background:linear-gradient(145deg,#a5413d,#67262b)!important;color:#fff!important}
@media(max-width:720px){#reader{padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))!important}#reader .readerBox{width:100%!important;height:calc(100dvh - max(12px,env(safe-area-inset-top)) - max(12px,env(safe-area-inset-bottom)))!important;border-radius:17px!important}}
</style>
</head>
<body>
<button class="back" id="backBtn" type="button">↩ الرئيسية / Home</button>
<header><h1 id="pageTitle">📚 الكتب الإلكترونية</h1><div class="sub" id="pageSub">قراءة داخل الموقع</div></header>
<main class="grid" id="booksGrid"></main>
<div class="note" id="note">تُعرض الكتب من Google Drive داخل قارئ الموقع.</div>

<div id="reader" aria-hidden="true">
  <section class="readerBox" role="dialog" aria-modal="true">
    <div class="readerHead">
      <button class="readerBtn readerClose" id="closeBtn" type="button" aria-label="إغلاق">×</button>
      <div class="readerTitle" id="readerTitle">كتاب إلكتروني</div>
      <a class="readerBtn" id="downloadBtn" href="#" target="_blank" rel="noopener">⬇ تحميل</a>
    </div>
    <iframe id="readerFrame" title="قارئ الكتاب" loading="eager"></iframe>
  </section>
</div>

<script>
(()=>{
'use strict';
const books=[
{id:'1GXTRPWdBrkI8f_x9KmhRpSfJM3HL1Bfy',ar:'الموسوعة العربية العالمية — الجزء 30',en:'The Arab World Encyclopedia — Volume 30',authorAr:'الموسوعة العربية العالمية',authorEn:'Arab World Encyclopedia'},
{id:'1E8m9p7TKZWoJdNEBn0RbAUZcyofOVQts',ar:'كليلة ودمنة',en:'Kalila wa Dimna',authorAr:'عبد الله بن المقفع',authorEn:'Abdullah ibn al-Muqaffa'},
{id:'1gwOaOxZe75ADi4lQbjxfvDS-qP4qGEhv',ar:'مغامرة في الصحراء',en:'Adventure in the Desert',authorAr:'مصطفى محمود',authorEn:'Mostafa Mahmoud'},
{id:'1vXtFhdd_6B_1H7TiSmZ_BufboGYQf7f5',ar:'أنت لي',en:'Anta Li',authorAr:'منى المرشود',authorEn:'Mona Al-Mershoud'},
{id:'1QNTci94vrzoUWO1yZFZdZ5RlM1vOqH2d',ar:'إيكادولي',en:'Ikadoli',authorAr:'حنان لاشين',authorEn:'Hanan Lashin'},
{id:'1z1iQDVvxcj49D664-wkCi-H3r2lBpkMs',ar:'قضية زعيم العصابة',en:'The Gang Leader Case',authorAr:'روايات مصرية للجيب',authorEn:'Egyptian Pocket Novels'},
{id:'1LdhTXBaSSHwOI6XBreWwCd8QqOjy3beu',ar:'فن الحياة',en:'The Art of Life',authorAr:'سلامة موسى',authorEn:'Salama Moussa'},
{id:'1svg6UMe1yq7d62iola4DHAMkT2dKWfPN',ar:'ألف ليلة وليلة',en:'One Thousand and One Nights',authorAr:'المجلد الأول',authorEn:'Volume One'},
{id:'1X8LuHDx06ZjSG1TH-Y065i0yVXUUoebu',ar:'قواعد جارتين',en:'Qawaed Jartin',authorAr:'عمرو عبد الحميد',authorEn:'Amr Abdel Hamid'}
];
let en=false;
try{en=(parent!==window&&parent.document.documentElement.lang==='en')||document.documentElement.lang==='en'}catch(e){en=document.documentElement.lang==='en'}
document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
const t=(ar,enText)=>en?enText:ar;
const grid=document.getElementById('booksGrid'),reader=document.getElementById('reader'),frame=document.getElementById('readerFrame'),title=document.getElementById('readerTitle'),download=document.getElementById('downloadBtn');
document.getElementById('pageTitle').textContent=t('📚 الكتب الإلكترونية','📚 E-Books');
document.getElementById('pageSub').textContent=t('قراءة داخل الموقع','Read inside the site');
document.getElementById('note').textContent=t('تُعرض الكتب من Google Drive داخل قارئ الموقع.','Books are displayed from Google Drive inside the site reader.');
document.getElementById('backBtn').textContent=t('↩ الرئيسية','↩ Home');
document.getElementById('downloadBtn').textContent=t('⬇ تحميل','⬇ Download');
books.forEach((b,i)=>{const el=document.createElement('button');el.type='button';el.className='book';el.innerHTML='<span class="ico">📖</span><b></b><small></small><span class="action"></span>';el.querySelector('b').textContent=t(b.ar,b.en);el.querySelector('small').textContent=t(b.authorAr,b.authorEn);el.querySelector('.action').textContent=t('قراءة الكتاب','Read book');el.onclick=()=>openBook(i);grid.appendChild(el)});
function openBook(i){const b=books[i];title.textContent='📖 '+t(b.ar,b.en);frame.src='https://drive.google.com/file/d/'+b.id+'/preview';download.href='https://drive.google.com/uc?export=download&id='+b.id;reader.classList.add('open');reader.setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden'}
function closeReader(){reader.classList.remove('open');reader.setAttribute('aria-hidden','true');frame.src='about:blank';document.documentElement.style.overflow=''}
document.getElementById('closeBtn').onclick=closeReader;
reader.addEventListener('click',e=>{if(e.target===reader)closeReader()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReader()});
document.getElementById('backBtn').onclick=()=>{try{if(parent!==window){parent.postMessage({type:'sakaker-close-app',app:'books'},location.origin);return}}catch(e){}location.href='index.html'};
})();
</script>
</body></html>
