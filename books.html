  /* =========================================================
     الصفحة الرئيسية

  .hero,

  }

  }

  /* =========================================================
     منع تمرير الصفحة الرئيسية أثناء فتح النافذة
  ========================================================= */

  body.modal-open {
    overflow: hidden !important;

  /* =========================================================
     النوافذ
     تغطي الصفحة بالكامل
  ========================================================= */

  .modal {
    position: fixed !important;

    inset: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    min-height: 100dvh !important;

    display: none;

    align-items: center !important;
    justify-content: center !important;

    padding: 20px;

    box-sizing: border-box;

    z-index: 999999 !important;

    */

    overflow: hidden;
  }

  /* =========================================================
     النافذة المفتوحة
  ========================================================= */

  .modal.show,
  .modal.active,
  .modal[style*="display: flex"],

    display: flex !important;
  }

  /* =========================================================
     لوحة المحتوى
  ========================================================= */

  .modal .panel {

    position: relative;

    width: min(950px, 94vw);

    height: min(82vh, 850px);

  ========================================================= */

    box-sizing: border-box;

  }

     شريط التمرير
  ========================================================= */

    width: 6px;
  }

    background: transparent;
  }

    background:

        #00ffc3,
        #ffd45c,
        #cfcfcf

  ========================================================= */

  }

  ========================================================= */

    align-items: center;

     أزرار المحتوى
  ========================================================= */

  .item-btn {

    border: 1px solid rgba(0,255,195,0.35);

    border-radius: 12px;

    padding: 10px 16px;

    cursor: pointer;

    color: #ffffff;

    background: rgba(0,40,34,0.65);

    transition:
      transform .2s ease,
      filter .2s ease,
      box-shadow .2s ease;
  }

  .item-btn:hover {

    transform: translateY(-2px);

    filter: brightness(1.2);

    box-shadow:
      0 0 15px rgba(0,255,195,0.35);
  }

      font-size: 27px;

      bottom: -54px !important;

let riddleIndex=0;
function renderRiddle(){
const en=document.documentElement.lang==='en',i=en?1:0,r=riddles[riddleIndex],m=document.getElementById('puzzleModal');
m.dir=en?'ltr':'rtl';m.querySelector('.panel-title').textContent=en?'20 Hard Riddles':'20 لغزًا صعبًا';m.querySelector('h3').textContent=en?'Think before revealing the solution':'فكّر قبل كشف الحل';
document.getElementById('riddleNumber').textContent=(riddleIndex+1)+' / 20';document.getElementById('puzzleQuestion').textContent=r.q[i];
document.getElementById('puzzleAnswer').textContent=r.a[i];document.getElementById('puzzleAnswer').style.display='none';
const labels=en?['Reveal solution','Next riddle','Share riddle']:['كشف الحل','اللغز التالي','مشاركة اللغز'];m.querySelectorAll('.action-row button').forEach((x,j)=>x.textContent=labels[j]);m.querySelector('.close').ariaLabel=en?'Close':'إغلاق';
}
function openPuzzle(){document.getElementById('puzzleModal').style.display='flex';renderRiddle();}
function closePuzzle(){document.getElementById('puzzleModal').style.display='none';}
function revealAnswer(){document.getElementById('puzzleAnswer').style.display='block';}
function nextRiddle(){riddleIndex=(riddleIndex+1)%20;renderRiddle();}
function shareRiddle(){const text=document.getElementById('puzzleQuestion').textContent;window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(text+'\n'+location.href),'_blank','noopener');}
new MutationObserver(()=>{if(document.getElementById('puzzleModal').style.display==='flex')renderRiddle();}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});

let quizIndex=0;

let quizScore=0;

function startQuiz(){

quizIndex=0;

quizScore=0;

document.getElementById('quizModal').style.display='block';

showQuizQuestion();

}

function showQuizQuestion(){

const q=
quizQuestions[quizIndex];

const progress=
((quizIndex)/
quizQuestions.length)*100;

document.getElementById('quizBody').innerHTML=

'<div class="progress">'+

'<div class="progress-bar" '+
'style="width:'+progress+'%">'+
'</div>'+

'</div>'+

'<h3>'+
'🧠 سؤال '+
(quizIndex+1)+
' من '+
quizQuestions.length+
'</h3>'+

'<p style="font-size:1.12rem;font-weight:700">'+
q.q+
'</p>'+

q.o.map(
(x,i)=>
'<button class="item-btn quiz-answer-btn" '+
'onclick="checkQuizAnswer('+i+', this)">'+
x+
'</button>'
).join('');

}

function checkQuizAnswer(i, button){

const correctIndex = quizQuestions[quizIndex].a;
const isCorrect = i === correctIndex;

/* إظهار النتيجة بوضوح قبل الانتقال للسؤال التالي */
if(isCorrect){
  quizScore++;
  button.classList.add('quiz-answer-correct');
  button.innerHTML = '✅ ' + button.textContent;
}else{
  button.classList.add('quiz-answer-wrong');
  button.innerHTML = '❌ ' + button.textContent;

  const buttons = document.querySelectorAll('.quiz-answer-btn');
  if(buttons[correctIndex]){
    buttons[correctIndex].classList.add('quiz-answer-correct');
    buttons[correctIndex].innerHTML = '✅ ' + buttons[correctIndex].textContent;
  }
}

document.querySelectorAll('.quiz-answer-btn').forEach(btn => {
  btn.disabled = true;
});

setTimeout(function(){
  quizIndex++;

  if(
    quizIndex<
    quizQuestions.length
  ){

    showQuizQuestion();

  }else{

    showQuizResult();

  }
}, 750);

}

function showQuizResult(){

let message='';

if(quizScore>=18){

message=
'🏆 ممتاز جدًا! مستوى معلوماتك رائع.';

}else if(quizScore>=15){

message=
'🥇 رائع! لديك معرفة قوية.';

}else if(quizScore>=11){

message=
'👏 جيد جدًا، ويمكنك الوصول إلى نتيجة أعلى.';

}else if(quizScore>=7){

message=
'👍 بداية جيدة، جرّب الاختبار مرة أخرى.';

}else{

message=
'💡 لا بأس، التحدي فرصة للتعلم وزيادة المعرفة.';

}

document.getElementById('quizBody').innerHTML=

'<div class="result">'+

'<div style="font-size:2rem">🎉</div>'+

'<strong>'+
'انتهى الاختبار'+
'</strong>'+

'<br><br>'+

'نتيجتك: '+

'<strong>'+
quizScore+
' من '+
quizQuestions.length+
'</strong>'+

'<br><br>'+

message+

'</div>'+

'<button class="item-btn" '+
'onclick="startQuiz()">'+

'🔁 إعادة الاختبار'+

'</button>';

}

function closeQuiz(){

document.getElementById('quizModal').style.display='none';

}

</script><script type="application/json" id="sak-text-refresh-data">{"culture":[["التعليم: التعلّم النشط","Education: active learning","حوّل ما تقرؤه إلى سؤال، ثم اشرح الفكرة بكلماتك واختبر فهمك بمثال. هذا الأسلوب يجعل الدراسة مشاركة فعلية بدلاً من الاكتفاء بقراءة النص.","Turn what you read into a question, explain the idea in your own words, and test your understanding with an example. This makes studying an active process rather than just reading."],["الرياضة: اللعب الجماعي","Sport: teamwork","في الرياضات الجماعية، يتكامل الأداء الفردي مع التواصل وتوزيع الأدوار. احترام المنافس والقواعد جزء من الروح الرياضية، سواء انتهت المباراة بالفوز أو الخسارة.","In team sports, individual performance works alongside communication and shared roles. Respect for opponents and rules is part of sportsmanship, whether a match ends in victory or defeat."],["الفيزياء: الطاقة","Physics: energy","يمكن أن تتحول الطاقة من شكل إلى آخر؛ فالمصباح يحوّل الطاقة الكهربائية إلى ضوء وحرارة. وفي نظام معزول تبقى الطاقة الكلية محفوظة.","Energy can change from one form to another: a lamp converts electrical energy into light and heat. In an isolated system, total energy is conserved."],["الكيمياء: الذرات والجزيئات","Chemistry: atoms and molecules","تتكون المواد من ذرات، ويمكن أن ترتبط الذرات لتكوين جزيئات. يتكون جزيء الماء من ذرتي هيدروجين وذرة أكسجين، وتكتب صيغته H₂O.","Matter consists of atoms, which can bond to form molecules. A water molecule contains two hydrogen atoms and one oxygen atom, giving it the formula H₂O."],["الأحياء: البناء الضوئي","Biology: photosynthesis","تستخدم النباتات الخضراء طاقة الضوء لصنع السكريات من الماء وثاني أكسيد الكربون، وينطلق الأكسجين أثناء هذه العملية. وتدعم هذه العملية كثيراً من السلاسل الغذائية.","Green plants use light energy to make sugars from water and carbon dioxide, releasing oxygen in the process. Photosynthesis supports many food chains."],["الفلك: الضوء القادم من النجوم","Astronomy: light from stars","يحتاج الضوء إلى وقت ليقطع المسافات في الفضاء. لذلك فإن النظر إلى نجم بعيد يعني رؤية الضوء الذي غادره في الماضي، لا رؤيته كما هو في اللحظة نفسها.","Light takes time to travel through space. Looking at a distant star therefore means seeing light that left it in the past, rather than seeing it at the same instant."],["الجغرافيا: خطوط الطول والعرض","Geography: latitude and longitude","يُستخدم خط الاستواء مرجعاً لدوائر العرض، وخط غرينتش مرجعاً لخطوط الطول. وتساعد هذه الإحداثيات على تحديد المواقع على سطح الأرض.","The equator is the reference for latitude, and the Greenwich meridian is the reference for longitude. These coordinates help identify locations on Earth."],["البيئة: التنوع الحيوي","Environment: biodiversity","يشمل التنوع الحيوي تنوع الكائنات الحية وموائلها وخصائصها الوراثية. ويمكن أن يؤثر اختفاء نوع واحد في الأنواع المرتبطة به داخل الشبكة الغذائية.","Biodiversity includes the variety of living organisms, habitats, and genetic traits. The loss of one species can affect other species connected to it in a food web."],["البحار: دورة الماء","Oceans: the water cycle","يتبخر الماء من البحار وغيرها، ثم يتكاثف في الغلاف الجوي وقد يعود إلى الأرض مطراً أو ثلجاً. ويتحرك بعد ذلك عبر الأنهار والتربة والمياه الجوفية.","Water evaporates from oceans and other surfaces, condenses in the atmosphere, and may return as rain or snow. It then moves through rivers, soil, and groundwater."],["الجيولوجيا: دورة الصخور","Geology: the rock cycle","تتكون الصخور النارية من تبرد الصهارة أو الحمم، والرسوبية من تراكم الرواسب، والمتحولة بتأثير الحرارة والضغط. ويمكن أن تتغير الصخور من نوع إلى آخر عبر الزمن.","Igneous rocks form when magma or lava cools, sedimentary rocks from accumulated sediment, and metamorphic rocks through heat and pressure. Rocks can change from one type to another over time."],["الرياضيات: النسبة المئوية","Mathematics: percentages","تعني النسبة المئوية عدداً من كل مئة؛ فـ25٪ تساوي الربع. وتفيد النسب في مقارنة المقادير، لكن المقارنة تحتاج أيضاً إلى معرفة حجم المجموعة الأصلية.","A percentage expresses a number out of one hundred: 25% equals one quarter. Percentages help compare quantities, but meaningful comparisons also require knowing the original group size."],["الإحصاء: المتوسط والوسيط","Statistics: mean and median","المتوسط الحسابي هو مجموع القيم مقسوماً على عددها، والوسيط هو القيمة الوسطى بعد ترتيبها. قد يتأثر المتوسط كثيراً بقيمة مرتفعة أو منخفضة جداً.","The arithmetic mean is the sum of values divided by their number; the median is the middle value after sorting. A very high or low value can strongly influence the mean."],["التاريخ: المصادر","History: sources","الرسائل والوثائق والآثار مصادر تساعد على دراسة الماضي. ويقارن الباحث بين المصادر ويسأل عن تاريخها وكاتبها وظروف إنتاجها قبل بناء الاستنتاجات.","Letters, documents, and artifacts help us study the past. Researchers compare sources and examine their dates, authors, and circumstances before drawing conclusions."],["اللغة: الترجمة والمعنى","Language: translation and meaning","لا تعتمد الترجمة على استبدال كل كلمة بكلمة فقط؛ فالسياق والتعبيرات الثقافية يؤثران في المعنى. وقد تحتاج العبارة الواحدة إلى صياغة مختلفة حتى تؤدي المعنى نفسه.","Translation is not simply replacing each word with another. Context and cultural expressions affect meaning, and a phrase may need different wording to convey the same idea."],["الأدب: الراوي والشخصية","Literature: narrator and character","الراوي هو الصوت الذي يحكي القصة، وقد يكون شخصية فيها أو صوتاً خارج أحداثها. وتؤثر زاوية السرد في المعلومات التي تصل إلى القارئ وفي فهمه للشخصيات.","The narrator is the voice telling a story and may be a character within it or a voice outside its events. The narrative viewpoint shapes what readers know and how they understand characters."],["الفنون: الضوء واللون","Art: light and colour","يغيّر اتجاه الضوء وطبيعته مظهر الألوان والظلال. وفي الرسم والتصوير، يساعد التباين بين المناطق المضيئة والداكنة على إظهار العمق وتوجيه الانتباه.","The direction and quality of light change the appearance of colours and shadows. In painting and photography, light–dark contrast helps convey depth and guide attention."],["الموسيقى: الإيقاع واللحن","Music: rhythm and melody","الإيقاع ينظّم الأصوات والسكتات عبر الزمن، واللحن تسلسل نغمات يُسمع كوحدة مترابطة. ويمكن للحن نفسه أن يكتسب طابعاً مختلفاً عند تغيير إيقاعه أو توزيعه.","Rhythm organizes sounds and silences over time, while melody is a sequence of notes heard as a connected whole. Changing its rhythm or arrangement can give the same melody a different character."],["الحاسوب: الخوارزمية","Computing: algorithms","الخوارزمية مجموعة خطوات مرتبة لحل مشكلة أو تنفيذ مهمة. ويمكن وصفها بالكلمات أو بمخطط قبل كتابتها بلغة برمجة.","An algorithm is an ordered set of steps for solving a problem or completing a task. It can be described in words or a diagram before being written in a programming language."],["الهندسة: المثلثات","Engineering: triangles","يُستخدم الشكل المثلث في كثير من الهياكل لأنه يحافظ على شكله عند تثبيت أطوال أضلاعه. أما الشكل الرباعي فقد يتغير شكله دون تغيير أطوال أضلاعه ما لم يُدعّم.","Triangles are used in many structures because they keep their shape when their side lengths are fixed. An unbraced quadrilateral can change shape without changing its side lengths."],["المهارات الإعلامية: التحقق","Media literacy: checking information","قبل مشاركة خبر، اقرأ المصدر الأصلي وتاريخ النشر وابحث عن تأكيد مستقل. وميّز بين الخبر والرأي والإعلان، ولا تعتبر كثرة المشاركات دليلاً على صحة المعلومة.","Before sharing a story, read the original source and publication date and look for independent confirmation. Distinguish reporting, opinion, and advertising; popularity alone does not establish accuracy."]],"facts":[["القمر","The Moon","يعكس القمر ضوء الشمس، ولا ينتج ضوءه المرئي الخاص مثل النجوم.","The Moon reflects sunlight; it does not produce its own visible light as stars do."],["الصوت","Sound","الصوت موجة ميكانيكية تحتاج إلى وسط تنتقل فيه، ولذلك لا ينتقل في الفراغ.","Sound is a mechanical wave that needs a medium, so it does not travel through a vacuum."],["الضوء","Light","عندما يمر الضوء الأبيض عبر منشور زجاجي، تنحرف ألوانه بمقادير مختلفة فتظهر ألوان الطيف.","When white light passes through a glass prism, its colours bend by different amounts, producing a spectrum."],["الجليد","Ice","الجليد أقل كثافة من الماء السائل، ولذلك يطفو على سطحه.","Ice is less dense than liquid water, which is why it floats."],["الحديد","Iron","صدأ الحديد ينتج عن تفاعله مع الأكسجين في وجود الماء أو الرطوبة.","Iron rusts through reactions with oxygen in the presence of water or moisture."],["البوصلة","The compass","تتجه إبرة البوصلة وفق المجال المغناطيسي المحلي للأرض، ولا تشير دائماً إلى الشمال الجغرافي نفسه.","A compass needle aligns with Earth’s local magnetic field and does not always point exactly toward geographic north."],["الفصول","Seasons","يرجع تعاقب الفصول أساساً إلى ميل محور الأرض أثناء دورانها حول الشمس.","The seasons are mainly caused by the tilt of Earth’s axis as it orbits the Sun."],["الخفافيش","Bats","الخفافيش ثدييات، وترضع صغارها الحليب مثل سائر الثدييات.","Bats are mammals and feed their young milk, like other mammals."],["الحشرات","Insects","للحشرات البالغة ست أرجل، بينما للعناكب ثماني أرجل وليست من الحشرات.","Adult insects have six legs. Spiders have eight legs and are not insects."],["الفطريات","Fungi","الفطريات ليست نباتات؛ فهي تنتمي إلى مجموعة مختلفة وتحصل على غذائها بامتصاص المواد العضوية.","Fungi are not plants: they belong to a different group and obtain nutrients by absorbing organic material."],["البذور","Seeds","تحتوي البذرة على جنين نباتي، وتحتاج عملية الإنبات إلى ظروف مناسبة تختلف باختلاف النوع.","A seed contains a plant embryo, and germination requires suitable conditions that vary by species."],["الشطرنج","Chess","تتكوّن رقعة الشطرنج من ثمانية صفوف وثمانية أعمدة، أي 64 مربعاً.","A chessboard has eight rows and eight columns, making 64 squares."],["الأعداد الأولية","Prime numbers","العدد الأولي عدد صحيح أكبر من واحد له قاسمان موجبان فقط: الواحد والعدد نفسه.","A prime number is an integer greater than one with exactly two positive divisors: one and itself."],["المثلث","Triangles","في الهندسة المستوية الإقليدية، مجموع الزوايا الداخلية للمثلث يساوي 180 درجة.","In Euclidean plane geometry, a triangle’s interior angles add up to 180 degrees."],["الخرائط","Maps","مقياس الرسم يربط المسافة على الخريطة بالمسافة المقابلة لها على الأرض.","A map’s scale relates a distance on the map to the corresponding distance on the ground."],["البارومتر","The barometer","البارومتر جهاز لقياس الضغط الجوي، وهو مختلف عن مقياس الحرارة.","A barometer measures atmospheric pressure, unlike a thermometer, which measures temperature."],["البايت","The byte","في الحوسبة الحديثة، يتكوّن البايت عادةً من ثمانية بِتّات، وكل بِت يمثل صفراً أو واحداً.","In modern computing, a byte normally contains eight bits, each representing a zero or a one."],["الألوان على الشاشة","Screen colours","تعتمد كثير من الشاشات على مزج الضوء الأحمر والأخضر والأزرق لتكوين ألوان الصورة.","Many screens mix red, green, and blue light to produce the colours in an image."],["الجاذبية","Gravity","تبقى الكواكب في مداراتها حول الشمس بفعل الجاذبية مع حركتها المستمرة.","Gravity, together with their ongoing motion, keeps planets in orbit around the Sun."],["الأرشيف","Archives","يساعد حفظ تاريخ الوثيقة ومصدرها على فهم سياقها والرجوع إليها لاحقاً.","Recording a document’s date and source helps preserve its context and makes it easier to consult later."]]}</script><style id="sak-text-refresh-style">

  const root=document.createElement('div');root.dataset.sakTextView=kind;
  document.getElementById('folderTitle').textContent=labels[kind][en()?1:0];
  if(kind==='culture')data.culture.forEach((item,i)=>root.append(entry(item,i)));
  if(kind==='daily'){
   const now=new Date(),today=localDayKey(now)%data.facts.length;
   root.dataset.dayKey=String(localDayKey(now));
   const note=document.createElement('p');note.className='sak-text-section-note';
   note.textContent=new Intl.DateTimeFormat(en()?'en-GB':'ar',{dateStyle:'full'}).format(now)+(en()?' — A different fact each day from this 20-fact collection.':' — معلومة مختلفة كل يوم من هذه المجموعة المكوّنة من 20 معلومة.');
   const featured=entry(data.facts[today]);featured.classList.add('sak-text-daily-feature');
   const archive=document.createElement('details');const summary=document.createElement('summary');
   summary.textContent=en()?'Browse all 20 facts':'تصفّح المعلومات العشرين';archive.append(summary);
   data.facts.forEach((item,i)=>archive.append(entry(item,i)));root.append(note,featured,archive);
  }
  if(kind==='about')root.append(entry(about),entry(mission));
  if(kind==='wisdom'){
   (window.sakWisdomLibrary||[]).forEach((item,i)=>root.append(entry(['حكمة ومثل','Wisdom & proverb',item.ar,item.en],i)));
  }
  host.replaceChildren(root);
 };
 window.openWisdomLibrary=function(){
  window.sakRenderTextSection('wisdom',document.getElementById('folderBody'));
  document.getElementById('folderModal').style.display='block';
 };
 window.sakRenderSiteNews=function(host){
  const update=entry(['آخر التحديثات','Latest updates','تمت إضافة دفعة جديدة من 400 فيديو إلى مكتبة الفيديو: 50 فيديو لكل واحد من الأقسام الثمانية غير الدينية، مع الإبقاء على دفعة الـ400 السابقة كاملة. أصبح مجموع دفعتَي التحديث 800 فيديو، بينما بقي القسم الديني دون تغيير. كما يستمر دعم العربية والإنجليزية وتحسين العرض على الجوال والكمبيوتر.','A new batch of 400 videos has been added to the video library: 50 videos for each of the eight non-religious sections, while keeping the previous 400-video batch intact. The two update batches now total 800 videos, and the Islamic section remains unchanged. Arabic/English support and mobile/desktop display improvements are also retained.']);
  const free=entry(['اشتراك مجاني لفترة محدودة','Limited-time free subscription','تم منح اشتراك مجاني لفترة محدودة. من يرغب بذلك يمكنه زيارة صفحتي على فيس بوك، أو الضغط على نورس فيس بوك، ثم زيارة موقع abwalqmrzmrd؛ ستجدون الرابط المجاني هناك.','A free subscription is available for a limited time. If you would like it, visit my Facebook page or tap the Facebook seagull, then visit abwalqmrzmrd; the free link is available there.']);
  const action=document.createElement('button');action.type='button';action.className='sak-facebook-free-button';
  action.textContent=en()?'Open Facebook seagull':'فتح نورس فيس بوك';
  action.addEventListener('click',()=>{const gull=document.getElementById('facebookVideoIcon');if(gull)gull.click();});
  free.appendChild(action);
  host.replaceChildren(update,free);
 };
 function refresh(){
  const host=document.getElementById('folderBody'),root=host?.querySelector('[data-sak-text-view]');
  if(root)window.sakRenderTextSection(root.dataset.sakTextView,host);
  const news=document.getElementById('sakakerSiteNewsText');if(news)window.sakRenderSiteNews(news);
 }
 new MutationObserver(refresh).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
 setInterval(()=>{
  const root=document.querySelector('#folderBody [data-sak-text-view="daily"]');
  if(root&&root.dataset.dayKey!==String(localDayKey()))window.sakRenderTextSection('daily',root.parentElement);
 },60000);
 refresh();
})();
</script></body></html>
